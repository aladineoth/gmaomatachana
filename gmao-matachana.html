<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GMAO — Matachana Service</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12313F">
<link rel="apple-touch-icon" href="pwa/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GMAO Matachana">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F4EF;
    --panel:#FFFFFF;
    --ink:#16242B;
    --ink-soft:#5C6B71;
    --ink-faint:#93A0A5;
    --primary:#12313F;
    --primary-soft:#1C4353;
    --accent:#2B6CB0;
    --accent-soft:#E5EEF8;
    --amber:#E39B3A;
    --amber-soft:#FCEFDC;
    --indigo:#3D5C8C;
    --indigo-soft:#E7ECF5;
    --green:#3E8F5C;
    --green-soft:#E5F3EA;
    --purple:#7C5C93;
    --purple-soft:#F0E7F4;
    --orange:#C4712C;
    --orange-soft:#F8E7D6;
    --gold:#9A6B12;
    --gold-soft:#F5EBD5;
    --red:#C6453F;
    --red-soft:#FBE7E6;
    --border:#E4E0D4;
    --radius:10px;
    --shadow:0 1px 2px rgba(18,49,63,.06), 0 4px 14px rgba(18,49,63,.05);
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh; display:flex;}

  /* ---------- Generic ---------- */
  .btn{
    font-family:var(--font-body); font-weight:600; font-size:13px;
    padding:9px 16px; border-radius:8px; border:1px solid transparent;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    transition:filter .12s ease, transform .05s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; color:var(--primary); border-color:var(--border);}
  .btn-ghost:hover{background:#F0EEE5;}
  .btn-sm{padding:6px 11px; font-size:12px;}
  .btn-danger{background:#fff; color:#B23B3B; border-color:#EAD3D3;}
  .btn-block{width:100%; justify-content:center;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
  .empty{
    padding:34px 18px; text-align:center; color:var(--ink-faint); font-size:13.5px;
    border:1.5px dashed var(--border); border-radius:var(--radius); background:#FBFAF6;
  }
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-faint); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--border);}
  td{padding:12px 14px; border-bottom:1px solid #F0EEE5; vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .serial{font-family:var(--font-mono); font-size:12.5px; color:var(--primary-soft); background:#F0EEE5; padding:2px 6px; border-radius:5px;}
  label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin:14px 0 5px;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=password], input[type=date], select, textarea{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:7px;
    font-family:var(--font-body); font-size:13.5px; background:#fff; color:var(--ink);
  }
  textarea{resize:vertical; min-height:64px;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .field-hint{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600; font-family:var(--font-mono);
    padding:3px 9px; border-radius:20px; letter-spacing:.2px; white-space:nowrap;
  }
  .pill.A1{background:var(--accent-soft); color:var(--accent);}
  .pill.A2{background:var(--indigo-soft); color:var(--indigo);}
  .pill.S1{background:#EEF0EA; color:var(--ink-soft);}
  .pill.S2{background:var(--purple-soft); color:var(--purple);}
  .pill.PARTENARIAT{background:var(--orange-soft); color:var(--orange);}
  .pill.CP{background:var(--gold-soft); color:var(--gold);}
  .pill.A_CONFIRMER{background:#ECEAE0; color:var(--ink-faint);}
  .secteur-tag{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:20px; background:var(--primary-soft); color:#EAF1EF;}
  .status-tag{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:20px;}
  .status-demande{background:var(--amber-soft); color:#8A5A0E;}
  .status-creee{background:var(--indigo-soft); color:var(--indigo);}
  .status-planifiee{background:var(--accent-soft); color:var(--accent);}
  .status-terminee{background:var(--green-soft); color:var(--green);}
  .status-gerée_client{background:#EEEEEE; color:var(--ink-faint);}
  .demande-dot{width:11px; height:11px; border-radius:50%; flex:none; display:inline-block; box-shadow:0 0 0 3px rgba(0,0,0,.04);}
  .demande-dot.rouge{background:var(--red);}
  .demande-dot.orange{background:var(--amber);}
  .demande-dot.vert{background:var(--green);}
  .call-input{padding:8px 10px; border:1px solid var(--border); border-radius:7px; font-size:13px; font-family:var(--font-mono);}
  .flex-between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .muted{color:var(--ink-soft);}
  .section-title{font-family:var(--font-display); font-size:15px; font-weight:600; margin:0 0 12px; display:flex; justify-content:space-between; align-items:center;}
  .section-gap{margin-bottom:22px;}
  .helper-note{font-size:12px; color:var(--ink-faint); margin-top:2px;}

  /* ---------- Overlay / modal ---------- */
  .overlay{position:fixed; inset:0; background:rgba(15,25,29,.45); display:flex; align-items:center; justify-content:center; z-index:80; padding:20px;}
  .modal{background:#fff; border-radius:14px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal-head{padding:20px 24px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start;}
  .modal-head h3{margin:0 0 3px; font-family:var(--font-display); font-size:17px;}
  .modal-head p{margin:0; font-size:12.5px; color:var(--ink-soft);}
  .modal-close{cursor:pointer; color:var(--ink-faint); font-size:20px; background:none; border:none; line-height:1;}
  .modal-body{padding:18px 24px 6px;}
  .modal-foot{padding:16px 24px 22px; display:flex; justify-content:flex-end; gap:10px;}
  .toast{position:fixed; bottom:22px; right:22px; background:var(--primary); color:#fff; padding:12px 18px; border-radius:9px; font-size:13.5px; box-shadow:0 10px 30px rgba(0,0,0,.25); z-index:90; animation:toastin .18s ease;}
  @keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  /* ============ LANDING & LOGIN ============ */
  .portal-screen{
    flex:1; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 20% 15%, #16324c, #0e2338 55%);
    padding:30px;
  }
  .portal-card{width:100%; max-width:1080px;}
  .portal-brand{color:#EAF1EF; text-align:center; margin-bottom:34px;}
  .portal-brand .pb-name{font-family:var(--font-display); font-weight:700; font-size:30px; letter-spacing:.2px;}
  .portal-brand .pb-sub{font-family:var(--font-mono); font-size:11.5px; letter-spacing:2px; text-transform:uppercase; color:#8FB7AE; margin-top:4px;}
  .portal-choices{display:grid; grid-template-columns:repeat(3, 1fr); gap:20px;}
  @media (max-width:920px){.portal-choices{grid-template-columns:1fr;}}
  .portal-choice{
    background:#fff; border-radius:16px; padding:28px 26px; cursor:pointer; border:1px solid transparent;
    box-shadow:0 20px 50px rgba(0,0,0,.25); transition:transform .12s ease, box-shadow .12s ease;
  }
  .portal-choice:hover{transform:translateY(-3px); box-shadow:0 26px 60px rgba(0,0,0,.32);}
  .portal-choice .pc-icon{
    width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:16px;
  }
  .portal-choice.client .pc-icon{background:var(--accent-soft); color:var(--accent);}
  .portal-choice.tech .pc-icon{background:var(--purple-soft); color:var(--purple);}
  .portal-choice.staff .pc-icon{background:var(--indigo-soft); color:var(--indigo);}
  .portal-choice h3{font-family:var(--font-display); font-size:18px; margin:0 0 6px;}
  .portal-choice p{margin:0 0 14px; font-size:13px; color:var(--ink-soft); line-height:1.5;}
  .portal-choice .pc-go{font-size:12.5px; font-weight:700; color:var(--accent); display:flex; align-items:center; gap:5px;}
  .portal-choice.tech .pc-go{color:var(--purple);}
  .portal-choice.staff .pc-go{color:var(--indigo);}
  .portal-foot{text-align:center; margin-top:22px;}
  .portal-foot .reset-link{color:#8FB7AE; cursor:pointer; text-decoration:underline; font-size:12px;}

  .login-card{background:#fff; border-radius:16px; padding:30px 30px 26px; max-width:400px; margin:0 auto; box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .login-card .back-link{font-size:12.5px; color:var(--ink-faint); cursor:pointer; display:inline-flex; align-items:center; gap:5px; margin-bottom:16px;}
  .login-card h2{font-family:var(--font-display); font-size:19px; margin:0 0 4px;}
  .login-card .sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:18px;}
  .login-error{background:var(--red-soft); color:#8A2E2A; font-size:12.5px; padding:8px 11px; border-radius:7px; margin-bottom:6px;}
  .demo-hint{margin-top:20px; padding:12px 14px; background:#F7F6F1; border:1px solid var(--border); border-radius:9px; font-size:11.5px; color:var(--ink-soft);}
  .demo-hint strong{color:var(--ink);}
  .demo-hint .dh-row{display:flex; justify-content:space-between; padding:2px 0; font-family:var(--font-mono); font-size:11px;}

  /* ============ APP SHELL (client + internal) ============ */
  .app-shell{display:flex; flex:1; min-width:0;}
  .sidebar{
    width:230px; flex:none; background:linear-gradient(180deg,#0e2338,#16324c); color:#c9d6e4;
    display:flex; flex-direction:column; padding:22px 14px; position:sticky; top:0; height:100vh;
    transition:width .16s ease, padding .16s ease; overflow:hidden;
  }
  .sidebar.collapsed{width:60px; padding:22px 8px;}
  .sidebar.collapsed .brand-tag, .sidebar.collapsed .brand-sub, .sidebar.collapsed .client-id-box,
  .sidebar.collapsed .nav-group-label, .sidebar.collapsed .sidebar-foot, .sidebar.collapsed .brand > span,
  .sidebar.collapsed .brand-logo{display:none;}
  .sidebar.collapsed .brand::after{content:''; display:block; width:26px; height:26px; margin:0 auto; border-radius:7px; background:rgba(255,255,255,.14);}
  .sidebar.collapsed .brand{justify-content:center; padding:0;}
  .sidebar.collapsed .nav-item{justify-content:center; padding:10px 4px; font-size:0; position:relative;}
  .sidebar.collapsed .nav-item svg{flex:none;}
  .sidebar.collapsed .nav-item .badge{position:absolute; top:2px; right:2px; transform:scale(.8); font-size:10.5px;}
  .sidebar-collapse-btn{
    position:absolute; top:18px; right:-12px; width:24px; height:24px; border-radius:50%;
    background:var(--primary); border:2px solid #0D2530; color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:12px; z-index:20; box-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  .brand{font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:.2px; padding:0 8px 0; display:flex; align-items:baseline; gap:6px;}
  .brand-logo{height:20px; width:auto; filter:brightness(0) invert(1); display:block;}
  .brand-tag{padding:0 8px 4px; font-family:var(--font-mono); font-size:10px; font-weight:500; color:#8FB7AE; letter-spacing:1.5px; text-transform:uppercase;}
  .portal-logo{height:34px; width:auto; display:block; margin:0 auto 10px; filter:brightness(0) invert(1);}
  .brand small{font-family:var(--font-mono); font-size:10px; font-weight:500; color:#8FB7AE; letter-spacing:1.5px; text-transform:uppercase;}
  .brand-sub{padding:0 8px 22px; font-size:11.5px; color:#87A0A8; border-bottom:1px solid rgba(255,255,255,.09); margin-bottom:16px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:8px; color:#C7D6D6; cursor:pointer; font-size:14px; font-weight:500; margin-bottom:3px; border:1px solid transparent; transition:background .12s ease, color .12s ease;}
  .nav-item svg{flex:none; opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{background:rgba(29,122,114,.28); color:#fff; border-color:rgba(29,122,114,.55);}
  .nav-item .badge{margin-left:auto; background:var(--amber); color:#3A2A0B; font-family:var(--font-mono); font-size:10.5px; font-weight:600; padding:1px 6px; border-radius:20px; min-width:18px; text-align:center;}
  .sidebar-foot{margin-top:auto; padding:10px 8px 2px; font-size:11px; color:#6D8A90; border-top:1px solid rgba(255,255,255,.09); padding-top:14px;}
  .reset-link{color:#8FB7AE; cursor:pointer; text-decoration:underline; text-underline-offset:2px;}
  .client-id-box{background:rgba(255,255,255,.07); border-radius:9px; padding:10px 11px; margin-bottom:16px;}
  .client-id-box .ci-name{font-weight:600; font-size:13px; color:#fff; margin-bottom:2px;}
  .client-id-box .ci-contract{font-size:10.5px; color:#8FB7AE; font-family:var(--font-mono);}
  .logout-link{color:#E8A9A6; cursor:pointer; font-size:12px; display:flex; align-items:center; gap:6px;}

  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{padding:14px 32px 12px; border-bottom:1px solid var(--border); background:var(--panel); display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;}
  .mobile-topbar-logout{display:none;}
  .topbar h1{font-family:var(--font-display); font-size:20px; margin:0 0 2px; font-weight:600; letter-spacing:.1px;}
  .topbar p{margin:0; color:var(--ink-soft); font-size:12.5px;}
  .content{padding:14px 32px 16px; flex:1;}

  /* ---------- Client app ---------- */
  .client-grid{display:grid; grid-template-columns:1.1fr 1.4fr; gap:22px; align-items:start;}
  @media (max-width:920px){.client-grid{grid-template-columns:1fr;}}
  .contract-banner{padding:16px 18px; border-radius:var(--radius); background:var(--panel); border:1px solid var(--border); margin-bottom:18px;}
  .contract-banner .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .machine-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 4px; border-bottom:1px solid #F0EEE5; font-size:13.5px;}
  .machine-row:last-child{border-bottom:none;}
  .req-panne{background:#FBFAF6; border:1px solid #F0EEE5; border-radius:7px; padding:9px 11px; font-size:13px; color:var(--ink); margin-bottom:12px;}

  /* ---------- Bureau ---------- */
  .req-card{padding:16px 18px; margin-bottom:12px;}
  .req-top{display:flex; justify-content:space-between; gap:12px; margin-bottom:8px;}
  .req-top .client-name{font-weight:600; font-size:14.5px;}
  .req-meta{color:var(--ink-soft); font-size:12.5px; margin-bottom:10px; line-height:1.5;}

  /* ---------- Admin ---------- */
  .admin-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:980px){.admin-grid{grid-template-columns:1fr;}}
  .admin-shell{display:flex; gap:20px; align-items:flex-start;}
  .admin-nav{width:210px; flex:none; background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:10px; position:sticky; top:14px;}
  .admin-nav-item{display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:8px; font-size:13px; font-weight:500; color:var(--ink-soft); cursor:pointer; margin-bottom:2px;}
  .admin-nav-group-label{font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-faint); padding:14px 11px 5px;}
  .admin-nav-group-label:first-child{padding-top:2px;}
  .admin-nav-item:hover{background:#F7F6F1;}
  .admin-nav-item.active{background:var(--primary); color:#fff;}
  .admin-content{flex:1; min-width:0; display:flex; flex-direction:column; gap:20px;}
  @media (max-width:860px){ .admin-shell{flex-direction:column;} .admin-nav{width:100%; position:relative; top:0; display:flex; flex-wrap:wrap; gap:4px;} .admin-nav-item{flex:1 1 auto;} }
  .list-item{display:flex; align-items:center; justify-content:space-between; padding:10px 4px; border-bottom:1px solid #F0EEE5; font-size:13px; gap:10px;}
  .org-tree{max-height:calc(100vh - 260px); min-height:400px; overflow-y:auto; margin-top:4px;}
  .org-dept{border:1px solid var(--border); border-radius:10px; margin-bottom:8px; overflow:hidden;}
  .org-dept-head{display:flex; align-items:center; gap:9px; padding:11px 14px; background:#F7F6F1; cursor:pointer; font-weight:700; font-size:13px;}
  .org-dept-head:hover{background:#F1EFE4;}
  .org-dept-label{flex:1;}
  .org-caret{width:12px; flex:none; color:var(--ink-faint); font-size:11px;}
  .org-children{padding:6px 10px 10px 30px; border-top:1px solid var(--border);}
  .org-client{border-left:2px solid var(--border); margin-bottom:4px;}
  .org-client-head{display:flex; align-items:center; gap:9px; padding:9px 10px; cursor:pointer; border-radius:8px;}
  .org-client-head:hover{background:#FAF9F4;}
  .org-client-name{font-weight:600; font-size:12.5px;}
  .org-machine{display:flex; align-items:center; gap:9px; padding:7px 10px 7px 26px; cursor:pointer; border-radius:7px; font-size:12px;}
  .org-machine:hover{background:#FAF9F4;}
  .org-machine-name{font-weight:600; font-size:12px;}
  /* Organigramme visuel client → machines, façon CapiLog : boîtes reliées par des traits */
  .orgchart-wrap{overflow-x:auto; padding:6px 4px 14px;}
  .orgchart{display:flex; flex-direction:column; align-items:center; min-width:min-content;}
  .oc-root{position:relative; padding-bottom:22px;}
  .oc-root::after{content:''; position:absolute; bottom:0; left:50%; width:2px; height:22px; background:#D8D4C8; transform:translateX(-50%);}
  .oc-row{display:flex; justify-content:center;}
  .oc-col{position:relative; padding:22px 10px 0;}
  .oc-col::before, .oc-col::after{content:''; position:absolute; top:0; right:50%; width:50%; height:22px; border-top:2px solid #D8D4C8;}
  .oc-col::after{right:auto; left:50%; border-left:2px solid #D8D4C8; border-top:2px solid #D8D4C8;}
  .oc-col:only-child::before, .oc-col:only-child::after{display:none;}
  .oc-col:first-child::before{border:0 none;}
  .oc-col:last-child::after{border:0 none;}
  .oc-box{background:#fff; border:1px solid var(--border); border-radius:8px; min-width:150px; box-shadow:0 1px 3px rgba(18,49,63,.08); overflow:hidden;}
  .oc-box-root{padding:10px 16px; font-weight:700; font-size:13px; background:var(--primary); color:#fff; display:flex; align-items:center; gap:8px; border-radius:8px; white-space:nowrap;}
  .oc-box-machine{cursor:pointer; transition:transform .1s ease, box-shadow .15s ease;}
  .oc-box-machine:hover{transform:translateY(-2px); box-shadow:0 4px 10px rgba(18,49,63,.16);}
  .oc-box-head{padding:7px 10px; font-weight:700; font-size:11.5px; background:#F7F6F1; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .oc-box-body{padding:7px 10px;}
  .list-item:last-child{border-bottom:none;}
  .tech-color-swatch{width:14px; height:14px; border-radius:4px; flex:none;}
  .login-tag{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); background:#F0EEE5; padding:2px 6px; border-radius:5px;}

  /* ============ PLANNING — TIMELINE (Gantt) ============ */
  .planning-layout{
    display:grid; grid-template-columns:230px 1fr; gap:16px; align-items:stretch;
    height:calc(100vh - 145px); min-height:420px;
  }
  @media (max-width:1080px){.planning-layout{grid-template-columns:1fr; height:auto;}}
  .backlog-panel{
    position:static; height:100%; overflow-y:auto; overflow-x:hidden; min-height:0;
    display:flex; flex-direction:column; padding-right:4px;
  }
  .backlog-list{padding:6px; min-height:60px;}
  .job-card{
    background:#fff; border:1px solid var(--border); border-radius:9px; padding:11px 12px; margin-bottom:9px;
    cursor:grab; box-shadow:0 1px 2px rgba(18,49,63,.05); border-left:4px solid var(--accent);
  }
  .job-card.dragging{opacity:.35;}
  .job-card.selected-for-placement{border-left-color:#E8952F; background:#FFF8EC; box-shadow:0 0 0 2px #E8952F, 0 2px 8px rgba(232,149,47,.25);}
  .job-card .jc-selected-hint{margin-top:8px; font-size:11px; font-weight:600; color:#8A6416; background:#FCEFD6; border-radius:6px; padding:5px 7px;}
  .placement-banner{
    display:flex; align-items:center; gap:10px; background:#FCEFD6; color:#5C4310; border:1px solid #E8B25A;
    border-radius:8px; padding:8px 12px; margin-bottom:8px; font-size:12.5px; font-weight:600; flex:none;
  }
  .kpi-strip{display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:14px;}
  .kpi-tile{background:var(--panel); padding:12px 16px; position:relative;}
  .kpi-tile::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--kpi-color,var(--accent));}
  .kpi-tile .k-label{font-size:10px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .kpi-tile .k-row{display:flex; align-items:baseline; gap:7px;}
  .kpi-tile .k-num{font-family:var(--font-mono); font-size:20px; font-weight:700; line-height:1; color:var(--ink);}
  .kpi-tile .k-trend{font-size:10.5px; font-weight:700; font-family:var(--font-mono);}
  .kpi-tile .k-trend.up{color:#3C8560;} .kpi-tile .k-trend.down{color:#B4562F;}
  .kpi-tile .k-sub{font-size:10.5px; color:var(--ink-faint); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  @media (max-width:900px){ .kpi-strip{grid-template-columns:repeat(2,1fr);} }
  .gantt-scroll.placement-active{cursor:default;}
  .gantt-scroll.placement-active .gantt-daybg{cursor:pointer;}
  .gantt-scroll.placement-active .gantt-daybg:hover{background:rgba(232,149,47,.28) !important;}
  .job-card .jc-top{display:flex; justify-content:space-between; gap:8px; margin-bottom:5px;}
  .job-card .jc-client{font-weight:600; font-size:13px;}
  .job-card .jc-panne{font-size:12px; color:var(--ink-soft); line-height:1.4; margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .job-card .jc-foot{display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:10.5px; color:var(--ink-faint);}
  .backlog-empty-drop{border:1.5px dashed var(--border); border-radius:8px; padding:14px; text-align:center; color:var(--ink-faint); font-size:11.5px; margin-bottom:8px;}
  .backlog-empty-drop.dragover{background:var(--accent-soft); border-color:var(--accent);}

  /* ============ Thème "Toggl Plan" — frise de planning (bleu marine Matachana) ============ */
  :root{
    --tg-bg:#0E2733;
    --tg-bg-alt:#163646;
    --tg-today:#2A2312;
    --tg-border:rgba(255,255,255,.09);
    --tg-text:#EAF3F6;
    --tg-text-soft:#9FC1CE;
    --tg-accent:#AD8A45;
    --tg-accent-soft:rgba(173,138,69,.22);
    --tg-red:#C1573A;
    --tg-green:#4FB85C;
    --tg-beige:#DCC9A0;
    --tg-gray:#B7B3C6;
    --tg-teal:#1F3D3B;
    --tg-gold:#AD8A45;
    --tg-ring-track:rgba(255,255,255,.16);
  }
  /* Thème clair — c'est aussi un vrai choix disponible dans Toggl Plan (réglage personnel) */
  body.tg-light{
    --tg-bg:#FFFFFF;
    --tg-bg-alt:#F7F6F2;
    --tg-today:#F7EFDC;
    --tg-border:#E7E4DA;
    --tg-text:#232323;
    --tg-text-soft:#8A8778;
    --tg-accent-soft:rgba(173,138,69,.15);
    --tg-ring-track:#E4E0D2;
  }
  body.tg-light .gantt-daybg.weekend{background:#F5F3EC;}
  body.tg-light .gantt-daycell-head.weekend{background:#F5F3EC;}
  body.tg-light .gantt-avatar{box-shadow:0 0 0 2px rgba(0,0,0,.06);}
  .theme-toggle{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--tg-border); border-radius:8px;
    background:var(--tg-bg-alt); color:var(--tg-text-soft); padding:7px 12px; font-size:12px; font-weight:600; cursor:pointer;
  }
  .theme-toggle:hover{color:var(--tg-text);}
  .month-nav{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  .month-nav .lbl{font-family:var(--font-display); font-size:15px; color:var(--ink); font-weight:600; text-transform:capitalize; min-width:150px;}
  .month-nav select{padding:6px 8px; border:1px solid var(--tg-border); border-radius:7px; font-size:12.5px; background:var(--tg-bg-alt); color:var(--tg-text); width:auto;}

  .gantt-scroll{overflow:auto; border:1px solid var(--tg-border); border-radius:var(--radius); background:var(--tg-bg); cursor:grab; flex:1; min-height:0;}
  .gantt-scroll.panning{cursor:grabbing; user-select:none;}
  .gantt-grid{transition:transform .15s ease;}
  .gantt-grid{display:grid; position:relative; background:var(--tg-bg);}
  .gantt-corner{position:sticky; top:0; left:0; z-index:5; background:var(--tg-bg-alt); border-right:1px solid var(--tg-border); border-bottom:1px solid var(--tg-border);}
  .gantt-daycell-head{
    position:sticky; top:0; z-index:3; background:var(--tg-bg-alt); border-right:1px solid var(--tg-border); border-bottom:1px solid var(--tg-border);
    padding:6px 0; text-align:center; font-size:10px; color:var(--tg-text-soft); font-weight:600; text-transform:uppercase;
  }
  .gantt-daycell-head.weekend{background:#0A1D26;}
  .gantt-daycell-head.today{background:var(--tg-today); color:var(--tg-text);}
  .gantt-daycell-head .dnum{display:block; font-family:var(--font-mono); font-size:13px; color:var(--tg-text); margin-top:1px;}
  .gantt-daycell-head.today .dnum{color:#fff; font-weight:700;}
  .day-pulse{display:flex; align-items:flex-end; gap:1.5px; height:12px; justify-content:center; margin-top:5px;}
  .day-pulse span{width:3px; border-radius:1.5px; background:var(--tg-border);}
  .day-pulse span.on{background:var(--tg-accent);}
  .gantt-daycell-head.today .day-pulse span.on{background:#fff;}
  .gantt-techname{
    position:sticky; left:0; z-index:2; background:var(--tg-bg-alt); border-right:1px solid var(--tg-border); border-bottom:1px solid var(--tg-border);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:6px 4px; text-align:center;
  }
  .gantt-avatar{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:10.5px; font-weight:700; flex:none; box-shadow:0 0 0 2px rgba(255,255,255,.12);}
  .tech-ring{width:30px; height:30px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; padding:2.5px;}
  .tech-ring-hole{width:100%; height:100%; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:9.5px; font-weight:700; box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);}
  .gantt-techname .tname{font-weight:600; font-size:10.5px; color:var(--tg-text); line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;}
  .gantt-techname .tname .muted{color:var(--tg-text-soft) !important; font-size:9.5px;}
  .gantt-daybg{border-right:1px solid var(--tg-border); border-bottom:1px solid var(--tg-border); background:var(--tg-bg); transition:background .1s ease; position:relative;}
  .gantt-daybg::after{content:''; position:absolute; left:4px; right:4px; top:50%; border-top:1px dashed transparent; pointer-events:none;}
  .gantt-daybg:hover::after{border-top-color:var(--tg-border);}
  .gantt-daybg.dragover-upper{background:linear-gradient(to bottom, var(--tg-accent-soft) 0 50%, var(--tg-bg) 50% 100%);}
  .gantt-daybg.dragover-lower{background:linear-gradient(to bottom, var(--tg-bg) 0 50%, var(--tg-accent-soft) 50% 100%);}
  .gantt-daybg.weekend{background:#0A1D26;}
  .gantt-daybg.today-col{background:var(--tg-today);}
  .gantt-daybg.weekend.today-col{background:#332C16;}
  .gantt-daybg.dragover{outline:1px solid var(--tg-accent);}
  .gantt-team-band{
    position:sticky; left:0; z-index:2; background:var(--tg-teal); color:#EAF7F0; display:flex; align-items:center; gap:10px;
    padding:0 14px; font-family:var(--font-display); font-size:11.5px; font-weight:700; letter-spacing:.4px;
    border-bottom:1px solid var(--tg-border);
  }
  .gantt-team-band .team-count{font-family:var(--font-mono); font-weight:500; font-size:10.5px; color:#9CC9BB; letter-spacing:0;}
  .zoom-toggle{display:inline-flex; border:1px solid var(--tg-border); border-radius:8px; overflow:hidden; background:var(--tg-bg-alt);}
  .zoom-toggle button{
    border:none; background:transparent; padding:7px 12px; font-size:12px; font-weight:600; color:var(--tg-text-soft); cursor:pointer;
  }
  .zoom-toggle button.active{background:var(--tg-accent); color:#fff;}
  .zoom-toggle button:not(:last-child){border-right:1px solid var(--tg-border);}

  .gantt-bar{
    align-self:center; margin:0 2px; height:36px; border-radius:8px; background:var(--tg-gray);
    color:#241933; font-size:10px; padding:0 6px 0 7px; display:flex; flex-direction:column; justify-content:center;
    overflow:hidden; cursor:grab; position:relative; z-index:1;
    box-shadow:0 1px 2px rgba(20,35,43,.08), 0 1px 4px rgba(20,35,43,.06);
    transition:transform .1s ease, box-shadow .15s ease;
  }
  .gantt-bar:hover{ transform:translateY(-1px); box-shadow:0 4px 10px rgba(20,35,43,.16); z-index:5; }
  .gantt-bar.dragging{opacity:.4;}
  .dash-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:14px; margin-bottom:22px;}
  .dash-kpi{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px;}
  .dash-kpi .dk-value{font-size:28px; font-weight:800; line-height:1.1; color:var(--ink);}
  .dash-kpi .dk-label{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .dash-kpi .dk-sub{font-size:11px; margin-top:6px; font-weight:600;}
  .dash-kpi.warn .dk-value{color:#B23B3B;}
  .dash-section{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:18px;}
  .dash-section-title{font-weight:700; font-size:13.5px; margin-bottom:14px;}
  .dash-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px;}
  .dash-bar-label{width:150px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft);}
  .dash-bar-track{flex:1; background:#F1EFE7; border-radius:5px; height:16px; overflow:hidden; position:relative;}
  .dash-bar-fill{height:100%; border-radius:5px; background:var(--accent); transition:width .3s ease;}
  .dash-bar-count{width:34px; flex:none; text-align:right; font-weight:700; color:var(--ink);}
  .dash-alert-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:12.5px; cursor:pointer;}
  .dash-alert-row:last-child{border-bottom:none;}
  .dash-empty{color:var(--ink-faint); font-size:12.5px; padding:8px 0;}

  /* ---- vue Demandes : tableau Kanban de tri ---- */
  .kanban-board{display:grid; grid-template-columns:repeat(5, minmax(200px,1fr)); gap:12px; align-items:start;}
  @media (max-width:1100px){ .kanban-board{grid-template-columns:repeat(5, 240px); overflow-x:auto; padding-bottom:8px;} }
  .kanban-col{background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; min-width:0;}
  .kanban-col-head{padding:11px 13px; border-top:3px solid; font-weight:700; font-size:12.5px; display:flex; justify-content:space-between; align-items:center; background:#FBFAF6;}
  .kanban-col-count{font-family:var(--font-mono); font-weight:600; color:var(--ink-faint); font-size:11.5px;}
  .kanban-col-body{padding:9px; display:flex; flex-direction:column; gap:8px; max-height:calc(100vh - 260px); overflow-y:auto;}
  .kanban-card{background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:9px 11px; cursor:pointer; transition:box-shadow .12s ease, transform .1s ease;}
  .kanban-card:hover{box-shadow:0 3px 10px rgba(20,35,43,.12); transform:translateY(-1px);}
  .kanban-card-top{display:flex; align-items:center; gap:6px; margin-bottom:3px;}
  .kanban-card-dot{width:7px; height:7px; border-radius:50%; flex:none;}
  .kanban-card-client{font-weight:700; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .kanban-card-sub{font-size:11px; color:var(--ink-soft); line-height:1.4; margin-bottom:5px;}
  .kanban-card-meta{display:flex; gap:6px; align-items:center; font-size:10.5px; color:var(--ink-faint); flex-wrap:wrap;}
  .kanban-slot-badge{background:#E3EEF3; color:#2C6E91; border-radius:999px; padding:1px 7px; font-weight:600;}
  .kanban-empty{color:var(--ink-faint); font-size:11.5px; text-align:center; padding:14px 0;}

  /* ---- refonte tableau de bord (maquette v2) ---- */
  .dash2-tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:12px; margin-bottom:14px;}
  .dash2-tile{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:13px 15px 13px 17px; position:relative; overflow:hidden;}
  .dash2-tile::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--tile-color, var(--accent));}
  .dash2-tile .lab{display:block; font-size:11px; color:var(--ink-soft); font-weight:600; margin-bottom:5px; text-transform:uppercase; letter-spacing:.3px;}
  .dash2-tile .val{display:block; font-size:23px; font-weight:700; color:var(--ink); line-height:1.1; font-family:var(--font-mono);}
  .dash2-tile .sub{display:block; font-size:10.5px; color:var(--ink-faint); margin-top:4px;}
  .dash2-banner{display:flex; gap:10px; align-items:flex-start; background:var(--panel); border:1px solid var(--border); border-left:3px solid #d03b3b; border-radius:8px; padding:11px 15px; font-size:12.5px; margin-bottom:16px; line-height:1.5; color:var(--ink);}
  .dash2-banner-icon{color:#d03b3b; flex:none; display:flex; align-items:center; margin-top:1px;}
  .dash2-banner a{color:var(--ink); font-weight:700; text-decoration:underline;}
  .dash2-grid2{display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-bottom:16px;}
  .dash2-grid2b{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  @media (max-width:1000px){ .dash2-grid2, .dash2-grid2b{grid-template-columns:1fr;} }
  .dash2-card{background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden;}
  .dash2-card .hd{padding:13px 17px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;}
  .dash2-card .hd h3{font-size:13.5px; font-weight:700; margin:0;}
  .dash2-card .hd .sp{flex:1;}
  .dash2-card .hd .n{font-size:11.5px; color:var(--ink-faint);}
  .dash2-card .bd{padding:15px 17px;}
  .dash2-card table{width:100%; border-collapse:collapse;}
  .dash2-card table tr{cursor:pointer; border-bottom:1px solid var(--border);}
  .dash2-card table tr:last-child{border-bottom:none;}
  .dash2-card table td{padding:7px 15px; font-size:12px; vertical-align:middle;}
  .dash2-row-title{font-weight:600; color:var(--ink);}
  .dash2-row-sub{font-size:11px; color:var(--ink-faint); margin-top:2px;}
  .dash2-tag{display:inline-block; border-radius:999px; padding:2px 9px; font-size:10.5px; font-weight:700; white-space:nowrap;}
  .dash2-legend{display:flex; gap:16px; align-items:center; margin-bottom:12px; font-size:11.5px; color:var(--ink-soft);}
  .dash2-legend .sw{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:-1px;}
  .dash2-charge-row{margin-bottom:10px;}
  .dash2-charge-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px;}
  .dash2-charge-track{display:flex; height:13px; border-radius:5px; overflow:hidden; background:#F1EFE7; gap:2px;}
  .global-search-wrap{position:relative; flex:1; max-width:420px; margin:0 20px;}
  .global-search-wrap input{width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:var(--panel-alt,#F7F6F2);}
  .global-search-results{
    position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:120; max-height:400px; overflow-y:auto;
    background:#fff; border:1px solid var(--border); border-radius:10px; box-shadow:0 10px 26px rgba(0,0,0,.15);
  }
  .gsr-group-label{padding:8px 12px 4px; font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:var(--ink-faint);}
  .gsr-item{padding:8px 12px; cursor:pointer; font-size:12.5px; display:flex; flex-direction:column; gap:1px;}
  .gsr-item:hover{background:#F1EFE7;}
  .gsr-item .gsr-sub{font-size:11px; color:var(--ink-soft);}
  .gsr-empty{padding:14px 12px; font-size:12.5px; color:var(--ink-faint);}
  .nav-group-label{
    font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
    color:rgba(255,255,255,.38); padding:16px 14px 4px; margin:0;
  }
  .nav-group-label:first-of-type{padding-top:6px;}
  .gantt-context-menu{
    position:fixed; z-index:200; background:#fff; border:1px solid var(--border); border-radius:8px;
    box-shadow:0 8px 22px rgba(0,0,0,.18); padding:4px; min-width:160px;
  }
  .gantt-context-item{display:flex; align-items:center; gap:8px; padding:8px 10px; font-size:13px; border-radius:6px; cursor:pointer; color:var(--ink);}
  .gantt-context-item:hover{background:#F1EFE7;}
  .gantt-context-item svg{width:15px; height:15px; flex:none;}
  .dropdown-multiselect{position:relative; display:inline-block;}
  .dropdown-multiselect-toggle{min-width:220px; text-align:left; display:flex; justify-content:space-between; align-items:center;}
  .dropdown-multiselect-panel{
    position:absolute; top:calc(100% + 4px); left:0; z-index:50; min-width:220px; max-height:220px; overflow-y:auto;
    background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.12); padding:6px;
  }
  .dropdown-multiselect-item{display:flex; align-items:center; gap:8px; padding:6px 8px; font-size:12.5px; font-weight:400; border-radius:6px; cursor:pointer;}
  .dropdown-multiselect-item:hover{background:#F1EFE7;}
  .dropdown-multiselect-item input{width:auto;}
  .gantt-bar.gantt-bar-secondary{opacity:.65; background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.12) 0 6px, transparent 6px 12px); cursor:pointer;}
  /* Code couleur officiel Matachana (procédure MFSAS-SAV-PLANNING WEB v5) — classement par tâche de planification */
  .gantt-bar.status-rouge{background:#F7E4DE; color:#5C2A1C;}                 /* à planifier */
  .gantt-bar.status-vert{background:#E1F0E3; color:#1D4A24;}                  /* planifiée — aucune confirmation */
  .gantt-bar.status-orange{background:#FBF0DC; color:#5C3F0C;}                /* confirmée au client */
  .gantt-bar.status-gris{background:#EDEBF3; color:#2E2A3D;}                  /* appel envoyé au technicien */
  .gantt-bar.status-bleu{background:#E1EBF9; color:#0B2F5C;}                  /* à faire par une société tierce */
  .gantt-bar.status-anthracite{background:#E4E2E6; color:#2B2830;}            /* congé/RTT à valider */
  .gantt-bar.status-noir{background:#D8D6DA; color:#17151A; border:1px solid rgba(0,0,0,.08);} /* congé/RTT validé */
  .gantt-bar .st-dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px; flex:none; vertical-align:1px;}
  .gantt-bar.status-rouge .st-dot{background:var(--tg-red);}
  .gantt-bar.status-vert .st-dot{background:var(--tg-green);}
  .gantt-bar.status-orange .st-dot{background:#B07E2E;}
  .gantt-bar.status-gris .st-dot{background:#7C7690;}
  .gantt-bar.status-bleu .st-dot{background:#2C6E91;}
  .gantt-bar.status-anthracite .st-dot, .gantt-bar.status-noir .st-dot{background:#4A4650;}
  .color-swatch-picker{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .color-swatch{
    width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:900;
  }
  .color-swatch.active{border-color:var(--primary); box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--primary);}
  .color-swatch.auto-swatch{background:#fff !important; border:2px dashed #B7B3C6; color:var(--ink-soft);}
  .gantt-bar.urgente{outline:2px solid #FFD23F; outline-offset:-2px;}
  .gantt-bar.terminee{opacity:.5;}
  .gantt-bar.suspendue{outline:2px dashed #fff; outline-offset:1px;}
  .gantt-bar::after{
    content:''; position:absolute; top:0; right:0; width:0; height:0;
    border-style:solid; border-width:0 10px 10px 0; border-color:transparent rgba(255,255,255,.4) transparent transparent;
  }
  .gantt-bar .gb-client{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gantt-bar .gb-serial{font-family:var(--font-mono); font-size:9.5px; opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gb-slot-tag{display:inline-block; background:rgba(0,0,0,.12); border-radius:3px; padding:0 3px; font-size:8.5px; font-weight:700; letter-spacing:.2px;}
  .resize-handle{
    position:absolute; right:0; top:0; bottom:0; width:9px; cursor:ew-resize;
    background:linear-gradient(90deg, transparent, rgba(0,0,0,.18));
  }
  .validated-check{
    position:absolute; left:4px; top:3px; width:14px; height:14px; border-radius:50%;
    background:rgba(255,255,255,.95); color:var(--tg-green); font-size:10px; font-weight:900;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .pending-client-badge{
    position:absolute; right:12px; top:3px; width:16px; height:16px; border-radius:50%;
    background:rgba(255,255,255,.95); color:#C4780F; display:flex; align-items:center; justify-content:center;
  }
  .pending-client-badge svg{width:10px; height:10px;}
  .lane-badge{
    position:absolute; left:4px; bottom:3px; min-width:14px; height:14px; padding:0 3px; border-radius:7px;
    background:rgba(255,255,255,.95); color:var(--tg-bg); font-size:9px; font-weight:800; line-height:14px; text-align:center;
  }
  .gantt-legend-details{margin-top:6px; flex:none;}
  .gantt-legend-details summary{cursor:pointer; font-size:11.5px; color:var(--ink-faint); font-weight:600; list-style:none; user-select:none;}
  .gantt-legend-details summary::-webkit-details-marker{display:none;}
  .gantt-legend-details summary::before{content:'▸ '; display:inline-block; transition:transform .1s ease;}
  .gantt-legend-details[open] summary::before{content:'▾ ';}
  .gantt-legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:8px; font-size:11.5px; color:var(--ink-soft);}
  .gantt-legend .lg-item{display:flex; align-items:center; gap:6px;}
  .gantt-legend .lg-dot{width:11px; height:11px; border-radius:3px;}
  .parts-watch-row{display:flex; align-items:center; gap:9px; padding:9px 4px; border-bottom:1px solid #F0EEE5; cursor:pointer;}
  .parts-watch-row:last-child{border-bottom:none;}
  .parts-watch-row:hover{background:#FBFAF6;}
  .parts-table{width:100%; border-collapse:collapse; margin-top:8px; font-size:12px;}
  .parts-table th{font-size:10px; text-transform:uppercase; color:var(--ink-faint); text-align:left; padding:5px 8px; border-bottom:1px solid var(--border);}
  .parts-table td{padding:6px 8px; border-bottom:1px solid #F0EEE5;}
  .confirm-banner{padding:14px 16px; border-radius:var(--radius); margin-bottom:16px;}
  .confirm-banner.attente{background:var(--amber-soft); border:1px solid var(--amber);}
  .confirm-banner.contre{background:var(--purple-soft); border:1px solid var(--purple);}
  .autocomplete-wrap{position:relative;}
  .autocomplete-suggestions{
    position:absolute; top:100%; left:0; right:0; z-index:60; background:#fff; border:1px solid var(--border);
    border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.14); max-height:220px; overflow-y:auto; margin-top:3px;
  }
  .autocomplete-item{padding:8px 11px; font-size:13px; cursor:pointer;}
  .autocomplete-item:hover, .autocomplete-item.active{background:var(--accent-soft);}
  .autocomplete-item .ac-sub{font-size:11px; color:var(--ink-faint);}

  /* ============ PWA install button ============ */
  .pwa-install-btn{
    display:none; align-items:center; gap:8px; width:100%; margin-top:10px;
    background:var(--accent); color:#fff; border:none; border-radius:8px; padding:9px 12px;
    font-family:var(--font-body); font-weight:600; font-size:12.5px; cursor:pointer;
  }
  .pwa-install-btn.visible{display:flex;}

  /* ============ Mobile (téléphone) — barre de navigation basse type app ============ */
  @media (max-width: 720px){
    html, body{overflow-x:hidden; max-width:100vw;}
    .app-shell{flex-direction:column; min-height:100vh;}
    .sidebar{
      width:100%; height:auto; position:fixed; left:0; right:0; bottom:0; top:auto; z-index:40;
      flex-direction:row; align-items:center; justify-content:space-around;
      padding:8px 6px calc(8px + env(safe-area-inset-bottom));
      overflow-x:auto; gap:2px;
    }
    .sidebar .brand, .sidebar .brand-tag, .sidebar .brand-sub, .sidebar .client-id-box,
    .sidebar .sidebar-foot, .sidebar .pwa-install-btn, .sidebar .nav-group-label{display:none;}
    .sidebar .nav-item{
      flex-direction:column; gap:3px; padding:6px 10px; font-size:10px; text-align:center;
      margin-bottom:0; white-space:nowrap; border-radius:10px;
    }
    .sidebar .nav-item svg{width:19px; height:19px;}
    .sidebar .nav-item .badge{position:absolute; margin-left:0; transform:translate(10px,-8px);}
    .main{padding-bottom:74px;}
    .month-nav .muted{display:none;}
    table{display:block; overflow-x:auto; -webkit-overflow-scrolling:touch;}
    table thead, table tbody{display:table; width:100%; min-width:100%;}
    .topbar{padding:16px 16px 12px;}
    .mobile-topbar-logout{
      display:flex; align-items:center; justify-content:center; flex:none;
      width:38px; height:38px; border-radius:50%; background:var(--panel-alt,#F1EFE7);
      color:#6D8A90; cursor:pointer;
    }
    .topbar h1{font-size:18px;}
    .content{padding:16px 16px 40px;}
    .planning-layout{grid-template-columns:1fr;}
    .backlog-panel{position:relative; top:0;}
    .client-grid{grid-template-columns:1fr;}
    .admin-grid{grid-template-columns:1fr;}
    .modal{max-height:92vh;}
    .portal-choices{grid-template-columns:1fr;}
    .row2{grid-template-columns:1fr;}
    /* Un bouton d'installation flottant remplace celui (masqué) de la sidebar */
    .pwa-install-fab{
      display:none; position:fixed; right:16px; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:41;
      background:var(--accent); color:#fff; border:none; border-radius:50%; width:48px; height:48px;
      align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,.25); cursor:pointer;
    }
    .pwa-install-fab.visible{display:flex;}
  }
</style>
</head>

/* ---------------- sécurité des mots de passe ----------------
   Les mots de passe ne sont jamais stockés en clair : ils sont hachés (SHA-256)
   avant d'être écrits dans les données. Repli non cryptographique uniquement si
   SubtleCrypto est indisponible (ex. certains contextes file:// non sécurisés) —
   mieux que du texte en clair, mais ce n'est alors pas un hachage cryptographique réel. */
async function sha256Hex(text){
  try{
    if(window.crypto && window.crypto.subtle && window.crypto.subtle.digest){
      const enc = new TextEncoder().encode(String(text));
      const buf = await window.crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){ /* repli ci-dessous */ }
  let h1 = 0xdeadbeef ^ text.length, h2 = 0x41c6ce57 ^ text.length;
  for(let i=0;i<text.length;i++){
    const ch = text.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  const combined = ((h2>>>0).toString(16).padStart(8,'0')) + ((h1>>>0).toString(16).padStart(8,'0'));
  return ('fb'+combined).padEnd(64,'0').slice(0,64);
}
function looksHashed(pw){ return typeof pw==='string' && /^[0-9a-f]{64}$/i.test(pw); }

const LOGIN_LOCKOUT_THRESHOLD = 5;
const LOGIN_LOCKOUT_MS = 60000;
/* Vérifie un identifiant/mot de passe dans une liste de comptes (clients, techniciens ou internalUsers).
   Compare des empreintes SHA-256, jamais le mot de passe en clair. Verrouille temporairement un compte
   après plusieurs échecs pour limiter les tentatives par force brute. */
async function attemptLogin(list, usernameRaw, plainPassword){
  const u = (usernameRaw||'').trim().toLowerCase();
  const account = list.find(x=>x.username && x.username.toLowerCase()===u);
  if(!account) return { ok:false, reason:'notfound' };
  if(account.lockedUntil && Date.now() < account.lockedUntil){
    return { ok:false, reason:'locked', remainSeconds: Math.ceil((account.lockedUntil-Date.now())/1000) };
  }
  const hash = await sha256Hex(plainPassword||'');
  if(account.password === hash){
    account.failedLogins = 0; account.lockedUntil = null;
    return { ok:true, account };
  }
  account.failedLogins = (account.failedLogins||0) + 1;
  if(account.failedLogins >= LOGIN_LOCKOUT_THRESHOLD){
    account.lockedUntil = Date.now() + LOGIN_LOCKOUT_MS;
    account.failedLogins = 0;
    return { ok:false, reason:'lockednow', remainSeconds: Math.round(LOGIN_LOCKOUT_MS/1000) };
  }
  return { ok:false, reason:'badpass', attemptsLeft: LOGIN_LOCKOUT_THRESHOLD - account.failedLogins };
}
function loginErrorMessage(result){
  if(result.reason==='locked') return `Compte temporairement bloqué (trop de tentatives) — réessayez dans ${result.remainSeconds}s.`;
  if(result.reason==='lockednow') return `Trop de tentatives échouées — compte bloqué ${result.remainSeconds}s.`;
  if(result.reason==='attemptsLeft' || result.reason==='badpass') return `Identifiant ou mot de passe incorrect (${result.attemptsLeft} tentative${result.attemptsLeft>1?'s':''} restante${result.attemptsLeft>1?'s':''}).`;
  return 'Identifiant ou mot de passe incorrect.';
}

const storageAdapter = {
  async get(key, shared=true){
    if(shared && firestoreDb){
      try{
        const snap = await firestoreDb.collection(FIRESTORE_COLLECTION).doc(key).get();
        return snap.exists ? (snap.data().value ?? null) : null;
      }catch(e){ console.warn('Lecture Firestore échouée, repli local.', e); }
    }
    if(typeof window!=='undefined' && window.storage && typeof window.storage.get==='function'){
      try{ const res = await window.storage.get(key, shared); return res && res.value ? res.value : null; }catch(e){}
    }
    try{ const raw = localStorage.getItem(key); if(raw!==null) return raw; }catch(e){}
    return memoryFallback[key] ?? null;
  },
  async set(key, value, shared=true){
    if(shared && firestoreDb){
      try{
        await firestoreDb.collection(FIRESTORE_COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
        memoryFallback[key] = value;
        return { ok:true, viaFirestore:true };
      }catch(e){ console.warn('Écriture Firestore échouée, repli local.', e); }
    }
    let ok=false;
    if(typeof window!=='undefined' && window.storage && typeof window.storage.set==='function'){
      try{ await window.storage.set(key, value, shared); ok=true; }catch(e){}
    }
    if(!ok){ try{ localStorage.setItem(key, value); ok=true; }catch(e){} }
    memoryFallback[key]=value;
    return { ok, viaFirestore:false };
  }
};

async function loadState(){
  let recoveredFromOldFormat = false;
  try{
    // Nouveau format : plusieurs documents (voir STORAGE_BUCKETS)
    const merged = {};
    let coreBucketFound = false;
    for(const bucketName of Object.keys(STORAGE_BUCKETS)){
      try{
        const raw = await storageAdapter.get(bucketStorageKey(bucketName), true);
        if(raw){
          if(bucketName==='core') coreBucketFound = true;
          Object.assign(merged, JSON.parse(raw));
          lastStateSnapshots[bucketName] = raw;
        }
      }catch(e){ console.warn(`Bucket "${bucketName}" illisible, ignoré pour ce chargement.`, e); }
    }
    // Le bucket "core" (clients, machines, techniciens...) est le seul dont l'absence est critique —
    // s'il manque ou est corrompu, on ne doit JAMAIS repartir sur des données de démo : on tente
    // d'abord de récupérer l'ancien format à document unique, qui contient toujours les vraies données.
    if(coreBucketFound && isValidStateShape(merged)){
      state = merged;
      await migrateState();
      await saveState();
      return;
    }
    // Ancien format (un seul document) : on le lit une dernière fois puis on migre
    // automatiquement vers le nouveau format multi-documents, sans rien perdre.
    const oldRaw = await storageAdapter.get(STORAGE_KEY, true);
    if(oldRaw){
      const parsed = JSON.parse(oldRaw);
      if(isValidStateShape(parsed)){
        // On combine avec les buckets secondaires (notes de frais/congés) déjà retrouvés, s'il y en a,
        // pour ne perdre ni les vraies données de fond ni les données récentes déjà migrées.
        state = { ...parsed, ...merged, clients:parsed.clients, machines:parsed.machines, technicians:parsed.technicians, interventions:parsed.interventions, internalUsers:parsed.internalUsers, secteurs:parsed.secteurs };
        recoveredFromOldFormat = true;
        await migrateState();
        await saveState(); // réécrit désormais dans les documents séparés
        showToast('✅ Données récupérées depuis la sauvegarde précédente');
        return;
      }
    }
  }catch(e){
    console.warn('Erreur lors de la lecture des données.', e);
  }
  console.warn('Aucune donnée valide trouvée (bucket "core" et ancien format tous deux absents/invalides) — initialisation des données de démonstration.');
  showToast('⚠️ Données précédentes introuvables — redémarrage avec les données de démonstration. Contactez le support si vos données devraient être présentes.');
  state = seedState();
  await migrateState();
  await saveState();
}
let conflictWarned = false;
async function saveState(){
  try{
    for(const [bucketName, keys] of Object.entries(STORAGE_BUCKETS)){
      const bucketObj = {};
      keys.forEach(k=>{ bucketObj[k] = state[k]; });
      const json = JSON.stringify(bucketObj);
      // Détection légère de conflit, par document : si les données stockées ont changé depuis notre
      // dernière lecture (un autre utilisateur a sauvegardé entre-temps), on prévient sans écraser silencieusement.
      try{
        const prev = lastStateSnapshots[bucketName];
        if(prev){
          const currentRemote = await storageAdapter.get(bucketStorageKey(bucketName), true);
          if(currentRemote && currentRemote!==prev && !conflictWarned){
            conflictWarned = true;
            showToast('⚠️ Données modifiées ailleurs entre-temps — vérifiez vos changements');
            setTimeout(()=>{ conflictWarned=false; }, 5000);
          }
        }
      }catch(e){ /* vérification best-effort, on continue même si elle échoue */ }
      const result = await storageAdapter.set(bucketStorageKey(bucketName), json, true);
      if(result && result.ok && !result.viaFirestore){
        const sizeKo = Math.round(json.length/1024);
        const reason = sizeKo > 500 ? ` — réduisez la taille des pièces jointes (${sizeKo} Ko dans ce lot)` : ' — connexion à la base partagée indisponible';
        showToast(`⚠️ Synchronisation impossible (${bucketName})${reason}. Vos changements ne sont enregistrés que sur cet appareil pour l'instant.`);
      } else if(!result || !result.ok){
        showToast(`⚠️ Échec de la sauvegarde (${bucketName})`);
      }
      lastStateSnapshots[bucketName] = json;
    }
  }
  catch(e){ console.error('Erreur de sauvegarde', e); showToast('⚠️ Échec de la sauvegarde des données'); }
}

async function restoreSession(){
  try{

    if(!raw) return;
    const s = JSON.parse(raw);
    // Le portail client a été retiré : une session client précédemment enregistrée ne

    if(s.portal==='tech-app' && s.authTechId && tech(s.authTechId)){

function daysUntil(dateISO){
  if(!dateISO) return null;
  const d = new Date(dateISO+'T00:00:00');
  return Math.round((d - new Date(new Date().toDateString())) / 86400000);
}

  if(iv.piecesCommandees) return 'ok';

  if(d===null) return null;
  if(d<0) return 'retard';

/* ---------------- Suivi de périodicité des pièces (ex. contacteur remplacé tous les 2 ans) ----------------
   Chaque protocole peut définir une périodicité (en mois) par pièce. On calcule la prochaine échéance
   à partir du dernier remplacement enregistré sur CETTE machine précise (state.machines[].piecesHistorique).
   Si aucun remplacement n'a jamais été enregistré, on n'affiche pas d'alerte plutôt que de risquer une
   fausse alerte (on ne connaît pas la date d'installation réelle des pièces d'origine). */
function addMonthsDate(dateIso, months){
  const d = new Date(dateIso+'T00:00:00');
  d.setMonth(d.getMonth()+months);
  return iso(d);
}
function lastReplacementFor(machine, ref){
  const entries = (machine.piecesHistorique||[]).filter(h=>h.ref===ref);
  if(!entries.length) return null;
  return entries.slice().sort((a,b)=>b.replacedAt.localeCompare(a.replacedAt))[0];
}
function partsReplacementAlertsForMachine(machine){
  if(!machine.protocolKey || !state.protocols[machine.protocolKey]) return [];
  const proto = state.protocols[machine.protocolKey];
  const tracked = [...(proto.annuelle||[]), ...(proto.controle||[])].filter(p=>p.periodiciteMois);
  return tracked.map(p=>{
    const last = lastReplacementFor(machine, p.ref);
    if(!last) return null; // pas d'historique connu — pas d'alerte pour éviter un faux signal
    const dueDate = addMonthsDate(last.replacedAt, p.periodiciteMois);
    const daysLeft = daysUntil(dueDate);
    return { ref:p.ref, designation:p.designation, periodiciteMois:p.periodiciteMois, lastReplacedAt:last.replacedAt, dueDate, daysLeft };
  }).filter(Boolean);
}
function allDuePartsAlerts(){
  const results = [];
  state.machines.forEach(m=>{
    partsReplacementAlertsForMachine(m).forEach(a=>{
      if(a.daysLeft!==null && a.daysLeft<=60) results.push({ machine:m, ...a });
    });
  });
  return results.sort((a,b)=>a.daysLeft-b.daysLeft);
}

/* ---------------- toast ---------------- */
let toastTimer=null;
function showToast(msg){
  let el=document.getElementById('toast'); if(el) el.remove();
  el=document.createElement('div'); el.id='toast'; el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.remove(),2600);
}

/* ================= ROOT RENDER ================= */
/* Sélection d'une intervention en attente de placement — fonctionne aussi bien au sein d'une
   seule fenêtre (alternative au glisser-déposer) qu'entre deux fenêtres/écrans séparés, via
   BroadcastChannel (le glisser-déposer natif ne peut pas franchir la frontière entre deux fenêtres). */
let pendingPlacementIvId = null;
let planningSyncChannel = null;
function getPlanningSyncChannel(){
  if(planningSyncChannel) return planningSyncChannel;
  try{
    planningSyncChannel = new BroadcastChannel('gmao-planning-sync');
    planningSyncChannel.addEventListener('message', e=>{
      if(!e.data) return;
      if(e.data.type==='select'){ pendingPlacementIvId = e.data.ivId; renderContent(); }
      else if(e.data.type==='clear'){ pendingPlacementIvId = null; renderContent(); }
    });
  }catch(err){ planningSyncChannel = null; }
  return planningSyncChannel;
}
function selectForPlacement(ivId){
  pendingPlacementIvId = ivId;
  getPlanningSyncChannel()?.postMessage({ type:'select', ivId });
  renderContent();
}
function clearPlacementSelection(){
  pendingPlacementIvId = null;
  getPlanningSyncChannel()?.postMessage({ type:'clear' });
}

SANS NUMÉRO DE SÉRIE NI DESCRIPTION DE LA PANNE, L'INTERVENTION NE POURRA PAS ÊTRE DÉCLENCHÉE.

function machineScanUrl(machineId){
  const base = window.location.origin + window.location.pathname;
  return `${base}?scan=${machineId}`;
}
function interventionScanUrl(ivId){
  const base = window.location.origin + window.location.pathname;
  return `${base}?ivscan=${ivId}`;
}
function getScannedInterventionId(){
  try{ return new URLSearchParams(window.location.search).get('ivscan'); }catch(e){ return null; }
}
let pendingScanInterventionId = getScannedInterventionId();
function getScannedMachineId(){
  try{ return new URLSearchParams(window.location.search).get('scan'); }catch(e){ return null; }
}
let pendingScanMachineId = getScannedMachineId();
function isStandalonePlanningRequested(){
  try{ return new URLSearchParams(window.location.search).get('planning') === 'full'; }catch(e){ return false; }
}
function standalonePlanningMode(){
  try{ return new URLSearchParams(window.location.search).get('planning') || null; }catch(e){ return null; } // 'full' | 'backlog' | null
}
function render(){
  const root = document.getElementById('root');
  if(portal==='landing'){ root.innerHTML = renderLanding(); bindLanding(); return; }
  if(portal==='client-app'){
    if(!client(authClientId)){ portal='landing'; authClientId=null; render(); return; }
    root.innerHTML = renderClientShell(); bindClientShellEvents(); return;
  }
  if(portal==='tech-app'){
    if(!tech(authTechId)){ portal='landing'; authTechId=null; render(); return; }
    if(pendingScanMachineId && machine(pendingScanMachineId)){ techView = 'scan'; }
    root.innerHTML = renderTechShell(); bindTechShellEvents(); return;
  }
  if(portal==='internal-app'){
    if(!internalUser(authInternalId)){ portal='landing'; authInternalId=null; render(); return; }
    if(isStandalonePlanningRequested() && allowedViewsFor(internalUser(authInternalId).role).includes('planning')){
      root.innerHTML = renderStandalonePlanningShell(); bindStandalonePlanningShellEvents(); return;
    }
    if(standalonePlanningMode()==='backlog' && allowedViewsFor(internalUser(authInternalId).role).includes('planning')){
      currentView = 'planning';
    }
    root.innerHTML = renderInternalShell(); bindInternalShellEvents(); return;
  }
  portal = 'landing'; render();
}

    }
    if(typeof jsQR !== 'function'){
      statusEl.textContent = "Le lecteur de QR code n'a pas pu se charger (connexion internet nécessaire au premier chargement). Réessayez, ou utilisez l'appareil photo de votre téléphone.";
      retryBtn.style.display = 'inline-block';
      return;
    }
    try{
      camScanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    }catch(e){
      statusEl.textContent = "Impossible d'accéder à la caméra — vérifiez que vous avez autorisé l'accès dans les réglages de votre navigateur.";
      retryBtn.style.display = 'inline-block';
      return;
    }
    video.srcObject = camScanStream;
    await video.play().catch(()=>{});
    statusEl.textContent = 'Recherche d\u2019un QR code...';
    const ctx = canvas.getContext('2d', { willReadFrequently:true });
    tick = function(){
      if(!camScanStream) return; // arrêté entre-temps
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        let code = null;
        try{
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts:'dontInvert' });
        }catch(e){}
        if(code && code.data){
          handleQrDecoded(code.data);
          return; // handleQrDecoded gère l'arrêt / la reprise
        }
      }
      camScanRafId = requestAnimationFrame(tick);
    };
    camScanRafId = requestAnimationFrame(tick);
  }

  function handleQrDecoded(text){
    let machineId = null;
    try{
      const url = new URL(text, window.location.href);
      machineId = url.searchParams.get('scan');
    }catch(e){
      // pas une URL valide — on regarde si c'est directement un identifiant de machine connu
      if(state.machines.some(m=>m.id===text)) machineId = text;
    }
    if(machineId && machine(machineId)){
      stopCamScan();
      pendingScanMachineId = machineId;
      techView = 'scan';
      render(); // rafraîchit aussi le titre en haut de page, pas seulement le contenu
      showToast('QR code reconnu');
    } else {
      statusEl.textContent = "Ce QR code n'est pas reconnu par le GMAO — vérifiez qu'il s'agit bien d'un QR code de machine. Nouvelle tentative...";
      camScanRafId = requestAnimationFrame(tick);
    }
  }

  startCamScan();
}

function viewTechWeek(){
  const days = Array.from({length:7}, (_,i)=>addDays(currentTechWeekStart,i));
  const weekEnd = addDays(currentTechWeekStart,6);
  const myJobs = state.interventions.filter(iv=>{
    if(!ivAssignedTo(iv, authTechId) || !iv.plannedDate) return false;
    const start = new Date(iv.plannedDate+'T00:00:00');
    const end = new Date((iv.plannedEndDate||iv.plannedDate)+'T00:00:00');
    return end >= currentTechWeekStart && start <= weekEnd;
  });
  const partsAlerts = state.interventions.filter(iv=>{
    if(!ivAssignedTo(iv, authTechId) || iv.status==='terminee') return false;
    const lvl = partsAlertLevel(iv);
    return lvl==='urgent' || lvl==='retard';
  }).sort((a,b)=>(a.plannedDate||'9999').localeCompare(b.plannedDate||'9999'));
  return `
    ${partsAlerts.length? `
      <div class="card confirm-banner ${partsAlerts.some(iv=>partsAlertLevel(iv)==='retard')?'contre':'attente'}" style="margin-bottom:18px; border-color:var(--red);">
        <div style="font-weight:700; font-size:13.5px; margin-bottom:8px; color:#8A2E2A;">${icon('wrench')} Pièces à commander</div>
        ${partsAlerts.map(iv=>{
          const cl = client(iv.clientId); const d = daysUntil(iv.plannedDate);
          return `<div class="parts-watch-row" data-open-tech-parts="${iv.id}" style="cursor:pointer;">
            <span class="demande-dot" style="background:${d<0?'var(--red)':'var(--amber)'};"></span>
            <div style="flex:1; min-width:0;">
              <div style="font-size:12.5px; font-weight:600;">${escapeHtml(cl.name)} — ${escapeHtml(iv.serial)}</div>
              <div style="font-size:11px; color:var(--ink-faint);">${fmtDateLong(iv.plannedDate)} ${d!==null?`(${d<0?'retard de '+Math.abs(d)+'j':'J-'+d})`:''}</div>
            </div>
          </div>`;
        }).join('')}
        <div class="field-hint" style="margin-top:4px;">Ouvrez l'intervention pour voir la liste des pièces et valider la commande.</div>
      </div>
    ` : ''}
    <div class="week-nav">
      <button class="btn btn-ghost btn-sm" id="tech-week-prev">← Semaine préc.</button>
      <span class="lbl">${fmtDate(currentTechWeekStart)} — ${fmtDate(weekEnd)}</span>
      <button class="btn btn-ghost btn-sm" id="tech-week-next">Semaine suiv. →</button>
      <button class="btn btn-ghost btn-sm" id="tech-week-today">Aujourd'hui</button>
    </div>
    <div style="max-width:720px;">
      ${days.map(d=>{
        const dISO = iso(d);
        const jobs = myJobs.filter(iv=> dISO>=iv.plannedDate && dISO<=(iv.plannedEndDate||iv.plannedDate));
        return `
          <div class="card section-gap" style="padding:14px 16px;">
            <div class="flex-between" style="margin-bottom:${jobs.length?'10px':'0'};">
              <strong style="text-transform:capitalize;">${d.toLocaleDateString('fr-FR',{weekday:'long', day:'2-digit', month:'long'})}</strong>
              ${sameDay(d,new Date())? `<span class="pill" style="background:var(--accent-soft); color:var(--accent);">Aujourd'hui</span>` : ''}
            </div>
            ${jobs.length? jobs.map(iv=>{
              const cl = client(iv.clientId);
              const lvl = partsAlertLevel(iv);
              return `
                <div class="mini-card ${iv.status==='terminee'?'terminee':''}" data-open-tech="${iv.id}" style="font-size:13px; padding:10px 12px; margin-bottom:8px; cursor:pointer;">
                  <div class="flex-between" style="margin-bottom:3px;">
                    <span style="font-weight:600;">${escapeHtml(cl.name)}</span>
                    <span class="status-tag status-${iv.status}">${STATUS_LABELS[iv.status]}</span>
                  </div>
                  <div class="serial" style="font-size:10.5px; display:inline-block; margin-bottom:4px;">${escapeHtml(iv.serial)}</div>
                  <div style="color:var(--ink-soft); font-size:12px;">${escapeHtml(iv.panne)}</div>
                  ${iv.priorite==='urgente'?'<div style="color:#B23B3B; font-weight:700; font-size:11px; margin-top:4px;">URGENT</div>':''}
                  ${iv.enSuspens? `<div style="color:#8A2E2A; font-size:11px; margin-top:4px; font-weight:700;">⏸ En suspens</div>` : ''}
                  ${lvl==='ok'? `<div style="color:var(--green); font-size:11px; margin-top:4px; font-weight:600;">✓ Pièces commandées</div>` : ''}
                  ${lvl==='urgent'||lvl==='retard'? `<div style="color:#B23B3B; font-size:11px; margin-top:4px; font-weight:600;">⚠️ Pièces à commander</div>` : ''}
                </div>`;
            }).join('') : `<div class="helper-note">Aucune intervention ce jour.</div>`}
          </div>`;
      }).join('')}
    </div>
  `;
}

function allowedViewsFor(role){
  if(role==='admin') return ['dashboard','demandes','bureau','planning','admin','notes_frais','hotline','maintenances_planifiees'];
  if(role==='responsable') return ['dashboard','demandes','planning','notes_frais','mes_notes_frais','demandes_conge','maintenances_planifiees'];
  if(role==='coordinateur') return ['dashboard','demandes','planning','notes_frais','maintenances_planifiees'];
  if(role==='magasin') return ['magasin'];
  if(role==='directeur_technique') return ['notes_frais'];
  if(role==='comptabilite') return ['notes_frais'];
  if(role==='hotline') return ['hotline'];
  return ['bureau','planning','notes_frais'];
}
function pendingExpenseCountFor(me){
  if(me.role==='responsable'){
    const ids = (me.secteurIds && me.secteurIds.length) ? me.secteurIds : [me.secteurId];
    return state.expenseReports.filter(r=>r.status==='soumise' && ids.includes(r.secteurId)).length;
  }
  if(me.role==='coordinateur') return state.expenseReports.filter(r=>r.status==='soumise').length;
  if(me.role==='bureau') return state.expenseReports.filter(r=>r.status==='validee_responsable').length;
  if(me.role==='directeur_technique') return state.expenseReports.filter(r=>r.status==='validee_bureau').length;
  if(me.role==='comptabilite') return state.expenseReports.filter(r=>r.status==='validee_directeur').length;
  if(me.role==='admin') return state.expenseReports.filter(r=>['soumise','validee_responsable','validee_bureau','validee_directeur'].includes(r.status)).length;
  return 0;
}
function pendingCongeCountFor(me){
  if(me.role==='responsable'){
    const ids = (me.secteurIds && me.secteurIds.length) ? me.secteurIds : [me.secteurId];
    return state.congeRequests.filter(r=>r.status==='soumise' && ids.includes(r.secteurId)).length;
  }
  if(me.role==='admin') return state.congeRequests.filter(r=>r.status==='soumise').length;
  return 0;
}

function runGlobalSearch(query){
  const q = query.trim().toLowerCase();
  if(q.length < 2) return null;
  const me = currentInternalUser();
  const allowedSecteurIds = getAllowedSecteurIds();
  const clients = state.clients.filter(c=> (!allowedSecteurIds || allowedSecteurIds.includes(c.secteurId)) &&
    (c.name.toLowerCase().includes(q) || (c.ville||'').toLowerCase().includes(q))).slice(0,5);
  const machines = state.machines.filter(m=>{
    const cl = client(m.clientId);
    if(allowedSecteurIds && (!cl || !allowedSecteurIds.includes(cl.secteurId))) return false;
    return m.model.toLowerCase().includes(q) || m.serial.toLowerCase().includes(q);
  }).slice(0,5);
  const interventions = state.interventions.filter(iv=>{
    const cl = client(iv.clientId);
    if(allowedSecteurIds && (!cl || !allowedSecteurIds.includes(cl.secteurId))) return false;
    return (iv.numeroAppel||'').toLowerCase().includes(q) || (iv.panne||'').toLowerCase().includes(q);
  }).sort((a,b)=>(b.plannedDate||b.createdAt||'').localeCompare(a.plannedDate||a.createdAt||'')).slice(0,5);
  const technicians = state.technicians.filter(t=> (!allowedSecteurIds || !t.secteurId || allowedSecteurIds.includes(t.secteurId)) &&
    t.name.toLowerCase().includes(q)).slice(0,5);
  return { clients, machines, interventions, technicians };
}
function renderGlobalSearchResults(results){
  const box = document.getElementById('global-search-results');
  if(!results){ box.style.display='none'; return; }
  const total = results.clients.length + results.machines.length + results.interventions.length + results.technicians.length;
  if(!total){ box.innerHTML = `<div class="gsr-empty">Aucun résultat.</div>`; box.style.display='block'; return; }
  let html = '';
  if(results.clients.length){
    html += `<div class="gsr-group-label">Clients</div>`;
    html += results.clients.map(c=>`<div class="gsr-item" data-gsr-client="${c.id}"><span>${escapeHtml(c.name)}</span><span class="gsr-sub">${escapeHtml(c.ville||'')}</span></div>`).join('');
  }
  if(results.machines.length){
    html += `<div class="gsr-group-label">Machines</div>`;
    html += results.machines.map(m=>`<div class="gsr-item" data-gsr-machine="${m.id}"><span>${escapeHtml(m.model)} — <span class="serial">${escapeHtml(m.serial)}</span></span><span class="gsr-sub">${escapeHtml(client(m.clientId)?.name||'')}</span></div>`).join('');
  }
  if(results.interventions.length){
    html += `<div class="gsr-group-label">Interventions</div>`;
    html += results.interventions.map(iv=>`<div class="gsr-item" data-gsr-iv="${iv.id}"><span>${iv.numeroAppel?('N° '+escapeHtml(iv.numeroAppel)+' — '):''}${escapeHtml((iv.panne||'').slice(0,50))}</span><span class="gsr-sub">${escapeHtml(client(iv.clientId)?.name||'')}${iv.plannedDate?(' · '+fmtDateLong(iv.plannedDate)):''}</span></div>`).join('');
  }
  if(results.technicians.length){
    html += `<div class="gsr-group-label">Techniciens</div>`;
    html += results.technicians.map(t=>`<div class="gsr-item" data-gsr-tech="${t.id}"><span>${escapeHtml(t.name)}</span></div>`).join('');
  }
  box.innerHTML = html;
  box.style.display = 'block';
  box.querySelectorAll('[data-gsr-client]').forEach(el=>{
    el.addEventListener('mousedown', e=>{ e.preventDefault();
      adminClientSearch = client(el.dataset.gsrClient)?.name || '';
      currentView='admin'; adminSection='clients'; closeGlobalSearch(); renderContent();
    });
  });
  box.querySelectorAll('[data-gsr-machine]').forEach(el=>{
    el.addEventListener('mousedown', e=>{ e.preventDefault(); closeGlobalSearch(); openMachineFicheModal(el.dataset.gsrMachine); });
  });
  box.querySelectorAll('[data-gsr-iv]').forEach(el=>{
    el.addEventListener('mousedown', e=>{ e.preventDefault(); closeGlobalSearch(); openJobDetail(el.dataset.gsrIv, renderContent); });
  });
  box.querySelectorAll('[data-gsr-tech]').forEach(el=>{
    el.addEventListener('mousedown', e=>{ e.preventDefault();
      currentView='admin'; adminSection='techniciens'; closeGlobalSearch(); renderContent();
    });
  });
}
function closeGlobalSearch(){
  const input = document.getElementById('global-search-input');
  const box = document.getElementById('global-search-results');
  if(input) input.value = '';
  if(box) box.style.display = 'none';
}
function bindGlobalSearch(){
  const input = document.getElementById('global-search-input');
  if(!input) return;
  input.addEventListener('input', ()=>{ renderGlobalSearchResults(runGlobalSearch(input.value)); });
  input.addEventListener('focus', ()=>{ if(input.value.trim().length>=2) renderGlobalSearchResults(runGlobalSearch(input.value)); });
  document.addEventListener('click', e=>{
    const wrap = document.querySelector('.global-search-wrap');
    if(wrap && !wrap.contains(e.target)){ const box = document.getElementById('global-search-results'); if(box) box.style.display='none'; }
  });
}
function renderContent(){
  const c = document.getElementById('content');
  if(currentView==='dashboard') c.innerHTML = viewDashboard();

}
