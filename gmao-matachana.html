          <div><div class="client-name">${escapeHtml(cl.name)}</div><div class="req-meta">${escapeHtml(cl.ville)} · ${provenance}</div></div>
        </div>
        <span class="pill ${cl.contractType}">${contract.label}</span>
      </div>
      <div class="req-meta">Machine : <span class="serial">${escapeHtml(d.serial)}</span> ${machine(d.machineId)?('— '+escapeHtml(machine(d.machineId).model)):''}</div>
      <div class="req-panne">${escapeHtml(d.panne)}</div>
      ${d.numeroAppel? `<div class="req-meta" style="margin-bottom:10px;">N° d'appel : <span class="serial">${escapeHtml(d.numeroAppel)}</span></div>` : ''}
      ${color==='rouge'? `
        <div style="display:flex; gap:8px; margin-bottom:2px;">
          <input type="text" class="call-input" data-call-input="${d.id}" placeholder="Saisir le n° d'appel (ex. AP-2026-0123)" style="flex:1;">
          <button class="btn btn-primary btn-sm" data-call-save="${d.id}" style="flex:none;">Enregistrer</button>
        </div>
      ` : ''}
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; ${color==='rouge'?'margin-top:8px;':''}">
        ${color!=='vert'? `<button class="btn btn-danger btn-sm" data-delete-demande="${d.id}">Supprimer</button>` : `<span></span>`}
        <div style="display:flex; gap:8px;">
          ${color==='orange'? `<button class="btn btn-primary btn-sm" data-treat="${d.id}">${icon('wrench')} Créer l'intervention</button>` : ''}
          ${color==='vert'? `<span class="status-tag status-${d.status}">${STATUS_LABELS[d.status]}</span>` : ''}
        </div>
      </div>
    </div>`;
  };

  return `
    <div style="max-width:760px;">
      <div class="gantt-legend" style="margin:0 0 18px;">
        <div class="lg-item"><span class="lg-dot" style="background:var(--red)"></span>Non traité</div>
        <div class="lg-item"><span class="lg-dot" style="background:var(--amber)"></span>En cours (n° d'appel attribué)</div>
        <div class="lg-item"><span class="lg-dot" style="background:var(--green)"></span>Traité</div>
      </div>
      ${(rouge.length+orange.length)? '' : `<div class="empty" style="margin-bottom:18px;">Aucune demande en attente. Les nouvelles demandes reçues par email (formulaire ou QR code) apparaîtront ici.</div>`}
      ${rouge.map(cardHtml).join('')}
      ${orange.map(cardHtml).join('')}
      ${vert.length? `
        <div class="flex-between" style="margin:22px 0 12px; cursor:pointer;" id="toggle-traitees">
          <div class="section-title" style="margin:0;">Demandes traitées (${vert.length})</div>
          <span class="muted" style="font-size:12.5px;">${bureauShowTraitees? 'Masquer ▲' : 'Afficher ▼'}</span>
        </div>
        ${bureauShowTraitees? vert.map(cardHtml).join('') : ''}
      ` : ''}
    </div>
  `;
}
function openSignalBureauModal(){
  const me = currentInternalUser();
  const allowedSecteurIds = getAllowedSecteurIds();
  const lockedSecteurId = (allowedSecteurIds && allowedSecteurIds.length===1) ? allowedSecteurIds[0] : null;
  let sbSecteurFilter = lockedSecteurId || 'all';
  let selectedClientId = null;
  if(!state.clients.length){ showToast('Aucun client disponible'); return; }

  const overlay = document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><div><h3>Signaler une intervention au bureau</h3><p>Comme une demande client — le bureau créera le n° d'appel et l'intervention</p></div>
      <button class="modal-close" id="close-modal">&times;</button></div>
      <div class="modal-body">
        <label style="margin-top:0;">Numéro de série <span class="muted" style="font-weight:400;">(si vous l'avez — ex. reçu par email — remplit le client et la machine automatiquement)</span></label>
        <input type="text" id="sb-serial-lookup" placeholder="Ex. E-032664">
        <div id="sb-serial-result" class="field-hint" style="margin-top:0;"></div>
        ${lockedSecteurId ? `
          <div class="field-hint" style="margin-top:0;">Secteur : <strong>${escapeHtml(secteurLabel(lockedSecteurId))}</strong></div>
        ` : `
          <label style="margin-top:0;">Secteur</label>
          <select id="sb-secteur-filter">
            <option value="all">${allowedSecteurIds? 'Mes secteurs' : 'Tous les secteurs'}</option>
            ${!allowedSecteurIds? `<option value="none">Non affecté</option>` : ''}
            ${state.secteurs.filter(s=>!allowedSecteurIds || allowedSecteurIds.includes(s.id)).map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}
          </select>
        `}
        <label>Client</label>
        <div class="autocomplete-wrap">
          <input type="text" id="sb-client-search" placeholder="Rechercher un client par nom...">
          <div class="autocomplete-suggestions" id="sb-client-suggestions" style="display:none;"></div>
        </div>
        <label>Machine</label>
        <select id="sb-machine" disabled><option value="">— Sélectionnez d'abord un client —</option></select>
        <label>Description de la panne / motif</label>
        <textarea id="sb-panne" placeholder="Décrivez ce qui a été constaté sur le terrain..."></textarea>
        <div class="field-hint">Cette demande apparaîtra dans le tableau de bord du bureau, au même titre qu'une demande client.</div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="cancel-modal">Annuler</button>
        <button class="btn btn-primary" id="confirm-modal">Envoyer au bureau</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const searchInput = overlay.querySelector('#sb-client-search');
  const suggBox = overlay.querySelector('#sb-client-suggestions');
  const machineSelect = overlay.querySelector('#sb-machine');

  function eligibleClients(){
    if(sbSecteurFilter==='all') return allowedSecteurIds ? state.clients.filter(c=>allowedSecteurIds.includes(c.secteurId)) : state.clients;
    if(sbSecteurFilter==='none') return state.clients.filter(c=>!c.secteurId);
    return state.clients.filter(c=>c.secteurId===sbSecteurFilter);
  }
  function refreshMachines(){
    if(!selectedClientId){
      machineSelect.innerHTML = `<option value="">— Sélectionnez d'abord un client —</option>`;
      machineSelect.disabled = true;
      return;
    }
    const ms = machinesOf(selectedClientId);
    machineSelect.disabled = false;
    machineSelect.innerHTML = ms.length
      ? ms.map(m=>`<option value="${m.id}">${escapeHtml(m.model)} — ${escapeHtml(m.serial)}</option>`).join('')
      : `<option value="">Aucune machine enregistrée pour ce client</option>`;
  }
  function selectClient(c){
    selectedClientId = c.id;
    searchInput.value = `${c.name} — ${c.ville}`;
    suggBox.style.display = 'none';
    refreshMachines();
  }
  overlay.querySelector('#sb-secteur-filter')?.addEventListener('change', e=>{
    sbSecteurFilter = e.target.value;
    selectedClientId = null; searchInput.value=''; refreshMachines();
  });
  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim().toLowerCase();
    selectedClientId = null;
    if(!q){ suggBox.style.display='none'; refreshMachines(); return; }
    const matches = eligibleClients().filter(c=>c.name.toLowerCase().includes(q)).slice(0,8);
    if(!matches.length){ suggBox.innerHTML = `<div class="autocomplete-item muted">Aucun client trouvé${sbSecteurFilter!=='all'?' dans ce secteur':''}</div>`; suggBox.style.display='block'; return; }
    suggBox.innerHTML = matches.map(c=>`<div class="autocomplete-item" data-client-id="${c.id}">${escapeHtml(c.name)}<div class="ac-sub">${escapeHtml(c.ville)}</div></div>`).join('');
    suggBox.style.display = 'block';
    suggBox.querySelectorAll('[data-client-id]').forEach(item=>{
      item.addEventListener('mousedown', e=>{ e.preventDefault(); selectClient(client(item.dataset.clientId)); });
    });
  });
  searchInput.addEventListener('focus', ()=>{ if(searchInput.value.trim() && !selectedClientId) searchInput.dispatchEvent(new Event('input')); });
  searchInput.addEventListener('blur', ()=>{ setTimeout(()=>{ suggBox.style.display='none'; }, 150); });

  const serialInput = overlay.querySelector('#sb-serial-lookup');
  const serialResult = overlay.querySelector('#sb-serial-result');
  serialInput.addEventListener('input', ()=>{
    const q = serialInput.value.trim().toUpperCase();
    if(!q){ serialResult.textContent = ''; return; }
    const m = state.machines.find(mm=>mm.serial.trim().toUpperCase()===q);
    if(!m){ serialResult.innerHTML = `<span style="color:var(--ink-faint);">Aucune machine ne correspond à ce numéro de série pour l'instant.</span>`; return; }
    const cl = client(m.clientId);
    if(!cl){ serialResult.textContent = ''; return; }
    selectClient(cl);
    refreshMachines();
    machineSelect.value = m.id;
    serialResult.innerHTML = `<span style="color:var(--green); font-weight:600;">✓ ${escapeHtml(m.model)} — ${escapeHtml(cl.name)} sélectionnés automatiquement</span>`;
  });

  closeOnOverlay(overlay);
  overlay.querySelector('#confirm-modal').onclick = async ()=>{
    if(!selectedClientId){ showToast('Merci de sélectionner un client via la recherche'); return; }
    const panne = overlay.querySelector('#sb-panne').value.trim();
    if(!panne){ showToast('Merci de décrire le motif'); return; }
    const machineId = machineSelect.value;
    if(!machineId){ showToast('Ce client n\u2019a pas de machine enregistrée'); return; }
    const m = machine(machineId);
    state.interventions.push({
      id:uid('iv'), clientId:selectedClientId, machineId, serial:m.serial, panne,
      status:'demande', type:null, priseEnCharge:null,
      piecesNecessaires:'', piecesListe:[], priorite:'normale', notesBureau:'',
      technicianId:null, plannedDate:null, plannedEndDate:null, numeroAppel:null,
      valide:false, valideeAt:null, valideePar:null,
      piecesCommandees:false, piecesCommandeesAt:null, piecesCommandeesPar:null,
      clientConfirmation:null, clientProposedDate:null, clientNote:null,
      createdAt:iso(new Date()), createdBy:'responsable', signaleePar: me ? me.name : null,
    });
    await saveState(); overlay.remove(); renderTopbar(); renderContent();
    showToast('Intervention signalée au bureau');
  };
}

function openAddPreventiveModal(prefill){

  const overlay = document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><div><h3>Planifier une maintenance préventive</h3><p>Création et planification directe, sans passer par une demande client</p></div>
      <button class="modal-close" id="close-modal">&times;</button></div>

        </div>

        <select id="pv-machine" disabled><option value="">— Sélectionnez d'abord un client —</option></select>
        <div id="pv-protocol-hint" class="field-hint"></div>

        <select id="pv-maintenance-type">

          <option value="controle">Visite de contrôle</option>
        </select>
        <div id="pv-second-visit-hint" class="field-hint" style="display:none;"></div>
        <div class="row2">

            <select id="pv-tech">

            <input type="date" id="pv-date" value="${iso(addDays(new Date(),14))}">
          </div>
        </div>
        <label>Notes internes</label>
        <textarea id="pv-notes" placeholder="Informations utiles pour le technicien"></textarea>
        <div class="field-hint">La liste des pièces sera automatiquement jointe si un protocole d'entretien est associé à la machine. La date sera proposée au client, qui pourra la confirmer ou en proposer une autre.</div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="cancel-modal">Annuler</button>
        <button class="btn btn-primary" id="confirm-modal">Planifier et informer le client</button>
      </div>

  document.body.appendChild(overlay);

  let selectedClientId = null;
  const searchInput = overlay.querySelector('#pv-client-search');
  const suggBox = overlay.querySelector('#pv-client-suggestions');
  const clientSelect = { get value(){ return selectedClientId; } }; // conserve la même interface pour le reste du code
  const machineSelect = overlay.querySelector('#pv-machine');
  const protocolHint = overlay.querySelector('#pv-protocol-hint');
  const maintenanceTypeSelect = overlay.querySelector('#pv-maintenance-type');
  const secondVisitHint = overlay.querySelector('#pv-second-visit-hint');

  function refreshMachines(){

      : `<option value="">Aucune machine enregistrée pour ce client</option>`;
    refreshProtocolHint();

  function selectClient(c){
    selectedClientId = c.id;
    searchInput.value = `${c.name} — ${c.ville}`;

    const matches = eligibleClients.filter(c=>c.name.toLowerCase().includes(q)).slice(0,8);
    if(!matches.length){ suggBox.innerHTML = `<div class="autocomplete-item muted">Aucun client trouvé</div>`; suggBox.style.display='block'; return; }
    suggBox.innerHTML = matches.map(c=>`<div class="autocomplete-item" data-client-id="${c.id}">${escapeHtml(c.name)}<div class="ac-sub">${escapeHtml(c.ville)}</div></div>`).join('');
    suggBox.style.display = 'block';
    suggBox.querySelectorAll('[data-client-id]').forEach(item=>{
      item.addEventListener('mousedown', e=>{ e.preventDefault(); selectClient(client(item.dataset.clientId)); });
    });
  });
  searchInput.addEventListener('focus', ()=>{ if(searchInput.value.trim() && !selectedClientId) searchInput.dispatchEvent(new Event('input')); });
  searchInput.addEventListener('blur', ()=>{ setTimeout(()=>{ suggBox.style.display='none'; }, 150); });

  function refreshProtocolHint(){
    const m = machine(machineSelect.value);
    const proto = m && m.protocolKey ? state.protocols[m.protocolKey] : null;
    const type = maintenanceTypeSelect.value;
    const list = type==='controle' ? (proto? proto.controle : []) : (proto? proto.annuelle : []);

      const suggestedDate = iso(addMonthsDate(dateInput.value || iso(new Date()), 6));
      secondVisitHint.style.display = 'block';
      secondVisitHint.textContent = `Cette machine a 2 visites par an — une visite de contrôle sera proposée automatiquement le ${fmtDateLong(suggestedDate)} (6 mois plus tard) une fois cette maintenance créée.`;
    } else {
      secondVisitHint.style.display = 'none';

    const notes = overlay.querySelector('#pv-notes').value.trim();
    const maintenanceType = maintenanceTypeSelect.value; // 'mp1' | 'controle'

    const proto = m.protocolKey ? state.protocols[m.protocolKey] : null;
    const listKey = maintenanceType==='controle' ? 'controle' : 'annuelle';
    const piecesListe = proto ? proto[listKey] : [];
    const piecesNecessaires = proto ? protocolPiecesText(m.protocolKey, listKey) : '';

      piecesCommandees:false, piecesCommandeesAt:null, piecesCommandeesPar:null,
      clientConfirmation:'attente', clientProposedDate:null, clientNote:null,
      createdAt:iso(new Date()), createdBy:'responsable'
    });
    await saveState();
    overlay.remove();
    renderTopbar(); renderContent();
    showToast('Maintenance planifiée — le client a été notifié pour confirmation');

    // Machine à 2 visites/an, on vient de créer la MP1 : on propose la visite de contrôle 6 mois plus tard.
    if(maintenanceType==='mp1' && m.nbVisitesAnnuelles===2){
      const suggestedDate = iso(addMonthsDate(date, 6));
      if(confirm(`Cette machine a 2 visites par an. Planifier dès maintenant la visite de contrôle le ${fmtDateLong(suggestedDate)} (6 mois après) avec le même technicien ?`)){
        const controlePiecesListe = proto ? proto.controle : [];
        const controlePiecesRemplacees = controlePiecesListe.map(p=>({ ref:p.ref, designation:p.designation, qty:p.qty, remplace:null }));
        state.interventions.push({
          id:uid('iv'), clientId, machineId, serial:m.serial,
          panne:`Visite de contrôle${proto?(' — protocole '+proto.label):''}.`,
          status:'planifiee', type:'preventive', maintenanceType:'controle', priseEnCharge:'matachana',
          piecesNecessaires: proto? protocolPiecesText(m.protocolKey,'controle') : '', piecesListe:controlePiecesListe, piecesRemplacees:controlePiecesRemplacees,
          priorite:'normale', notesBureau:'',
          technicianId, plannedDate:suggestedDate, plannedEndDate:suggestedDate, numeroAppel:null,
          valide:false, valideeAt:null, valideePar:null,
          piecesCommandees:false, piecesCommandeesAt:null, piecesCommandeesPar:null,
          clientConfirmation:'attente', clientProposedDate:null, clientNote:null,
          createdAt:iso(new Date()), createdBy:'responsable'
        });
        await saveState();
        renderTopbar(); renderContent();
        showToast('Visite de contrôle également planifiée');
      }
    }
  };

/* ================= PLANNING VIEW (Gantt / Timeline) ================= */
let planningSecteurFilter = 'all';
let backlogCollapsed = false;
function groupTechsBySecteur(techs){
  const order = []; const bySec = {};
  techs.forEach(t=>{
    const key = t.secteurId || '__none__';
    if(!bySec[key]){ bySec[key] = []; order.push(key); }
    bySec[key].push(t);
  });
  return order.map(key=>({ secteurId: key==='__none__' ? null : key, techs: bySec[key] }));
}
/* Attribution des « voies » (lanes) pour empiler plusieurs interventions le même jour
   sur un même technicien — algorithme glouton classique de calendrier (type Google Calendar). */
/* ---------------- Code couleur officiel Matachana (procédure MFSAS-SAV-PLANNING WEB v5) ----------------
   Classement par tâche de planification :
   rouge = à planifier · vert = planifiée sans confirmation · orange = confirmée au client ·
   gris = appel envoyé au technicien (réponse client en attente) · bleu = à faire par une société tierce.
   NB : « congé/RTT à valider/validée » (gris anthracite/noir) fait partie de la même charte mais correspond
   à une fonctionnalité de gestion des congés non encore développée dans ce prototype. */
const STATUS_COLOR_LABELS = { rouge:'À planifier', vert:'Planifiée — sans confirmation', orange:'Confirmée au client', gris:'Appel envoyé — en attente client', bleu:'Société tierce', anthracite:'Congé/RTT — à valider', noir:'Congé/RTT — validé' };
const STATUS_COLOR_SWATCHES = { rouge:'#E8574B', vert:'#4FB85C', orange:'#E8A23D', gris:'#B7B3C6', bleu:'#4E8FE0', anthracite:'#4A4650', noir:'#161219' };
function interventionStatusKeyAuto(iv){
  if(iv.sousTraitance) return 'bleu';
  if(!iv.plannedDate || !iv.technicianId) return 'rouge';
  if(iv.valide) return 'orange';
  if(iv.clientConfirmation==='attente' || iv.clientConfirmation==='contre_proposition') return 'gris';
  return 'vert';
}
function interventionStatusKey(iv){
  return iv.colorOverride || interventionStatusKeyAuto(iv);
}
function interventionPrefix(iv){
  const parts = [];
  if(iv.bloqueComptabilite) parts.push('B');
  if(iv.suiteIntervention) parts.push('S');
  if(iv.type==='preventive') parts.push('MP');
  else if(iv.type==='installation') parts.push('I');
  else if(iv.type==='devis') parts.push('D');
  else if(iv.type && iv.type.indexOf('corrective')===0) parts.push('C');
  else parts.push('A');
  return parts.join('-');
}
function departementFromVille(ville){
  const m = ville && ville.match(/\((\d{2,5})\)/);
  return m ? m[1].slice(0,2) : null;
}
/* Couleur d'accent stable par client (même client = même teinte partout dans le planning),
   pour repérer d'un coup d'œil les équipements d'un même client, même sans lire le texte. */
function clientAccentColor(clientId){
  if(!clientId) return 'transparent';
  let hash = 0;
  for(let i=0;i<clientId.length;i++){ hash = (hash*31 + clientId.charCodeAt(i)) & 0xffffffff; }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 62%, 52%)`;
}
function cellLabel(iv){
  const cl = client(iv.clientId);
  const dept = cl ? departementFromVille(cl.ville) : null;
  return [interventionPrefix(iv), dept, cl?cl.name:''].filter(Boolean).join(' – ');
}
function computeLanesForTech(items){
  const sorted = items.slice().sort((a,b)=> a.startIdx-b.startIdx || a.endIdx-b.endIdx);
  const laneEnds = [];
  const laneLastClient = []; // dernier client placé dans chaque voie — pour garder un même client sur la même ligne
  const laneOf = {};
  // Passe 1 — respecte la voie choisie manuellement (glisser-déposer) quand elle est libre à cette date,
  // ce qui permet d'échanger librement l'ordre entre deux interventions du même jour.
  sorted.forEach(it=>{
    if(it.laneHint==null) return;
    while(laneEnds.length <= it.laneHint){ laneEnds.push(-1); laneLastClient.push(null); }
    if(laneEnds[it.laneHint] < it.startIdx){
      laneEnds[it.laneHint] = it.endIdx;
      laneLastClient[it.laneHint] = it.clientId||null;
      laneOf[it.id] = it.laneHint;
    }
  });
  // Passe 2 — préfère réutiliser une voie déjà occupée par le même client (les équipements d'un même
  // client restent ainsi alignés sur la même ligne au fil de la semaine) ; sinon première voie libre.
  sorted.forEach(it=>{
    if(laneOf[it.id]!==undefined) return;
    let placed = -1;
    if(it.clientId){
      for(let l=0;l<laneEnds.length;l++){
        if(laneEnds[l] < it.startIdx && laneLastClient[l]===it.clientId){ placed = l; break; }
      }
    }
    if(placed===-1){
      for(let l=0;l<laneEnds.length;l++){
        if(laneEnds[l] < it.startIdx){ placed = l; break; }
      }
    }
    if(placed===-1){ placed = laneEnds.length; laneEnds.push(it.endIdx); laneLastClient.push(it.clientId||null); }
    else { laneEnds[placed] = it.endIdx; laneLastClient[placed] = it.clientId||null; }
    laneOf[it.id] = placed;
  });
  return { laneOf, laneCount: Math.max(1, laneEnds.length) };
}
/* Indicateurs de pilotage affichés en tête du planning — le vrai différenciateur par rapport
   à un simple outil de planification : la santé de l'activité, visible sans quitter l'écran. */
function computePlanningKpis(activeFilter, inAllowedScope){
  const scoped = state.interventions.filter(iv=>{
    const cl = client(iv.clientId);
    return activeFilter==='all' ? inAllowedScope(cl?.secteurId) : cl?.secteurId===activeFilter;
  });
  const today = iso(new Date());
  const weekStart = iso(startOfWeek(new Date()));
  const weekEnd = iso(addDays(startOfWeek(new Date()),6));
  const thisWeek = scoped.filter(iv=>iv.plannedDate && iv.plannedDate>=weekStart && iv.plannedDate<=weekEnd);
  const lastWeekStart = iso(addDays(startOfWeek(new Date()),-7));
  const lastWeek = scoped.filter(iv=>iv.plannedDate && iv.plannedDate>=lastWeekStart && iv.plannedDate<weekStart);
  const weekDelta = thisWeek.length - lastWeek.length;

  const needConfirmation = scoped.filter(iv=>iv.clientConfirmation!=null && iv.status!=='terminee');
  const confirmed = needConfirmation.filter(iv=>iv.clientConfirmation==='acceptee');
  const confirmRate = needConfirmation.length ? Math.round((confirmed.length/needConfirmation.length)*100) : null;

  const urgent = scoped.filter(iv=>iv.priorite==='urgente' && iv.status!=='terminee');
  const urgentUnassigned = urgent.filter(iv=>!iv.technicianId).length;

  const visibleTechIds = new Set((activeFilter==='all' ? state.technicians.filter(t=>inAllowedScope(t.secteurId)) : state.technicians.filter(t=>t.secteurId===activeFilter)).map(t=>t.id));
  const activeCount = scoped.filter(iv=>iv.status!=='terminee' && iv.technicianId && visibleTechIds.has(iv.technicianId)).length;
  const capacity = Math.max(1, visibleTechIds.size) * 6; // hypothèse : ~6 interventions actives « confortables » par technicien
  const loadPct = Math.min(100, Math.round((activeCount/capacity)*100));

  const yearAgo = iso(addDays(new Date(),-365));
  const preventifs = scoped.filter(iv=>iv.type==='preventive' && iv.termineeAt && iv.termineeAt>=yearAgo && iv.plannedDate);
  const ponctuels = preventifs.filter(iv=>iv.termineeAt.slice(0,10)<=iv.plannedDate);
  const punctuality = preventifs.length ? Math.round((ponctuels.length/preventifs.length)*100) : null;

  return [
    { label:'Interventions cette semaine', num:String(thisWeek.length), trend:(weekDelta>=0?'+':'')+weekDelta, dir:weekDelta>=0?'up':'down', sub:'vs semaine précédente', color:'var(--tg-accent)' },
    { label:'Taux de confirmation client', num:confirmRate===null?'—':confirmRate+'%', trend:'', dir:'up', sub:needConfirmation.length+' en attente de réponse', color:'#3C8560' },
    { label:'Urgentes en cours', num:String(urgent.length), trend:'', dir:'down', sub:urgentUnassigned?urgentUnassigned+' non affectée(s)':'toutes affectées', color:'#B4562F' },
    { label:'Charge de l\u2019équipe', num:loadPct+'%', trend:'', dir:'up', sub:visibleTechIds.size+' technicien(s) visible(s)', color:'var(--tg-accent)' },
    { label:'Ponctualité préventif', num:punctuality===null?'—':punctuality+'%', trend:'', dir:'up', sub:'12 derniers mois', color:'#2C6E91' },
  ];
}
function viewPlanning(readOnly){

  const activeFilter = lockedSecteurId || planningSecteurFilter;
  const inAllowedScope = (secId) => !allowedSecteurIds || allowedSecteurIds.includes(secId);
  const visibleTechs = activeFilter==='all'

  const groups = activeFilter==='all' ? groupTechsBySecteur(visibleTechs) : [{ secteurId: activeFilter, techs: visibleTechs }];

  const dayLoads = ganttDays.map(d=>{

  const maxDayLoad = Math.max(1, ...dayLoads);

}

/* ================= MAINTENANCES PLANIFIÉES (visibilité + validation pour le client) ================= */
/* Calcule la prochaine échéance de maintenance préventive (MP1) d'une machine, à partir
   de la dernière visite MP1 réellement terminée + 12 mois. Renvoie null si aucun historique
   ne permet de l'estimer (jamais fait de MP1 sur cette machine). */
function computeNextDueDate(m){
  const lastDone = state.interventions
    .filter(iv=> iv.machineId===m.id && iv.type==='preventive' && iv.maintenanceType==='mp1' && iv.status==='terminee' && (iv.termineeAt||iv.plannedDate))
    .sort((a,b)=>(b.termineeAt||b.plannedDate).localeCompare(a.termineeAt||a.plannedDate))[0];
  if(!lastDone) return null;
  const baseDate = (lastDone.termineeAt||lastDone.plannedDate).slice(0,10);
  return { dueDate: iso(addMonthsDate(baseDate, 12)), basedOn: baseDate };
}
function computeUpcomingDueMachines(allowedSecteurIds){
  const today = iso(new Date());
  const in90 = iso(addDays(new Date(), 90));
  const machines = allowedSecteurIds ? state.machines.filter(m=>allowedSecteurIds.includes(client(m.clientId)?.secteurId)) : state.machines;
  const results = [];
  machines.forEach(m=>{
    if(!m.protocolKey) return; // pas de protocole = pas de suivi automatique possible
    const due = computeNextDueDate(m);
    if(!due) return; // jamais fait de MP1, pas d'estimation possible (voir section "jamais planifiée" séparée)
    if(due.dueDate > in90) return; // trop loin, pas encore urgent
    // déjà planifiée ? (une intervention préventive MP1 existe déjà, à venir, pour cette machine)
    const alreadyPlanned = state.interventions.some(iv=> iv.machineId===m.id && iv.type==='preventive' && iv.maintenanceType==='mp1' && iv.status!=='terminee' && iv.plannedDate && iv.plannedDate >= today);
    if(alreadyPlanned) return;
    results.push({ m, cl: client(m.clientId), due: due.dueDate, overdue: due.dueDate < today });
  });
  return results.sort((a,b)=>a.due.localeCompare(b.due));
}
function viewMaintenancesPlanifiees(){
  const me = currentInternalUser();
  const allowedSecteurIds = getAllowedSecteurIds();
  const upcomingDue = computeUpcomingDueMachines(allowedSecteurIds);
  const upcoming = state.interventions
    .filter(iv=> iv.type==='preventive' && iv.status!=='terminee' && (!allowedSecteurIds || allowedSecteurIds.includes(client(iv.clientId)?.secteurId)))
    .sort((a,b)=>(a.plannedDate||'9999').localeCompare(b.plannedDate||'9999'));
  const CONF_LABELS = { attente:'En attente du client', contre_proposition:'Contre-proposition du client', acceptee:'Confirmée', null:'Non envoyée au client', undefined:'Non envoyée au client' };
  const CONF_COLORS = { attente:'#C4780F', contre_proposition:'#B23B3B', acceptee:'#3F8A5C' };
  return `
    <div style="max-width:980px;">
      ${upcomingDue.length ? `
        <div class="dash-section">
          <div class="dash-section-title">🔔 Échéances à venir non planifiées <span class="muted" style="font-weight:400;">(prochains 90 jours, calculées automatiquement depuis la dernière MP1)</span></div>
          ${upcomingDue.map(u=>`
            <div class="dash-alert-row" style="align-items:center;">
              <span>${u.overdue?'⚠️ ':''}<strong>${escapeHtml(u.cl?.name||'—')}</strong> — ${escapeHtml(u.m.model)} <span class="muted">(${escapeHtml(u.m.serial)})</span></span>
              <span style="display:flex; align-items:center; gap:10px;">
                <span style="color:${u.overdue?'#B23B3B':'#C4780F'}; font-weight:600;">${fmtDateLong(u.due)}</span>
                <button class="btn btn-primary btn-sm" data-plan-due-machine="${u.m.id}" data-plan-due-client="${u.cl?.id||''}" data-plan-due-date="${u.due}">Planifier maintenant</button>
              </span>
            </div>
          `).join('')}
        </div>
      ` : ''}
      ${upcoming.length? upcoming.map(iv=>{
        const cl = client(iv.clientId); const m = machine(iv.machineId);
        const confKey = iv.clientConfirmation || 'null';
        const confColor = CONF_COLORS[iv.clientConfirmation] || '#8A8778';
        return `
        <div class="card req-card">
          <div class="req-top" style="cursor:pointer;" data-open-mp="${iv.id}">
            <div>

async function validateMaintenanceForClient(ivId){
  const iv = state.interventions.find(i=>i.id===ivId);
  if(!iv) return;
  const me = currentInternalUser();
  iv.clientConfirmation = 'acceptee';
  iv.valide = true;
  iv.valideeAt = iso(new Date());
  iv.valideePar = `${me? me.name : 'Responsable'} (validé pour le client)`;
  await saveState();
  logAudit('maintenance_validee_pour_client', `${client(iv.clientId)?.name||''} — ${fmtDateLong(iv.plannedDate)}`);
  showToast('Date validée à la place du client');
  renderContent();
}

/* ================= VUE DEMANDES — TRI KANBAN (À qualifier → À planifier → Planifié → En cours → Terminé) ================= */
const SLOT_LABELS = { matin:'Matin', 'apres-midi':'Après-midi', journee:'Journée entière' };
const KANBAN_COLUMNS = [
  { key:'qualifier', label:'À qualifier', color:'#d03b3b' },
  { key:'planifier', label:'À planifier', color:'#ec835a' },
  { key:'planifie', label:'Planifié', color:'#2a78d6' },
  { key:'encours', label:'En cours', color:'#c9631f' },
  { key:'termine', label:'Terminé', color:'#0ca30c' },
];
function kanbanColumnOf(iv, today){
  if(iv.status==='demande') return 'qualifier';
  if(iv.status==='creee') return 'planifier';
  if(iv.status==='terminee') return 'termine';
  if(iv.status==='planifiee'){ return (iv.plannedDate && iv.plannedDate<=today) ? 'encours' : 'planifie'; }
  return 'planifier';
}
let kanbanSecteurFilter = 'all';
function viewDemandesKanban(){
  const allowedSecteurIds = getAllowedSecteurIds();
  const today = iso(new Date());
  let scoped = state.interventions.filter(iv=> !allowedSecteurIds || allowedSecteurIds.includes(client(iv.clientId)?.secteurId));
  if(kanbanSecteurFilter!=='all') scoped = scoped.filter(iv=>client(iv.clientId)?.secteurId===kanbanSecteurFilter);
  // ne garde que ce qui date de moins de 60 jours pour "Terminé", sinon la colonne devient interminable
  const sixtyDaysAgo = iso(addDays(new Date(),-60));
  scoped = scoped.filter(iv=> iv.status!=='terminee' || (iv.termineeAt||iv.createdAt||'') >= sixtyDaysAgo);

  const grouped = {}; KANBAN_COLUMNS.forEach(c=>grouped[c.key]=[]);
  scoped.forEach(iv=>{ grouped[kanbanColumnOf(iv, today)].push(iv); });
  Object.values(grouped).forEach(list=>list.sort((a,b)=>(a.plannedDate||a.createdAt||'').localeCompare(b.plannedDate||b.createdAt||'')));

  const PRIORITE_DOT = { urgente:'#d03b3b', normale:'#B4B2A9' };
  return `
    <div style="display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;">
      <div class="field-hint" style="margin:0;">Vue d'ensemble du parcours d'une demande, de la réception jusqu'à la clôture. Cliquez une carte pour agir dessus.</div>
      <select id="kanban-secteur-filter" style="width:auto; margin-left:auto;">
        <option value="all" ${kanbanSecteurFilter==='all'?'selected':''}>Tous les secteurs</option>
        ${state.secteurs.filter(s=>!allowedSecteurIds || allowedSecteurIds.includes(s.id)).map(s=>`<option value="${s.id}" ${kanbanSecteurFilter===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
      </select>
    </div>
    <div class="kanban-board">
      ${KANBAN_COLUMNS.map(col=>`
        <div class="kanban-col">
          <div class="kanban-col-head" style="border-top-color:${col.color};">
            <span>${col.label}</span><span class="kanban-col-count">${grouped[col.key].length}</span>
          </div>
          <div class="kanban-col-body">
            ${grouped[col.key].length ? grouped[col.key].slice(0,40).map(iv=>{
              const cl = client(iv.clientId);
              const t = iv.technicianId ? tech(iv.technicianId) : null;
              return `
              <div class="kanban-card" data-kanban-card="${iv.id}" data-kanban-col="${col.key}">
                <div class="kanban-card-top">
                  <span class="kanban-card-dot" style="background:${PRIORITE_DOT[iv.priorite]||PRIORITE_DOT.normale};"></span>
                  <span class="kanban-card-client">${escapeHtml(cl?.name||'—')}</span>
                </div>
                <div class="kanban-card-sub">${escapeHtml((iv.panne||typeLabel(iv.type)||'').slice(0,55))}</div>
                <div class="kanban-card-meta">
                  ${iv.plannedDate ? `<span>${fmtDate(new Date(iv.plannedDate))}</span>` : ''}
                  ${t ? `<span>· ${escapeHtml(t.name)}</span>` : ''}
                  ${iv.plannedSlot ? `<span class="kanban-slot-badge">${SLOT_LABELS[iv.plannedSlot]||iv.plannedSlot}</span>` : ''}
                </div>
              </div>`;
            }).join('') : `<div class="kanban-empty">Rien ici</div>`}
            ${grouped[col.key].length>40 ? `<div class="kanban-empty">+ ${grouped[col.key].length-40} autre(s)</div>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}
function viewDashboard(){
  const allowedSecteurIds = getAllowedSecteurIds();
  const scoped = state.interventions.filter(iv=> !allowedSecteurIds || allowedSecteurIds.includes(client(iv.clientId)?.secteurId));
  const today = iso(new Date());
  const monthStart = today.slice(0,7)+'-01';
  const ninetyDaysAgoDate = addDays(new Date(), -90);
  const ninetyDaysAgo = iso(ninetyDaysAgoDate);

  const thisMonth = scoped.filter(iv=> (iv.createdAt||'').slice(0,10) >= monthStart);
  const late = scoped.filter(iv=> iv.status!=='terminee' && iv.plannedDate && iv.plannedDate < today);
  const enCours = scoped.filter(iv=> iv.status!=='terminee');

  // Temps moyen de résolution (sur les 90 derniers jours, interventions avec horodatage de clôture)
  const resolved = scoped.filter(iv=> iv.termineeAt && iv.createdAt && iv.termineeAt >= ninetyDaysAgo);
  let mttrLabel = '—';
  if(resolved.length){
    const totalMs = resolved.reduce((sum,iv)=> sum + (new Date(iv.termineeAt) - new Date(iv.createdAt)), 0);
    const avgDays = totalMs / resolved.length / 86400000;
    mttrLabel = avgDays < 1 ? `${Math.round(avgDays*24)} h` : `${avgDays.toFixed(1)} j`;
  }

  // Ponctualité préventif (MP1/contrôle terminées à temps sur les 12 derniers mois)
  const yearAgo = iso(addDays(new Date(), -365));
  const preventifs = scoped.filter(iv=> iv.type==='preventive' && iv.termineeAt && iv.termineeAt >= yearAgo && iv.plannedDate);
  const ponctuels = preventifs.filter(iv=> iv.termineeAt.slice(0,10) <= iv.plannedDate);
  const tauxPonctualite = preventifs.length ? Math.round((ponctuels.length/preventifs.length)*100) : null;

  // Répartition par statut/type
  const statusCounts = { rouge:0, vert:0, orange:0, gris:0, bleu:0 };
  scoped.filter(iv=>iv.status!=='terminee').forEach(iv=>{ const k = interventionStatusKey(iv); if(statusCounts[k]!==undefined) statusCounts[k]++; });
  const maxStatus = Math.max(1, ...Object.values(statusCounts));
  const STATUS_BAR_COLORS = { rouge:'#C0453D', vert:'#4FA35C', orange:'#E0952F', gris:'#8A8778', bleu:'#4E8FE0' };

  // Charge par technicien (interventions actives)
  const visibleTechs = allowedSecteurIds ? state.technicians.filter(t=> !t.secteurId || allowedSecteurIds.includes(t.secteurId)) : state.technicians;
  const charge = visibleTechs.map(t=>({ t, count: enCours.filter(iv=>ivAssignedTo(iv,t.id)).length })).sort((a,b)=>b.count-a.count).slice(0,10);
  const maxCharge = Math.max(1, ...charge.map(c=>c.count));

  // Clients avec pannes récurrentes (correctives des 90 derniers jours)
  const correctivesRecent = scoped.filter(iv=> (iv.type==='corrective'||(iv.type||'').startsWith('corrective')) && (iv.createdAt||'').slice(0,10) >= ninetyDaysAgo);
  const byClient = {};
  correctivesRecent.forEach(iv=>{ byClient[iv.clientId] = (byClient[iv.clientId]||0) + 1; });
  const topClients = Object.entries(byClient).map(([clientId,count])=>({ cl:client(clientId), count })).filter(x=>x.cl).sort((a,b)=>b.count-a.count).slice(0,6);
  const maxClientCount = Math.max(1, ...topClients.map(c=>c.count));
  const upcomingDueCount = computeUpcomingDueMachines(allowedSecteurIds).length;
  const lowStockCount = state.stockItems.filter(s=> (!allowedSecteurIds || !s.secteurId || allowedSecteurIds.includes(s.secteurId)) && s.quantite<=s.seuilAlerte).length;

  /* ---- calculs additionnels pour la refonte du tableau de bord ---- */
  const demandes = scoped.filter(iv=>iv.status==='demande');
  const demandesUrgentes = demandes.filter(iv=>iv.priorite==='urgente').length;
  const weekStart = iso(startOfWeek(new Date()));
  const weekEnd = iso(addDays(startOfWeek(new Date()), 6));
  const thisWeek = scoped.filter(iv=> iv.plannedDate && iv.plannedDate>=weekStart && iv.plannedDate<=weekEnd);
  const todayIvs = scoped.filter(iv=> iv.plannedDate===today && iv.status!=='terminee')
    .sort((a,b)=>{
      const an = a.technicianId ? (tech(a.technicianId)?.name||'') : '';
      const bn = b.technicianId ? (tech(b.technicianId)?.name||'') : '';
      return an.localeCompare(bn);
    });
  const dueRisk = computeUpcomingDueMachines(allowedSecteurIds).slice(0,8);
  const recentDemandes = demandes.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,6);
  const chargeSemaine = visibleTechs.map(t=>{
    const mine = thisWeek.filter(iv=>ivAssignedTo(iv,t.id));
    const prev = mine.filter(iv=>iv.type==='preventive').length;
    const autre = mine.length - prev;
    return { t, prev, autre, tot: mine.length };
  }).filter(c=>c.tot>0 || visibleTechs.length<=8).sort((a,b)=>b.tot-a.tot);
  const maxChargeSemaine = Math.max(1, ...chargeSemaine.map(c=>c.tot));
  const STATUS_TAG_BG = { demande:'#FBEADD', encours:'#E3EEF3', retard:'#F8E1DE' };
  const PRIORITE_TAG = { urgente:{bg:'rgba(208,59,59,.12)', fg:'#d03b3b', label:'Urgent'}, normale:{bg:'#EEEBE3', fg:'#6B675C', label:'Normal'} };

  return `
    ${(lowStockCount>0 || demandesUrgentes>0) ? `
    <div class="dash2-banner">
      <span class="dash2-banner-icon">${icon('warning')}</span>
      <div>
        ${demandesUrgentes>0?`<strong>${demandesUrgentes} demande${demandesUrgentes>1?'s':''} urgente${demandesUrgentes>1?'s':''}</strong> en attente de qualification. `:''}
        ${lowStockCount>0?`<strong>${lowStockCount} référence${lowStockCount>1?'s':''}</strong> de pièces sous le seuil de stock.`:''}
      </div>
    </div>` : ''}

    <div class="dash2-tiles">
      <div class="dash2-tile" style="--tile-color:#d03b3b;"><span class="lab">Demandes à qualifier</span><span class="val">${demandes.length}</span><span class="sub">${demandesUrgentes?`dont ${demandesUrgentes} urgente${demandesUrgentes>1?'s':''}`:'aucune urgente'}</span></div>
      <div class="dash2-tile" style="--tile-color:#ec835a;"><span class="lab">Préventifs en retard</span><span class="val">${late.length}</span><span class="sub">échéance planifiée dépassée</span></div>
      <div class="dash2-tile" style="--tile-color:#2a78d6;"><span class="lab">Interventions cette semaine</span><span class="val">${thisWeek.length}</span><span class="sub">${chargeSemaine.length} technicien(s) mobilisé(s)</span></div>
      <div class="dash2-tile" style="--tile-color:${tauxPonctualite!==null && tauxPonctualite<80?'#ec835a':'#0ca30c'};"><span class="lab">Respect des échéances</span><span class="val">${tauxPonctualite===null?'—':tauxPonctualite+'%'}</span><span class="sub">préventif, 12 derniers mois</span></div>
    </div>

    <div class="dash2-grid2">
      <div class="dash2-card">
        <div class="hd"><h3>Charge de la semaine par technicien</h3><span class="sp"></span><span class="n">${fmtDate(new Date(weekStart))} — ${fmtDate(new Date(weekEnd))}</span></div>
        <div class="bd">
          <div class="dash2-legend">
            <span><span class="sw" style="background:#2a78d6;"></span>Préventif</span>
            <span><span class="sw" style="background:#eb6834;"></span>Correctif / autre</span>
          </div>
          ${chargeSemaine.length ? chargeSemaine.map(c=>{
            const p = maxChargeSemaine ? (c.prev/maxChargeSemaine*100) : 0;
            const a = maxChargeSemaine ? (c.autre/maxChargeSemaine*100) : 0;
            return `
            <div class="dash2-charge-row">
              <div class="dash2-charge-top"><span>${escapeHtml(c.t.name)}</span><span class="muted">${c.tot} intervention${c.tot>1?'s':''}</span></div>
              <div class="dash2-charge-track">
                <div style="width:${p}%; background:#2a78d6;" title="Préventif : ${c.prev}"></div>
                <div style="width:${a}%; background:#eb6834;" title="Correctif / autre : ${c.autre}"></div>
              </div>

          }).join('') : `<div class="dash-empty">Aucune intervention planifiée cette semaine dans votre périmètre.</div>`}
        </div>
      </div>
      <div class="dash2-card">
        <div class="hd"><h3>Aujourd'hui</h3><span class="sp"></span><span class="n">${todayIvs.length} intervention${todayIvs.length>1?'s':''}</span></div>
        <div class="bd" style="padding:0;">
          <table><tbody>
            ${todayIvs.length ? todayIvs.slice(0,8).map(iv=>{
              const cl = client(iv.clientId);
              const t = iv.technicianId ? tech(iv.technicianId) : null;
              return `<tr data-open-dash-iv="${iv.id}">
                <td>
                  <div class="dash2-row-title">${escapeHtml(cl?.name||'—')}</div>
                  <div class="dash2-row-sub">${escapeHtml((iv.panne||typeLabel(iv.type)||'').slice(0,50))} ${t?'· '+escapeHtml(t.name):''}</div>

      <div class="dash2-card">
        <div class="hd"><h3>Dernières demandes reçues</h3><span class="sp"></span><button class="btn btn-ghost btn-sm" data-view="bureau">Tout voir</button></div>
        <div class="bd" style="padding:0;">

/* Compresse une photo côté navigateur avant stockage — laisse l'utilisateur envoyer une vraie
   photo de téléphone (souvent 2 à 8 Mo) tout en gardant un fichier stocké raisonnable, pour
   rester largement sous la limite de taille d'un document Firestore (1 Mo, tous les justificatifs
   confondus). Redimensionne à 1600px de large maximum et réencode en JPEG qualité 0.72. */
function compressImageFile(file, maxDimension=1280, quality=0.6){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Lecture du fichier impossible'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('Image illisible'));
      img.onload = ()=>{
        let { naturalWidth:w, naturalHeight:h } = img;
        if(w > maxDimension || h > maxDimension){
          const scale = maxDimension / Math.max(w,h);
          w = Math.round(w*scale); h = Math.round(h*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); // fond blanc, évite un fond noir sur les PNG transparents
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function loadImageDimensions(dataUrl){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=> resolve({ width: img.naturalWidth || img.width, height: img.naturalHeight || img.height });
    img.onerror = ()=> reject(new Error('Image illisible'));
    img.src = dataUrl;
  });
}
/* Découpe une image trop haute pour une seule page en plusieurs tranches horizontales,
   chacune correspondant à une future page du PDF, pour ne jamais couper le bas d'une pièce jointe. */
async function sliceImageForPdf(dataUrl, naturalWidth, naturalHeight, maxDisplayWidthMm, maxDisplayHeightMm){
  const scale = maxDisplayWidthMm / naturalWidth; // mm par pixel, contraint par la largeur
  const totalDisplayHeight = naturalHeight * scale;
  if(totalDisplayHeight <= maxDisplayHeightMm){
    return [{ dataUrl, displayWidth: maxDisplayWidthMm, displayHeight: totalDisplayHeight }];
  }
  const pageCount = Math.ceil(totalDisplayHeight / maxDisplayHeightMm);
  const sliceHeightPx = Math.ceil(naturalHeight / pageCount);
  const img = new Image();
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=()=>rej(new Error('Image illisible')); img.src=dataUrl; });
  const slices = [];
  for(let i=0;i<pageCount;i++){
    const startY = i*sliceHeightPx;
    const thisSliceHeight = Math.min(sliceHeightPx, naturalHeight-startY);
    if(thisSliceHeight<=0) continue;
    const canvas = document.createElement('canvas');
    canvas.width = naturalWidth; canvas.height = thisSliceHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, startY, naturalWidth, thisSliceHeight, 0, 0, naturalWidth, thisSliceHeight);
    slices.push({ dataUrl: canvas.toDataURL('image/jpeg', 0.85), displayWidth: maxDisplayWidthMm, displayHeight: thisSliceHeight*scale });
  }
  return slices;
}

            <div class="muted" style="font-size:11.5px; margin:2px 0 6px;">Client : ${escapeHtml(d.clientName||'—')} · N° d'appel : ${escapeHtml(d.numeroAppel||'—')}</div>

              ${EXPENSE_CATEGORIES.filter(c=>parseFloat(d.categories[c.key])>0).map(c=>`<span class="pill" style="background:#EEE; color:var(--ink-soft);">${c.label} : ${fmtEUR(d.categories[c.key])}</span>`).join('') || '<span class="muted" style="font-size:11px;">Aucune dépense ce jour</span>'}

        }).join('')}
        <div class="flex-between" style="margin-top:10px; padding-top:10px; border-top:2px solid var(--border);">

        ${r.piecesJointes.length? `
          <div style="margin-top:14px;">
            <div style="font-weight:600; font-size:12.5px; margin-bottom:6px;">Pièces jointes (factures)</div>
            ${r.piecesJointes.map(f=>`<a href="${f.dataUrl}" download="${escapeHtml(f.name)}" class="pill" style="background:var(--accent-soft); color:var(--accent); margin:0 6px 6px 0; display:inline-flex; text-decoration:none;">${icon('inbox')} ${escapeHtml(f.name)}</a>`).join('')}
          </div>
        ` : ''}
        ${canAct? `
          <div id="expense-reject-wrap" style="display:none; margin-top:14px;">
            <label style="margin-top:0;">Motif du rejet</label>
            <textarea id="expense-reject-reason" placeholder="Expliquez ce qui doit être corrigé"></textarea>
            <button class="btn btn-danger btn-sm" id="expense-reject-confirm" style="margin-top:8px;">Confirmer le rejet</button>
          </div>
        ` : ''}
      </div>
      <div class="modal-foot" style="justify-content:space-between;">
        <div>${(me && me.role==='admin')? `<button class="btn btn-danger btn-sm" id="delete-expense-btn-review">Supprimer</button>` : ''}</div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-ghost" id="download-expense-pdf-btn">${icon('inbox')} Télécharger le PDF${r.status==='traitee'?' archivé':''}</button>
          ${canAct? `<button class="btn btn-ghost" id="expense-reject-toggle" style="color:#B23B3B; border-color:#EAD3D3;">Rejeter</button><button class="btn btn-primary" id="expense-validate-btn">Valider</button>` : ''}
          <button class="btn btn-primary" id="close-modal-2">Fermer</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=>overlay.remove();
  overlay.querySelector('#close-modal').onclick = close;
  overlay.querySelector('#close-modal-2').onclick = close;
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#delete-expense-btn-review')?.addEventListener('click', async ()=>{
    close();
    await deleteExpenseReport(r.id, refresh);
  });
  const downloadPdfBtn = overlay.querySelector('#download-expense-pdf-btn');
  if(downloadPdfBtn) downloadPdfBtn.onclick = ()=>downloadExpensePDF(r);
  const nextStatusMap = { soumise:'validee_responsable', validee_responsable:'validee_bureau', validee_bureau:'validee_directeur', validee_directeur:'traitee' };
  const validateBtn = overlay.querySelector('#expense-validate-btn');
  if(validateBtn) validateBtn.onclick = async ()=>{
    const wasFinalStep = r.status==='validee_directeur';
    r.history.push({ action:'validee', by:me.name, role:me.role, at:iso(new Date()) });
    r.status = nextStatusMap[r.status];
    r.updatedAt = iso(new Date());
    await saveState();
    logAudit('note_frais_validee', `${r.technicianName} — ${fmtEUR(total)}`);
    if(wasFinalStep){
      downloadExpensePDF(r);
      showToast('Note de frais traitée — PDF d\u2019archive généré');
    } else {
      showToast('Note de frais validée');
    }
    close(); refresh();
  };
  const rejectToggle = overlay.querySelector('#expense-reject-toggle');
  if(rejectToggle) rejectToggle.onclick = ()=>{ overlay.querySelector('#expense-reject-wrap').style.display='block'; };
  const rejectConfirm = overlay.querySelector('#expense-reject-confirm');
  if(rejectConfirm) rejectConfirm.onclick = async ()=>{
    const reason = overlay.querySelector('#expense-reject-reason').value.trim();
    if(!reason){ showToast('Merci de préciser le motif'); return; }
    r.status = 'rejetee'; r.rejectionReason = reason; r.updatedAt = iso(new Date());
    r.history.push({ action:'rejetee', by:me.name, role:me.role, at:iso(new Date()), comment:reason });
    await saveState();
    logAudit('note_frais_rejetee', `${r.technicianName} — ${reason}`);
    close(); refresh();
    showToast('Note de frais rejetée');
  };
}

function openCongeEditModal(requestId, ownerType){
  ownerType = ownerType || 'tech';
  const ownerId = ownerType==='internal' ? authInternalId : authTechId;
  let r = requestId ? state.congeRequests.find(x=>x.id===requestId) : null;
  const isNew = !r;
  if(isNew) r = newCongeRequest(ownerId);
  const canEdit = isNew || r.status==='brouillon' || r.status==='refusee';
  const overlay = document.createElement('div'); overlay.className = 'overlay';
  document.body.appendChild(overlay);
  function close(){ overlay.remove(); }

  function render(){
    overlay.innerHTML = `
      <div class="modal" style="max-width:640px;">
        <div class="modal-head"><div><h3>${isNew?'Nouvelle demande de congé':'Demande de congé'}</h3><p>${escapeHtml(r.technicianName)}</p></div>
        <button class="modal-close" id="close-modal">&times;</button></div>
        <div class="modal-body">
          ${r.status==='refusee'? `<div class="confirm-banner contre" style="border-color:var(--red);"><strong style="color:#8A2E2A;">Refusée</strong> — ${escapeHtml(r.motifRefus||'')}</div>` : ''}
          ${r.status==='accordee'? `<div class="confirm-banner" style="border-color:var(--green);"><strong style="color:#2E6B3E;">Accordée</strong> — du ${fmtDateLong(r.dateDebutConfirmee||r.dateDebut)} au ${fmtDateLong(r.dateFinConfirmee||r.dateFin)} inclus</div>` : ''}
          <label style="margin-top:0;">Type de demande</label>
          <select id="conge-type" ${canEdit?'':'disabled'}>
            ${Object.entries(CONGE_TYPE_LABELS).map(([k,v])=>`<option value="${k}" ${r.type===k?'selected':''}>${v}</option>`).join('')}
          </select>
          <label>Journée</label>
          <div style="display:flex; gap:16px; align-items:center;">
            <label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="radio" name="conge-journee" value="complete" ${!r.demiJournee?'checked':''} ${canEdit?'':'disabled'}> Journée complète</label>
            <label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="radio" name="conge-journee" value="demi" ${r.demiJournee?'checked':''} ${canEdit?'':'disabled'}> Demi-journée à partir de <input type="time" id="conge-heure" value="${r.heure||''}" style="width:110px; display:inline-block;" ${canEdit?'':'disabled'}></label>
          </div>
          <label>Dates</label>
          <div style="display:flex; gap:12px;">
            <div style="flex:1;"><span class="muted" style="font-size:11px;">Du</span><input type="date" id="conge-debut" value="${r.dateDebut}" ${canEdit?'':'disabled'}></div>
            <div style="flex:1;"><span class="muted" style="font-size:11px;">Au (inclus)</span><input type="date" id="conge-fin" value="${r.dateFin}" ${canEdit?'':'disabled'}></div>
          </div>
          <div class="muted" id="conge-jours-ouvres" style="margin-top:6px; font-size:12.5px;">${joursOuvres(r.dateDebut,r.dateFin)} jour(s) ouvré(s)</div>
          <label>Commentaire (facultatif)</label>
          <textarea id="conge-commentaire" ${canEdit?'':'disabled'}>${escapeHtml(r.commentaire||'')}</textarea>
          <label>Signature</label>
          ${canEdit ? `
            <div class="sig-pad-wrap" style="border:1px solid var(--border); border-radius:8px; background:#fff; touch-action:none;">
              <canvas id="conge-sig-canvas" width="600" height="120" style="width:100%; height:120px; display:block; cursor:crosshair;"></canvas>
            </div>
            <button type="button" class="btn btn-ghost btn-sm" id="conge-sig-clear-btn" style="margin-top:6px;">Effacer</button>
          ` : (r.signatureTechnicien ? `<img src="${r.signatureTechnicien}" alt="Signature" style="max-width:220px; border:1px solid var(--border); border-radius:6px; background:#fff; padding:4px;">` : `<div class="muted" style="font-size:12px;">Aucune signature.</div>`)}
        </div>
        <div class="modal-foot" style="justify-content:space-between;">
          <div>${(!isNew && canEdit)? `<button class="btn btn-danger btn-sm" id="delete-conge-btn">Supprimer</button>` : ''}</div>
          <div style="display:flex; gap:10px;">
            <button class="btn btn-ghost" id="cancel-modal">Fermer</button>
            ${(r.status==='accordee'||r.status==='refusee')? `<button class="btn btn-ghost" id="download-conge-pdf-btn">${icon('inbox')} Télécharger le PDF</button>` : ''}
            ${canEdit? `<button class="btn btn-ghost" id="save-draft-conge-btn">Enregistrer le brouillon</button><button class="btn btn-primary" id="submit-conge-btn">Soumettre au responsable</button>` : ''}
          </div>
        </div>
      </div>
    `;
    bindEvents();
  }

  function bindEvents(){
    overlay.querySelector('#close-modal').onclick = close;
    overlay.querySelector('#cancel-modal').onclick = close;
    function recalcJours(){
      overlay.querySelector('#conge-jours-ouvres').textContent = `${joursOuvres(overlay.querySelector('#conge-debut').value, overlay.querySelector('#conge-fin').value)} jour(s) ouvré(s)`;
    }
    overlay.querySelector('#conge-debut')?.addEventListener('change', recalcJours);
    overlay.querySelector('#conge-fin')?.addEventListener('change', recalcJours);

    const sigCanvas = overlay.querySelector('#conge-sig-canvas');
    let sigCtx = null, sigDrawing = false, sigHasStroke = false;
    if(sigCanvas){
      const ratio = window.devicePixelRatio || 1;
      const cssW = sigCanvas.clientWidth || 600;
      sigCanvas.width = cssW * ratio; sigCanvas.height = 120 * ratio;
      sigCtx = sigCanvas.getContext('2d');
      if(sigCtx){
        sigCtx.scale(ratio, ratio);
        sigCtx.lineWidth = 2; sigCtx.lineCap = 'round'; sigCtx.strokeStyle = '#1A2B33';
        if(r.signatureTechnicien){
          const img = new Image();
          img.onload = ()=>{ sigCtx.drawImage(img, 0, 0, cssW, 120); sigHasStroke = true; };
          img.src = r.signatureTechnicien;
        }
      }
      function posFromEvent(e){
        const rect = sigCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }
      function start(e){ if(!sigCtx) return; sigDrawing = true; sigHasStroke = true; const p = posFromEvent(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); e.preventDefault(); }
      function move(e){ if(!sigDrawing || !sigCtx) return; const p = posFromEvent(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); e.preventDefault(); }
      function end(){ sigDrawing = false; }
      sigCanvas.addEventListener('mousedown', start); sigCanvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
      sigCanvas.addEventListener('touchstart', start, {passive:false}); sigCanvas.addEventListener('touchmove', move, {passive:false});
      sigCanvas.addEventListener('touchend', end);
    }
    overlay.querySelector('#conge-sig-clear-btn')?.addEventListener('click', ()=>{
      if(!sigCtx) return; sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height); sigHasStroke = false;
    });

    async function persist(submit){
      r.type = overlay.querySelector('#conge-type').value;
      r.demiJournee = overlay.querySelector('input[name="conge-journee"]:checked').value === 'demi';
      r.heure = overlay.querySelector('#conge-heure').value;
      r.dateDebut = overlay.querySelector('#conge-debut').value;
      r.dateFin = overlay.querySelector('#conge-fin').value;
      r.commentaire = overlay.querySelector('#conge-commentaire').value;
      if(sigCanvas && sigHasStroke) r.signatureTechnicien = sigCanvas.toDataURL('image/png');
      if(!state.congeRequests.includes(r)) state.congeRequests.push(r);
      r.updatedAt = iso(new Date());
      if(submit){
        r.status = 'soumise';
        r.motifRefus = null;
        r.history.push({ action:'soumise', by:r.technicianName, role:'technicien', at:iso(new Date()) });
      }
      await saveState();
      close();
      renderTechContent();
      showToast(submit? 'Demande soumise au responsable' : 'Brouillon enregistré');
    }
    overlay.querySelector('#download-conge-pdf-btn')?.addEventListener('click', ()=>downloadCongePDF(r));
    overlay.querySelector('#delete-conge-btn')?.addEventListener('click', async ()=>{
      const idx = state.congeRequests.findIndex(x=>x.id===r.id);
      if(idx>-1) state.congeRequests.splice(idx,1);
      await saveState();
      close(); renderTechContent();
    });
    const saveDraftBtn = overlay.querySelector('#save-draft-conge-btn');
    if(saveDraftBtn) saveDraftBtn.onclick = ()=>persist(false);
    const submitBtn = overlay.querySelector('#submit-conge-btn');
    if(submitBtn) submitBtn.onclick = ()=>persist(true);
  }
  render();
}

function openExpenseEditModal(reportId, ownerType, forceWeekStart){
  ownerType = ownerType || 'tech';
  const ownerId = ownerType==='internal' ? authInternalId : authTechId;
  let r = reportId ? state.expenseReports.find(x=>x.id===reportId) : null;
  let isNew = !r;
  if(isNew){
    const defaultWeek = forceWeekStart || iso(startOfWeek(new Date()));
    const existingThisWeek = ownerType==='internal'
      ? state.expenseReports.find(x=>x.internalUserId===ownerId && x.weekStart===defaultWeek)
      : state.expenseReports.find(x=>x.technicianId===ownerId && x.weekStart===defaultWeek);
    if(existingThisWeek){ r = existingThisWeek; isNew = false; }
    else { r = newExpenseReport(ownerId, defaultWeek, ownerType); }
  }
  const canEdit = isNew || r.status==='brouillon' || r.status==='rejetee';

  function groupedFields(d, idx){
    const groups = {};
    EXPENSE_CATEGORIES.forEach(c=>{ (groups[c.group] = groups[c.group]||[]).push(c); });
    return Object.keys(groups).map(g=>`
      <div style="margin-top:10px;">
        <div class="muted" style="font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; margin-bottom:4px;">${g}</div>
        <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px;">
          ${groups[g].map(c=>`
            <div>
              <label style="margin:0 0 3px; font-weight:500; font-size:10.5px;">${c.label}</label>
              <input type="number" min="0" step="0.01" ${canEdit?'':'disabled'} data-day="${idx}" data-cat="${c.key}" value="${d.categories[c.key]||0}" style="padding:6px 8px; font-size:12.5px;">
            </div>`).join('')}
        </div>
      </div>`).join('');
  }
  function dayCard(d, idx){
    return `
      <div class="card" style="padding:12px 14px; margin-bottom:10px;">
        <div style="font-weight:700; font-size:13px; margin-bottom:8px;">${WEEK_DAYS[idx].label} — ${fmtDateLong(d.date)}</div>
        <div class="row2">
          <div><label style="margin-top:0;">Client (site)</label>
            <div class="autocomplete-wrap">
              <input type="text" ${canEdit?'':'disabled'} class="expense-client-search" data-day="${idx}"
                     value="${escapeHtml(d.clientName||'')}" placeholder="Rechercher un client...">
              <input type="hidden" class="expense-client-value" data-day="${idx}" value="${escapeHtml(d.clientId||'')}">
              <div class="autocomplete-suggestions" data-day="${idx}" style="display:none;"></div>
            </div>
          </div>
          <div><label style="margin-top:0;">N° d'appel <span class="muted" style="font-weight:400; font-size:10px;">(auto si connu)</span></label><input type="text" ${canEdit?'':'disabled'} data-day="${idx}" data-field="numeroAppel" value="${escapeHtml(d.numeroAppel||'')}" placeholder="Ex. AP-2026-0123"></div>
        </div>
        ${groupedFields(d, idx)}
        <label style="margin-top:8px;">Précision « Autre »</label>
        <input type="text" ${canEdit?'':'disabled'} data-day="${idx}" data-field="autreDescription" value="${escapeHtml(d.autreDescription||'')}" placeholder="Si dépense 'Autre' renseignée ci-dessus">
        <div style="text-align:right; margin-top:8px; font-weight:600; font-size:12.5px;">Total jour : <span id="day-total-${idx}">${fmtEUR(computeDayTotal(d))}</span></div>
      </div>`;
  }

  const overlay = document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML = `<div class="modal" style="max-width:700px;"></div>`;
  document.body.appendChild(overlay);
  const close = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });

  function switchToWeek(newWeekStart){
    const existing = ownerType==='internal'
      ? state.expenseReports.find(x=>x.internalUserId===ownerId && x.weekStart===newWeekStart && x.id!==r.id)
      : state.expenseReports.find(x=>x.technicianId===ownerId && x.weekStart===newWeekStart && x.id!==r.id);
    if(existing){ close(); openExpenseEditModal(existing.id, ownerType); return; }
    if(canEdit && isNew){
      // brouillon jamais enregistré : on peut réutiliser le même objet en mémoire sans risque
      r.weekStart = newWeekStart;
      r.days = WEEK_DAYS.map((d,i)=> emptyExpenseDay(d.key, iso(addDays(new Date(newWeekStart+'T00:00:00'), i))));
    } else {
      // note déjà enregistrée (brouillon sauvegardé, soumise, validée...) : on ne la modifie jamais en place,
      // on ouvre une nouvelle note vierge pour la semaine consultée
      close(); openExpenseEditModal(null, ownerType, newWeekStart); return;
    }
    render();
  }

  function render(){
    overlay.querySelector('.modal').innerHTML = `
      <div class="modal-head"><div><h3>${isNew?'Nouvelle note de frais':'Note de frais'}</h3><p>Semaine du ${fmtDateLong(r.weekStart)}</p></div>

            <button class="btn btn-ghost btn-sm" id="week-next">Semaine suiv. →</button>

          </div>
        ` : ''}
        ${r.status==='rejetee'? `<div class="confirm-banner contre" style="border-color:var(--red);"><strong style="color:#8A2E2A;">Rejetée</strong> — ${escapeHtml(r.rejectionReason||'')}</div>` : ''}
        ${r.status==='traitee'? `<div class="confirm-banner" style="border-color:var(--green); display:flex; align-items:center; justify-content:space-between; gap:12px;"><span><strong style="color:#2E6B3E;">✅ Traitée par la comptabilité</strong> — le PDF final est disponible.</span><button class="btn btn-primary btn-sm" id="download-expense-pdf-btn-tech-top">${icon('inbox')} Télécharger le PDF</button></div>` : ''}
        <label style="margin-top:0;">Kilométrage en début de semaine</label>
        <input type="number" min="0" id="expense-km" ${canEdit?'':'disabled'} value="${r.kmDebutSemaine||0}">
        ${r.days.map((d,idx)=>dayCard(d,idx)).join('')}
        <div class="flex-between" style="margin-top:6px; padding-top:10px; border-top:2px solid var(--border);">
          <strong>Total TTC de la semaine</strong><strong id="expense-grand-total" style="font-size:16px;">${fmtEUR(computeReportTotal(r))}</strong>
        </div>
        <label style="margin-top:16px;">Pièces jointes (factures — photo ou PDF)</label>
        <div class="field-hint" style="margin-top:0;">Les photos sont automatiquement compressées à l'envoi — une vraie photo de téléphone (quelques Mo) passe sans souci. Les PDF, non compressibles, restent limités à 400 Ko.</div>
        ${canEdit? `<input type="file" id="expense-file-input" accept="image/*,application/pdf" multiple>` : ''}
        <div id="expense-files-list" style="margin-top:8px;">
          ${r.piecesJointes.map((f,i)=>`<div class="list-item" style="padding:6px 4px;" data-file-row="${i}"><span style="font-size:12px;">${icon('inbox')} ${escapeHtml(f.name)} (${Math.round(f.size/1024)} Ko)</span>${canEdit?`<button type="button" class="btn btn-danger btn-sm" data-remove-file="${i}">Retirer</button>`:''}</div>`).join('')}
        </div>
        <label style="margin-top:16px;">Signature ${ownerType==='internal'?'du responsable':'du technicien'}</label>
        ${canEdit ? `
          <div class="sig-pad-wrap" style="border:1px solid var(--border); border-radius:8px; background:#fff; touch-action:none;">
            <canvas id="expense-sig-canvas" width="600" height="150" style="width:100%; height:150px; display:block; cursor:crosshair;"></canvas>
          </div>
          <div style="display:flex; gap:8px; margin-top:6px; align-items:center;">
            <button type="button" class="btn btn-ghost btn-sm" id="sig-clear-btn">Effacer</button>
            <span class="muted" style="font-size:11.5px;">Dessinez votre signature ci-dessus avant de soumettre.</span>
          </div>
        ` : (r.signatureTechnicien ? `<img src="${r.signatureTechnicien}" alt="Signature" style="max-width:260px; border:1px solid var(--border); border-radius:6px; background:#fff; padding:4px;">` : `<div class="muted" style="font-size:12px;">Aucune signature enregistrée.</div>`)}
      </div>
      <div class="modal-foot" style="justify-content:space-between;">
        <div>${(!isNew && canEdit)? `<button class="btn btn-danger btn-sm" id="delete-expense-btn">Supprimer</button>` : ''}</div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-ghost" id="cancel-modal">Fermer</button>
          ${!isNew? `<button class="btn btn-ghost" id="download-expense-pdf-btn-tech">${icon('inbox')} Télécharger le PDF</button>` : ''}
          ${canEdit? `<button class="btn btn-ghost" id="save-draft-btn">Enregistrer le brouillon</button><button class="btn btn-primary" id="submit-expense-btn">${ownerType==='internal'?'Soumettre au bureau':'Soumettre au responsable'}</button>` : ''}
        </div>
      </div>
    `;
    bindEvents();
  }

  function bindEvents(){
    overlay.querySelector('#close-modal').onclick = close;
    overlay.querySelector('#cancel-modal').onclick = close;
    overlay.querySelector('#week-prev')?.addEventListener('click', ()=>switchToWeek(iso(addDays(new Date(r.weekStart+'T00:00:00'),-7))));
    overlay.querySelector('#week-next')?.addEventListener('click', ()=>switchToWeek(iso(addDays(new Date(r.weekStart+'T00:00:00'),7))));
    overlay.querySelector('#week-today')?.addEventListener('click', ()=>switchToWeek(iso(startOfWeek(new Date()))));

  function recalc(){
    r.days.forEach((d,idx)=>{
      const el = overlay.querySelector(`#day-total-${idx}`);
      if(el) el.textContent = fmtEUR(computeDayTotal(d));
    });
    const gt = overlay.querySelector('#expense-grand-total');
    if(gt) gt.textContent = fmtEUR(computeReportTotal(r));
  }
  overlay.querySelectorAll('[data-cat]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const idx = +inp.dataset.day, cat = inp.dataset.cat;
      r.days[idx].categories[cat] = parseFloat(inp.value)||0;
      recalc();
    });
  });
  function selectClientForDay(idx, clientObj){
    const searchInput = overlay.querySelector(`.expense-client-search[data-day="${idx}"]`);
    const valueInput = overlay.querySelector(`.expense-client-value[data-day="${idx}"]`);
    const suggBox = overlay.querySelector(`.autocomplete-suggestions[data-day="${idx}"]`);
    searchInput.value = clientObj.name;
    valueInput.value = clientObj.id;
    r.days[idx].clientId = clientObj.id;
    r.days[idx].clientName = clientObj.name;
    suggBox.style.display = 'none';
    const found = ownerType==='tech' ? findLikelyNumeroAppel(ownerId, clientObj.id, r.days[idx].date) : '';
    const numInput = overlay.querySelector(`input[data-field="numeroAppel"][data-day="${idx}"]`);
    if(found && numInput && !numInput.value.trim()){
      numInput.value = found;
      r.days[idx].numeroAppel = found;
      showToast(`N° d'appel rempli automatiquement : ${found}`);
    }
  }
  overlay.querySelectorAll('.expense-client-search').forEach(inp=>{
    const idx = +inp.dataset.day;
    const suggBox = overlay.querySelector(`.autocomplete-suggestions[data-day="${idx}"]`);
    inp.addEventListener('input', ()=>{
      const q = inp.value.trim().toLowerCase();
      const valueInput = overlay.querySelector(`.expense-client-value[data-day="${idx}"]`);
      valueInput.value = ''; // toute frappe invalide la sélection précédente tant qu'un client n'est pas re-choisi
      r.days[idx].clientId = null; r.days[idx].clientName = inp.value;
      if(!q){ suggBox.style.display='none'; return; }
      const matches = state.clients.filter(c=>c.name.toLowerCase().includes(q)).slice(0,8);
      if(!matches.length){ suggBox.innerHTML = `<div class="autocomplete-item muted">Aucun client trouvé</div>`; suggBox.style.display='block'; return; }
      suggBox.innerHTML = matches.map(c=>`<div class="autocomplete-item" data-client-id="${c.id}">${escapeHtml(c.name)}<div class="ac-sub">${escapeHtml(c.ville)}</div></div>`).join('');
      suggBox.style.display = 'block';
      suggBox.querySelectorAll('[data-client-id]').forEach(item=>{
        item.addEventListener('mousedown', e=>{ e.preventDefault(); selectClientForDay(idx, client(item.dataset.clientId)); });
      });
    });
    inp.addEventListener('focus', ()=>{ if(inp.value.trim()) inp.dispatchEvent(new Event('input')); });
    inp.addEventListener('blur', ()=>{ setTimeout(()=>{ suggBox.style.display='none'; }, 150); });
  });
  overlay.querySelectorAll('input[data-field="numeroAppel"], input[data-field="autreDescription"]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const idx = +inp.dataset.day, field = inp.dataset.field;
      r.days[idx][field] = inp.value;
    });
  });
  const fileInput = overlay.querySelector('#expense-file-input');
  function renderFilesList(){
    const list = overlay.querySelector('#expense-files-list');
    list.innerHTML = r.piecesJointes.map((f,i)=>`<div class="list-item" style="padding:6px 4px;" data-file-row="${i}"><span style="font-size:12px;">${icon('inbox')} ${escapeHtml(f.name)} (${Math.round(f.size/1024)} Ko)</span>${canEdit?`<button type="button" class="btn btn-danger btn-sm" data-remove-file="${i}">Retirer</button>`:''}</div>`).join('') || `<div class="muted" style="font-size:12px;">Aucune pièce jointe.</div>`;
    list.querySelectorAll('[data-remove-file]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        r.piecesJointes.splice(+btn.dataset.removeFile,1);
        if(!isNew && state.expenseReports.includes(r)) await saveState();
        renderFilesList();
        showToast('Pièce jointe retirée');
      });
    });
  }
  if(fileInput) fileInput.addEventListener('change', async ()=>{
    const files = Array.from(fileInput.files||[]);
    for(const f of files){
      const isImage = f.type.startsWith('image/');
      if(!isImage && f.size > 400*1024){
        showToast(`« ${f.name} » dépasse 400 Ko — ignoré (les PDF ne peuvent pas être compressés automatiquement, préférez une version plus légère)`);
        continue;
      }
      if(f.size > 10*1024*1024){
        showToast(`« ${f.name} » dépasse 10 Mo — trop volumineux même pour la compression, ignoré`);
        continue;
      }
      let dataUrl, storedSize;
      if(isImage){
        try{
          dataUrl = await compressImageFile(f);
          storedSize = Math.round(dataUrl.length * 0.75); // taille réelle approximative décodée du base64
        }catch(e){
          showToast(`« ${f.name} » n'a pas pu être compressée — ignorée`);
          continue;
        }
      } else {
        dataUrl = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(f); });
        storedSize = f.size;
      }
      r.piecesJointes.push({ name:f.name, size:storedSize, dataUrl, addedAt:iso(new Date()) });
    }
    fileInput.value = '';
    if(!isNew && state.expenseReports.includes(r)) await saveState();
    renderFilesList();
  });
  renderFilesList();

  // ---- Pavé de signature (dessin tactile / souris) ----
  const sigCanvas = overlay.querySelector('#expense-sig-canvas');
  let sigCtx = null, sigDrawing = false, sigHasStroke = false;
  if(sigCanvas){
    // le canevas doit avoir une résolution interne cohérente avec sa taille affichée
    const ratio = window.devicePixelRatio || 1;
    const cssW = sigCanvas.clientWidth || 600;
    sigCanvas.width = cssW * ratio; sigCanvas.height = 150 * ratio;
    sigCtx = sigCanvas.getContext('2d');
    if(sigCtx){
    sigCtx.scale(ratio, ratio);
    sigCtx.lineWidth = 2; sigCtx.lineCap = 'round'; sigCtx.strokeStyle = '#1A2B33';
    if(r.signatureTechnicien){
      const img = new Image();
      img.onload = ()=>{ sigCtx.drawImage(img, 0, 0, cssW, 150); sigHasStroke = true; };
      img.src = r.signatureTechnicien;
    }
    }
    function posFromEvent(e){
      const rect = sigCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }
    function start(e){ if(!sigCtx) return; sigDrawing = true; sigHasStroke = true; const p = posFromEvent(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); e.preventDefault(); }
    function move(e){ if(!sigDrawing || !sigCtx) return; const p = posFromEvent(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); e.preventDefault(); }
    function end(){ sigDrawing = false; }
    sigCanvas.addEventListener('mousedown', start); sigCanvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    sigCanvas.addEventListener('touchstart', start, {passive:false}); sigCanvas.addEventListener('touchmove', move, {passive:false});
    sigCanvas.addEventListener('touchend', end);
  }
  overlay.querySelector('#sig-clear-btn')?.addEventListener('click', ()=>{
    if(!sigCtx) return;
    sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);
    sigHasStroke = false;
  });
  function captureSignature(){
    if(sigCanvas && sigHasStroke) r.signatureTechnicien = sigCanvas.toDataURL('image/png');
  }

  async function persist(submit){
    r.kmDebutSemaine = parseFloat(overlay.querySelector('#expense-km').value)||0;
    captureSignature();
    if(!state.expenseReports.includes(r)) state.expenseReports.push(r);
    r.updatedAt = iso(new Date());
    if(submit){
      if(ownerType==='internal'){
        // Un responsable ne peut pas valider sa propre note : on saute directement l'étape "responsable"
        r.status = 'validee_responsable';
        r.history.push({ action:'soumise (auto-validée niveau responsable)', by:r.technicianName, role:'responsable', at:iso(new Date()) });
      } else {
        r.status = 'soumise';
        r.history.push({ action:'soumise', by:r.technicianName, role:'technicien', at:iso(new Date()) });
      }
    }
    await saveState();
    close();
    if(ownerType==='internal') renderContent(); else renderTechContent();
    showToast(submit? (ownerType==='internal' ? 'Note de frais soumise au bureau' : 'Note de frais soumise au responsable') : 'Brouillon enregistré');
  }
  overlay.querySelector('#download-expense-pdf-btn-tech')?.addEventListener('click', ()=>downloadExpensePDF(r));
  overlay.querySelector('#download-expense-pdf-btn-tech-top')?.addEventListener('click', ()=>downloadExpensePDF(r));
  overlay.querySelector('#delete-expense-btn')?.addEventListener('click', async ()=>{
    close();
    await deleteExpenseReport(r.id, ownerType==='internal' ? renderContent : renderTechContent);
  });
  const saveDraftBtn = overlay.querySelector('#save-draft-btn');
  if(saveDraftBtn) saveDraftBtn.onclick = ()=>persist(false);
  const submitBtn = overlay.querySelector('#submit-expense-btn');
  if(submitBtn) submitBtn.onclick = ()=>persist(true);
  } // fin bindEvents

  render();
}

function viewHotlineInternal(){

  const queue = all.filter(h=>h.status!=='resolue');

function parseContractTypesCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  const header = lines[0].split(',').map(h=>h.trim().toLowerCase());
  const idx = k => header.indexOf(k);
  return lines.slice(1).map(line=>{
    const cells = line.match(/(".*?"|[^,]+|(?<=,)(?=,)|^(?=,))/g) || line.split(',');
    const clean = cells.map(c=>c.replace(/^"|"$/g,'').trim());
    return { serie: clean[idx('serie')] || '', client: clean[idx('client')] || '', type_contrat: clean[idx('type_contrat')] || '' };
  }).filter(r=>r.serie);
}

function parseScheduleCsv(text){
