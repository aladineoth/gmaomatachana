let importSchedAnalysis = null;
async function analyzeSchedImport(){
  const previewBox = document.getElementById('import-sched-preview');
  const fileInput = document.getElementById('import-sched-file');
  const file = fileInput.files[0];
  if(!file){ showToast('Choisissez un fichier CSV'); return; }
  previewBox.innerHTML = `<div class="helper-note">Analyse en cours...</div>`;
  try{
    const text = await file.text();
    const rows = parseScheduleCsv(text);
    const serialIndex = {};
    state.machines.forEach(m=>{ if(m.serial) serialIndex[m.serial.trim().toUpperCase()] = m; });
    const techByFirstName = {};
    state.technicians.forEach(t=>{ const first = (t.name||'').trim().split(/\s+/)[0].toUpperCase(); techByFirstName[first] = t; });

    const results = { toCreate:[], noMachine:[], noTech:[], alreadyPlanned:0 };
    rows.forEach(r=>{
      const m = serialIndex[r.serie.trim().toUpperCase()];
      if(!m){ results.noMachine.push(r); return; }
      const tech = techByFirstName[r.technicien.trim().toUpperCase()];
      if(!tech){ results.noTech.push(r); return; }
      const existingNear = state.interventions.some(iv=> iv.machineId===m.id && iv.type==='preventive' && iv.status!=='terminee' &&
        iv.plannedDate && Math.abs(new Date(iv.plannedDate)-new Date(r.date))<15*86400000);
      if(existingNear){ results.alreadyPlanned++; return; }
      results.toCreate.push({ row:r, machine:m, tech });
    });

    importSchedAnalysis = results;

function generateQrPrintSheet(){

    const cl = client(m.clientId);
    const url = qrPrintMode==='request' ? requestFormUrl(m.id) : machineScanUrl(m.id);

async function restockItem(itemId){
  const s = state.stockItems.find(x=>x.id===itemId);
  if(!s) return;
  const qty = prompt(`Quantité à ajouter au stock de « ${s.designation} » (actuellement ${s.quantite}) :`, '10');
  if(qty===null) return;
  const n = parseInt(qty,10);
  if(!n || n<=0){ showToast('Quantité invalide'); return; }
  s.quantite += n;
  s.movements.push({ type:'reappro', qty:n, at:iso(new Date()), by:(currentInternalUser()||{}).name||'' });
  await saveState();
  renderContent();
  showToast(`Stock mis à jour : ${s.quantite} en stock`);
}
async function deleteStockItem(itemId){
  if(!confirm('Supprimer cette référence du stock ?')) return;
  state.stockItems = state.stockItems.filter(x=>x.id!==itemId);
  await saveState();
  renderContent();
}
/* Décrémente automatiquement le stock quand une pièce est marquée « remplacée » sur une intervention.
   Rapprochement par référence (ref) — silencieux si aucune correspondance en stock. */
async function decrementStockForPiece(ref, qty){
  const s = state.stockItems.find(x=>x.ref===ref);
  if(!s) return;
  s.quantite = Math.max(0, s.quantite - (qty||1));
  s.movements.push({ type:'sortie', qty:(qty||1), at:iso(new Date()) });
  await saveState();
}

      </div>
    `;

      if(!confirm('Remplacer définitivement les données actuelles par celles de cette ancienne sauvegarde ?')) return;

      // et on restaure tout le reste (clients, techniciens, machines, interventions...) depuis l'ancienne sauvegarde.

      state = { ...parsed, expenseReports: expenseReports||parsed.expenseReports||[], congeRequests: congeRequests||parsed.congeRequests||[] };
      await migrateState();
      await saveState();
      logAudit('recovery', `Restauration depuis l'ancienne sauvegarde — ${parsed.clients.length} clients récupérés`);

      renderContent();

function extractDepartment(ville){
  const m = (ville||'').trim().match(/\((\d{4,5})\)\s*$/);
  if(!m) return null;
  const cp = m[1];
  const code = cp.startsWith('97') ? cp.slice(0,3) : cp.slice(0,2);
  return code;
}

/* ---------------- Import de tâches depuis un export Toggl Plan ----------------
   Analyse un export JSON des tâches + membres (récupéré manuellement depuis l'onglet
   Réseau du navigateur, cf. procédure). Exclut les congés/RTT, reconnaît le préfixe
   officiel Matachana (MP/C/S/D/I/A), rapproche le client et le technicien, puis crée
   les interventions correspondantes après validation d'un aperçu. */
const TOGGL_LEAVE_PATTERN = /\b(CONGE|CONGER|RTT)\b|^CP$|^CP VALID/i;
const TOGGL_PREFIX_TYPE_MAP = { MP:'preventive', I:'installation', D:'devis', C:'corrective', C1:'corrective_n1', C2:'corrective_n2', C3:'corrective_n3' };
const TOGGL_COLOR_STATUS_MAP = { 41:'rouge', 30:'rouge' }; // estimation prudente — le reste est laissé en automatique
function parseTogglTaskName(rawName){
  const name = (rawName||'').trim();
  let m = name.match(/^([A-Z][A-Z0-9]*(?:\s*-\s*[A-Z][A-Z0-9]*){0,2})\s*-\s*(\d{2,3})\s*-\s*(.+)$/i);
  if(m) return { prefix: m[1].replace(/\s+/g,'').toUpperCase(), dept: m[2], client: m[3].trim() };
  m = name.match(/^([A-Z][A-Z0-9]*(?:\s*-\s*[A-Z][A-Z0-9]*){0,2})\s*-\s*(.+)$/i);
  if(m && !/^\d+$/.test(m[2].trim())) return { prefix: m[1].replace(/\s+/g,'').toUpperCase(), dept: null, client: m[2].trim() };
  return { prefix: null, dept: null, client: name };
}
function togglNormalize(s){
  let out = (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
  out = out.replace(/\/\/.*$/, '');
  // recolle les sigles séparés par des points (ex. "L.D.A.R" -> "LDAR") AVANT de couper la ponctuation,
  // sinon chaque lettre isolée finit filtrée comme mot vide ("L", "D" sont aussi des articles français).
  out = out.replace(/\b(?:[A-Z]\.){2,}[A-Z]?\b/g, m => m.replace(/\./g,''));
  out = out.replace(/'/g,' ');
  out = out.replace(/\bCL\b/g,'CLINIQUE').replace(/\bHP\b/g,'HOPITAL').replace(/\bCH\b/g,'HOPITAL');
  out = out.replace(/\bSAINTE?\b/g,'SAINT').replace(/\bST\b/g,'SAINT');
  out = out.replace(/[^A-Z0-9]+/g,' ');
  const stop = new Set(['DE','DU','DES','LA','LE','L','D','ET','SITE']);
  return out.split(' ').filter(w=>w && !stop.has(w)).join(' ').trim();
}
function findBestClientMatch(guess, clients){
  const ng = togglNormalize(guess);
  if(!ng) return null;
  let best = null, bestScore = 0;
  clients.forEach(c=>{
    const nc = togglNormalize(c.name);
    if(!nc) return;
    let score = 0;
    if(nc===ng) score = 1000;
    else if(nc.includes(ng) || ng.includes(nc)) score = Math.min(nc.length, ng.length);
    if(score > bestScore){ bestScore = score; best = c; }
  });
  return bestScore >= 4 ? best : null;
}
function togglPrefixToType(prefix){
  if(!prefix) return null;
  const core = prefix.replace(/^S-?/, ''); // "S-C" -> "C" (suite d'une corrective), on garde le flag suite à part
  return TOGGL_PREFIX_TYPE_MAP[core] || (core.charAt(0)==='C' ? 'corrective' : null);
}

async function analyzeTogglAssign(){
  const previewBox = document.getElementById('toggl-assign-preview');
  const tasksFile = document.getElementById('toggl-assign-tasks').files[0];
  const membersFile = document.getElementById('toggl-assign-members').files[0];
  if(!tasksFile){ showToast('Le fichier des tâches est requis'); return; }
  previewBox.innerHTML = `<div class="helper-note">Analyse en cours...</div>`;
  try{
    const tasksJson = JSON.parse(await tasksFile.text());
    const membersJson = membersFile ? JSON.parse(await membersFile.text()) : [];
    const memberByMembership = {};
    membersJson.forEach(m=>{ memberByMembership[m.membership_id] = m; });

    const candidates = state.interventions.filter(iv=>
      (iv.createdBy==='import_revisions' || iv.createdBy==='import_schedule_2027') && !iv.technicianId
    );
    const allClients = state.clients;
    const results = { toAssign:[], ambiguous:[], noIntervention:[], noClientMatch:[], noTechMatch:[], excludedLeave:0, newTechs:{} };

    tasksJson.forEach(t=>{
      if(TOGGL_LEAVE_PATTERN.test(t.name||'')){ results.excludedLeave++; return; }
      const parsed = parseTogglTaskName(t.name);
      const cl = findBestClientMatch(parsed.client, allClients);
      const memberIds = t.workspace_members || [];
      const togglMembers = memberIds.map(id=>memberByMembership[id]).filter(Boolean);
      if(!cl){ results.noClientMatch.push(t.name); return; }
      if(!togglMembers.length){ results.noTechMatch.push(t.name); return; }
      const primaryMember = togglMembers[0];

      const taskDate = (t.start_date||'').slice(0,10);
      let matches = candidates.filter(iv=>iv.clientId===cl.id && !iv.technicianId && iv.plannedDate===taskDate);
      let approx = false;
      if(matches.length===0 && taskDate){
        // tolérance de quelques jours, au cas où la date aurait légèrement bougé entre les deux outils
        matches = candidates.filter(iv=>{
          if(iv.clientId!==cl.id || iv.technicianId || !iv.plannedDate) return false;
          return Math.abs(new Date(iv.plannedDate)-new Date(taskDate)) <= 3*86400000;
        });
        approx = true;
      }
      if(matches.length===0){ results.noIntervention.push(`${t.name} (${taskDate||'sans date'})`); return; }
      if(matches.length>1){ results.ambiguous.push(`${t.name} — ${matches.length} interventions possibles chez ${cl.name}`); return; }

      results.newTechs[primaryMember.membership_id] = primaryMember;
      results.toAssign.push({ intervention: matches[0], member: primaryMember, client: cl, approxDate: approx, taskName: t.name });
    });

    togglAssignAnalysis = results;
    const trulyNewTechs = Object.values(results.newTechs).filter(m=>!state.technicians.some(t=>t.name.toLowerCase()===((m.name||'')).toLowerCase()));
    previewBox.innerHTML = `
      <div class="card" style="padding:14px 16px; background:#FBFAF6;">
        <div style="font-weight:700; margin-bottom:8px;">Aperçu de l'attribution</div>
        <div class="helper-note" style="margin:0 0 4px;">✅ ${results.toAssign.length} intervention(s) qui recevront un technicien</div>
        <div class="helper-note" style="margin:0 0 4px;">👤 ${trulyNewTechs.length} nouveau(x) technicien(s) à créer : ${trulyNewTechs.map(m=>escapeHtml(m.name)).join(', ')||'—'}</div>
        <div class="helper-note" style="margin:0 0 4px;">🏖️ ${results.excludedLeave} congé(s)/RTT exclu(s)</div>
        <div class="helper-note" style="margin:0 0 4px; color:${results.ambiguous.length?'#C4780F':'inherit'};">ℹ️ ${results.ambiguous.length} cas ambigu(s) — plusieurs interventions possibles, laissés inchangés</div>
        <div class="helper-note" style="margin:0 0 4px; color:${results.noIntervention.length?'#B23B3B':'inherit'};">⚠️ ${results.noIntervention.length} tâche(s) sans intervention correspondante dans le GMAO</div>
        <div class="helper-note" style="margin:0 0 4px; color:${results.noClientMatch.length?'#B23B3B':'inherit'};">⚠️ ${results.noClientMatch.length} tâche(s) sans client reconnu</div>
        <button class="btn btn-primary btn-sm" id="toggl-assign-confirm-btn" style="margin-top:10px;" ${results.toAssign.length===0?'disabled':''}>Confirmer l'attribution de ${results.toAssign.length} technicien(s)</button>
        ${(results.ambiguous.length || results.noIntervention.length || results.noClientMatch.length) ? `
          <details style="margin-top:10px;"><summary style="cursor:pointer; font-size:12px; color:var(--ink-soft);">Voir le détail des cas non traités</summary>
            <div style="margin-top:8px; font-size:11.5px; max-height:200px; overflow-y:auto;">
              ${results.ambiguous.map(n=>`<div>Ambigu : ${escapeHtml(n)}</div>`).join('')}
              ${results.noIntervention.map(n=>`<div>Aucune intervention : ${escapeHtml(n)}</div>`).join('')}
              ${results.noClientMatch.map(n=>`<div>Client non reconnu : ${escapeHtml(n)}</div>`).join('')}
            </div>
          </details>
        ` : ''}
      </div>
    `;
  }catch(e){
    console.error(e);
    previewBox.innerHTML = `<div class="helper-note" style="color:#B23B3B;">Erreur de lecture des fichiers : ${escapeHtml(e.message||String(e))}</div>`;
  }
}
async function confirmTogglAssign(){
  if(!togglAssignAnalysis) return;
  const { toAssign } = togglAssignAnalysis;
  if(!confirm(`Attribuer un technicien à ${toAssign.length} intervention(s) ?`)) return;
  let assigned = 0;
  toAssign.forEach(({intervention, member})=>{
    const tech = findOrCreateTechFromTogglMember(member);
    intervention.technicianId = tech.id;
    if(intervention.status==='creee') intervention.status = 'planifiee';
    assigned++;
  });
  await saveState();
  logAudit('toggl_assign_tech', `${assigned} intervention(s) rattachée(s) à un technicien depuis Toggl Plan`);
  showToast(`${assigned} intervention(s) mise(s) à jour avec leur technicien`);
  togglAssignAnalysis = null;
  renderContent();
}
/* Attribution rapide par secteur : répartit les interventions « à planifier » qui ont déjà
   une date de maintenance connue, mais pas encore de technicien, vers les vrais techniciens
   du secteur choisi, en tournant entre eux, SANS toucher aux dates. Couvre toutes les
   interventions en attente pour ce secteur, quelle que soit leur origine (import ou saisie
   manuelle) — pas seulement celles venant des deux outils d'import Toggl/révisions. Pensé
   pour aller vite ; le tri fin reste ensuite à la main, via un glisser-déposer sur le planning. */
async function quickAssignBySecteur(secteurId){
  const secteurTechs = state.technicians.filter(t=>t.secteurId===secteurId);
  if(!secteurTechs.length){ showToast('Aucun technicien enregistré pour ce secteur'); return; }
  const allPending = state.interventions.filter(iv=> iv.status==='creee' && !iv.technicianId && client(iv.clientId)?.secteurId===secteurId);
  const candidates = allPending.filter(iv=>iv.plannedDate);
  const noDateCount = allPending.length - candidates.length;
  if(!candidates.length){ showToast(`Aucune intervention avec une date connue en attente pour ce secteur${noDateCount?` (${noDateCount} sans date, à planifier manuellement)`:''}`); return; }
  if(!confirm(`Répartir ${candidates.length} intervention(s) entre ${secteurTechs.length} technicien(s) du secteur, à leurs dates déjà prévues ?${noDateCount?`\n\n(${noDateCount} autre(s), sans date connue, resteront à planifier manuellement.)`:''}`)) return;
  candidates.sort((a,b)=>(a.plannedDate||'9999').localeCompare(b.plannedDate||'9999'));
  let i = 0;
  candidates.forEach(iv=>{
    iv.technicianId = secteurTechs[i % secteurTechs.length].id;
    if(iv.status==='creee') iv.status = 'planifiee';
    i++;
  });
  await saveState();
  logAudit('quick_assign_secteur', `${candidates.length} intervention(s) réparties entre ${secteurTechs.length} technicien(s) — ${secteurLabel(secteurId)}`);
  showToast(`${candidates.length} intervention(s) réparties${noDateCount?` — ${noDateCount} sans date restent à planifier manuellement`:''}`);
  renderContent();
}

async function confirmTogglImport(){
  if(!togglImportAnalysis) return;
  const { secteurId, results } = togglImportAnalysis;
  if(!confirm(`Créer ${results.toImport.length} intervention(s) et les nouveaux techniciens nécessaires ?`)) return;

  const techByMembership = {};
  Object.values(results.newTechs).forEach(m=>{
    let existing = state.technicians.find(t=>t.name.toLowerCase()===((m.name||'')).toLowerCase());
    if(!existing){
      const color = TECH_COLORS[state.technicians.length % TECH_COLORS.length];
      const username = slugify(m.email ? m.email.split('@')[0] : m.name);
      existing = { id:uid('t'), name:m.name, color, secteurId, username, email:m.email||null, password:DEMO_PASSWORD, failedLogins:0, lockedUntil:null };
      state.technicians.push(existing);
    }
    techByMembership[m.membership_id] = existing;
  });
  // les mots de passe des nouveaux techniciens seront hachés par migrateState() au prochain chargement
  await migrateState();

  let created = 0;
  results.toImport.forEach(r=>{
    const tech = techByMembership[r.member.membership_id] || state.technicians.find(t=>t.name.toLowerCase()===r.member.name.toLowerCase());
    const type = togglPrefixToType(r.parsed.prefix);
    const isSuite = /^S-?/.test(r.parsed.prefix||'');
    const colorOverride = TOGGL_COLOR_STATUS_MAP[r.task.color] || null;
    state.interventions.push({
      id: uid('iv'), clientId: r.client.id, machineId: r.machine ? r.machine.id : null,
      serial: r.machine ? r.machine.serial : (r.machineAmbiguous ? 'À vérifier — plusieurs machines' : '—'),
      panne: `[Import Toggl Plan] ${r.task.name}`,
      status: 'planifiee', type: type, priseEnCharge: null,
      piecesNecessaires: '', piecesListe: [], priorite: 'normale', notesBureau: '',
      technicianId: tech ? tech.id : null, plannedDate: r.task.start_date, plannedEndDate: r.task.end_date || r.task.start_date,
      numeroAppel: null, valide: false, valideeAt: null, valideePar: null,
      piecesCommandees: false, piecesCommandeesAt: null, piecesCommandeesPar: null,
      clientConfirmation: null, clientProposedDate: null, clientNote: null,
      createdAt: iso(new Date()), createdBy: 'import_toggl', signaleePar: null,
      suiteIntervention: isSuite, sousTraitance: false, bloqueComptabilite: false, feuilleDeRoute: null,
      colorOverride, laneHint: null, enSuspens: false, suspensRaison: null, suspensAt: null, suspensPar: null,
      attentePriseEnCompte: false, priseEnCompteAt: null, priseEnComptePar: null,
    });
    created++;
  });
  await saveState();
  logAudit('toggl_import', `${created} intervention(s) importées, secteur ${secteurLabel(secteurId)}`);
  showToast(`${created} intervention(s) importée(s) avec succès`);
  togglImportAnalysis = null;
  renderContent();
}

    overlay.querySelector('.modal-body').innerHTML = tracked.length ? tracked.map(p=>{
      const alert = alerts.find(a=>a.ref===p.ref);
      const statusTxt = alert
        ? (alert.daysLeft<0 ? `<span style="color:#B23B3B; font-weight:600;">En retard de ${Math.abs(alert.daysLeft)}j</span>` : `Échéance dans ${alert.daysLeft}j (${fmtDateLong(alert.dueDate)})`)
        : `<span class="muted">Jamais enregistré comme remplacé</span>`;
      return `
        <div class="list-item">
          <div>
            <div style="font-weight:600; font-size:13px;">${escapeHtml(p.designation)} <span class="muted" style="font-weight:400;">(réf. ${escapeHtml(p.ref)})</span></div>
            <div style="font-size:11.5px; margin-top:2px;">${statusTxt}</div>
            <div class="muted" style="font-size:11px; margin-top:2px;">Périodicité : tous les ${p.periodiciteMois} mois</div>
          </div>
          <button class="btn btn-primary btn-sm" data-mark-replaced="${p.ref}">Marquer remplacée aujourd'hui</button>
        </div>`;
    }).join('') : `<div class="empty">Ce protocole ne définit aucune pièce à périodicité de remplacement suivie.</div>`;
    overlay.querySelectorAll('[data-mark-replaced]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const ref = btn.dataset.markReplaced;
        const piece = tracked.find(p=>p.ref===ref);
        m.piecesHistorique.push({ ref, designation: piece?piece.designation:ref, replacedAt: iso(new Date()), replacedBy: (currentInternalUser()||{}).name || (portal==='tech-app'?tech(authTechId).name:null) });
        await saveState();
        logAudit('piece_remplacee', `${cl?cl.name:''} — ${m.model} — ${piece?piece.designation:ref}`);
        showToast('Remplacement enregistré');
        render();
        renderTopbar(); renderContent();
      });
    });
  }
  const overlay = document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><div><h3>${escapeHtml(m.model)}</h3><p>${escapeHtml(cl?cl.name:'')} — ${escapeHtml(m.serial)}</p></div>
      <button class="modal-close" id="close-modal">&times;</button></div>
      <div class="modal-body"></div>
      <div class="modal-foot"><button class="btn btn-primary" id="close-modal-2">Fermer</button></div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=>overlay.remove();
  overlay.querySelector('#close-modal').onclick = close;
  overlay.querySelector('#close-modal-2').onclick = close;
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  render();
}

        </table>

        ${(m.piecesHistorique||[]).length ? `
          <label style="margin-top:18px;">Pièces remplacées au fil du temps</label>
          <table>
            <thead><tr><th>Date</th><th>Pièce</th><th>Par</th></tr></thead>

      <div class="modal-foot" style="justify-content:flex-end;">

    document.body.appendChild(overlay);

  function renderDocList(){

      </div>`).join('') : `<div class="muted" style="font-size:12px;">Aucun document.</div>`;
    list.querySelectorAll('[data-download-doc]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const d = docs[+btn.dataset.downloadDoc];
        const a = document.createElement('a'); a.href = d.dataUrl; a.download = d.name; a.click();
      });
    });
    list.querySelectorAll('[data-remove-doc]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        docs.splice(+btn.dataset.removeDoc, 1);
        state.machineDocuments[machineId] = docs;
        await saveState();
        renderDocList();
        showToast('Document retiré');
      });
    });
  }
  function bindEvents(){
    overlay.querySelector('#close-modal').onclick = ()=>overlay.remove();
    overlay.querySelector('#cancel-modal').onclick = ()=>overlay.remove();
    overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
    overlay.querySelectorAll('[data-open-hist-iv]').forEach(row=>{
      row.addEventListener('click', ()=>{ overlay.remove(); openJobDetail(row.dataset.openHistIv); });

    const fileInput = overlay.querySelector('#fiche-doc-input');

        const dataUrl = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(f); });
        docs.push({ name:f.name, size:f.size, dataUrl, addedAt:iso(new Date()) });
      }
      fileInput.value = '';
      if(!state.machineDocuments) state.machineDocuments = {};
      state.machineDocuments[machineId] = docs;
      await saveState();
      renderDocList();
    });
    renderDocList();
  }
  render();
}

async function deleteMachine(id){
  const m = state.machines.find(x=>x.id===id); if(!m) return;
  const nbIv = state.interventions.filter(iv=>iv.machineId===id).length;
  const warn = nbIv ? ` ${nbIv} intervention(s) référencent cette machine et conserveront son numéro de série en texte.` : '';
  if(!confirm(`Supprimer la machine « ${m.model} — ${m.serial} » ?${warn} Cette action est irréversible.`)) return;
  state.machines = state.machines.filter(x=>x.id!==id);
  await saveState(); renderContent();
  logAudit('machine_supprimee', `${m.model} — ${m.serial}`);
  showToast('Machine supprimée');
}
function emptyProtocolPiece(){ return { ref:'', designation:'', qty:1, periodiciteMois:null }; }
function openEditProtocolModal(key){
  const isNew = !key || !state.protocols[key];
  const proto = isNew ? { label:'', annuelle:[emptyProtocolPiece()], controle:[] } : JSON.parse(JSON.stringify(state.protocols[key]));
  const workingKey = isNew ? null : key;

  function piecesRows(list, listName){
    return list.map((p,i)=>`
      <div style="display:flex; gap:6px; margin-bottom:6px; align-items:center;">
        <input type="text" data-piece="${listName}" data-idx="${i}" data-field="ref" value="${escapeHtml(p.ref)}" placeholder="Réf." style="width:100px;">
        <input type="text" data-piece="${listName}" data-idx="${i}" data-field="designation" value="${escapeHtml(p.designation)}" placeholder="Désignation" style="flex:1;">
        <input type="number" min="1" data-piece="${listName}" data-idx="${i}" data-field="qty" value="${p.qty}" style="width:56px;" title="Quantité">
        <input type="number" min="1" data-piece="${listName}" data-idx="${i}" data-field="periodiciteMois" value="${p.periodiciteMois||''}" placeholder="Mois" style="width:64px;" title="Périodicité de remplacement (en mois) — laisser vide si pas de suivi">
        ${listName==='annuelle' ? `<button type="button" class="btn btn-ghost btn-sm" data-copy-to-controle="${i}" style="flex:none; white-space:nowrap;" title="Ajouter aussi cette pièce à la liste « visite de contrôle »">+ Contrôle</button>` : ''}
        <button type="button" class="btn btn-danger btn-sm" data-remove-piece="${listName}" data-idx="${i}" style="flex:none;">&times;</button>
      </div>`).join('');
  }
  function render(){
    overlay.querySelector('#protocol-body').innerHTML = `
      <label style="margin-top:0;">Nom du protocole</label>
      <input type="text" id="ep-label" value="${escapeHtml(proto.label)}" placeholder="Ex. SC500 — Hospitalier/Laboratoires">
      <label>Pièces — révision annuelle</label>
      <div class="field-hint" style="margin-top:-4px;">Colonnes : réf. · désignation · quantité · périodicité de remplacement en mois (ex. 24 pour un contacteur remplacé tous les 2 ans — laisser vide sinon)</div>
      <div id="ep-annuelle">${piecesRows(proto.annuelle,'annuelle')}</div>
      <button type="button" class="btn btn-ghost btn-sm" id="add-piece-annuelle">${icon('plus')} Ajouter une pièce</button>
      <label style="margin-top:18px;">Pièces — visite de contrôle</label>
      <div id="ep-controle">${piecesRows(proto.controle,'controle')}</div>
      <button type="button" class="btn btn-ghost btn-sm" id="add-piece-controle">${icon('plus')} Ajouter une pièce</button>
    `;
    overlay.querySelectorAll('[data-piece]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const listName = inp.dataset.piece, idx = +inp.dataset.idx, field = inp.dataset.field;
        if(field==='qty') proto[listName][idx][field] = parseInt(inp.value,10)||1;
        else if(field==='periodiciteMois') proto[listName][idx][field] = inp.value ? (parseInt(inp.value,10)||null) : null;
        else proto[listName][idx][field] = inp.value;
      });
    });
    overlay.querySelectorAll('[data-remove-piece]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const listName = btn.dataset.removePiece, idx = +btn.dataset.idx;
        proto[listName].splice(idx,1);
        render();
      });
    });
    overlay.querySelectorAll('[data-copy-to-controle]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = +btn.dataset.copyToControle;
        const p = proto.annuelle[idx];
        const alreadyThere = proto.controle.some(c=>c.ref && c.ref===p.ref);
        if(alreadyThere){ showToast('Cette pièce est déjà dans la liste « visite de contrôle »'); return; }
        proto.controle.push({ ref:p.ref, designation:p.designation, qty:p.qty, periodiciteMois:p.periodiciteMois||null });
        render();
        showToast('Pièce ajoutée à la liste « visite de contrôle »');
      });
    });
    overlay.querySelector('#add-piece-annuelle').onclick = ()=>{ proto.annuelle.push(emptyProtocolPiece()); render(); };
    overlay.querySelector('#add-piece-controle').onclick = ()=>{ proto.controle.push(emptyProtocolPiece()); render(); };
  }

  const overlay = document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><div><h3>${isNew?'Nouveau protocole':'Modifier le protocole'}</h3><p>Liste des pièces à remplacer, par modèle d'équipement</p></div>
      <button class="modal-close" id="close-modal">&times;</button></div>
      <div class="modal-body" id="protocol-body"></div>
      <div class="modal-foot" style="justify-content:space-between;">
        <div>${!isNew? `<button class="btn btn-danger btn-sm" id="delete-protocol-btn">Supprimer le protocole</button>` : ''}</div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-ghost" id="cancel-modal">Annuler</button>
          <button class="btn btn-primary" id="confirm-modal">Enregistrer</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  render();
  closeOnOverlay(overlay);
  const delBtn = overlay.querySelector('#delete-protocol-btn');
  if(delBtn) delBtn.onclick = async ()=>{
    const nbMachines = state.machines.filter(m=>m.protocolKey===workingKey).length;
    const warn = nbMachines ? ` ${nbMachines} machine(s) perdront cette association.` : '';
    if(!confirm(`Supprimer ce protocole ?${warn}`)) return;
    delete state.protocols[workingKey];
    state.machines.forEach(m=>{ if(m.protocolKey===workingKey) m.protocolKey=null; });
    await saveState(); overlay.remove(); renderContent();
    logAudit('protocole_supprime', proto.label);
    showToast('Protocole supprimé');
  };
  overlay.querySelector('#confirm-modal').onclick = async ()=>{
    const label = overlay.querySelector('#ep-label').value.trim();
    if(!label){ showToast('Le nom du protocole est requis'); return; }
    proto.label = label;
    proto.annuelle = proto.annuelle.filter(p=>p.ref.trim()||p.designation.trim());
    proto.controle = proto.controle.filter(p=>p.ref.trim()||p.designation.trim());
    const finalKey = workingKey || ('CUSTOM_' + uid('p').toUpperCase().replace(/[^A-Z0-9]/g,''));
    state.protocols[finalKey] = proto;
    await saveState(); overlay.remove(); renderContent();
    logAudit(isNew?'protocole_cree':'protocole_modifie', label);
    showToast(isNew? 'Protocole créé' : 'Protocole mis à jour');
  };
}

/* ---------------- Gantt drag, drop & resize ---------------- */
/* Navigation du planning par glissement horizontal, comme sur Toggl Plan — remplace les
   boutons « Précédent/Suivant ». En vue Semaine, on avance jour par jour ; en vue Mois,
   on bascule d'un mois entier dès qu'on a glissé plus de la moitié d'un mois. */
function computeDayColumnWidthPx(){
  const el = document.querySelector('.gantt-daybg');
  return (el && el.getBoundingClientRect().width) || 34;
}
function bindGanttPanDrag(refreshFn){
  const scrollEl = document.querySelector('.gantt-scroll');
  const gridEl = document.getElementById('gantt-grid');
  if(!scrollEl || !gridEl) return;
  let pan = null;
  function start(clientX){
    pan = { startX: clientX, dayWidth: computeDayColumnWidthPx() };
    gridEl.style.transition = 'none';
    scrollEl.classList.add('panning');
  }
  function move(clientX){
    if(!pan) return;
    gridEl.style.transform = `translateX(${clientX - pan.startX}px)`;
  }
  function end(clientX){
    if(!pan) return;
    const dx = clientX - pan.startX;
    gridEl.style.transform = '';
    gridEl.style.transition = '';
    scrollEl.classList.remove('panning');
    pan = null;
    const dayWidth = computeDayColumnWidthPx();
    if(planningZoom==='week'){
      const daysDelta = Math.round(-dx / dayWidth);
      if(daysDelta===0) return;
      currentPlanningWeekStart = addDays(currentPlanningWeekStart, daysDelta);
    } else {
      // vue Mois : seuil basé sur une distance fixe à l'écran (pas un nombre de jours,
      // car une colonne de jour est bien plus étroite en vue Mois qu'en vue Semaine)
      const pxThreshold = 70;
      if(Math.abs(dx) < pxThreshold) return;
      currentMonth = addMonths(currentMonth, dx<0?1:-1);
    }
    refreshFn();
  }
  scrollEl.addEventListener('mousedown', e=>{
    if(e.target.closest('.gantt-bar') || e.target.classList.contains('resize-handle')) return;
    start(e.clientX);
    e.preventDefault();
  });
  window.addEventListener('mousemove', e=>{ if(pan) move(e.clientX); });
  window.addEventListener('mouseup', e=>{ if(pan) end(e.clientX); });
  scrollEl.addEventListener('touchstart', e=>{
    if(e.target.closest('.gantt-bar') || e.target.classList.contains('resize-handle')) return;
    start(e.touches[0].clientX);
  }, {passive:true});
  scrollEl.addEventListener('touchmove', e=>{ if(pan) move(e.touches[0].clientX); }, {passive:true});
  scrollEl.addEventListener('touchend', e=>{ if(pan) end(e.changedTouches[0].clientX); });
}

  const menu = document.createElement('div');

  menu.innerHTML = ivId
    ? `<div class="gantt-context-item" id="ctx-duplicate">${icon('plus')} Dupliquer</div>`
    : `<div class="gantt-context-item" id="ctx-create-iv">${icon('plus')} Créer une intervention</div>
       <div class="gantt-context-item" id="ctx-create-conge">${icon('calendar')} Marquer en congé/RTT</div>`;
  document.body.appendChild(menu);
  menu.querySelector('#ctx-duplicate')?.addEventListener('click', async ()=>{
    closeGanttContextMenu();
    await duplicateIntervention(ivId);
  });
  menu.querySelector('#ctx-create-iv')?.addEventListener('click', ()=>{
    closeGanttContextMenu();
    openQuickCreateInterventionModal(emptyCellInfo.technicianId, emptyCellInfo.date);
  });
  menu.querySelector('#ctx-create-conge')?.addEventListener('click', ()=>{
    closeGanttContextMenu();
    openQuickCreateCongeModal(emptyCellInfo.technicianId, emptyCellInfo.date);
  });
  setTimeout(()=>document.addEventListener('click', closeGanttContextMenu), 0);
}

function openQuickCreateInterventionModal(technicianId, date){
  const allowedSecteurIds = getAllowedSecteurIds();
  const eligibleClients = allowedSecteurIds ? state.clients.filter(c=>allowedSecteurIds.includes(c.secteurId)) : state.clients;
  const t = tech(technicianId);
  const overlay = document.createElement('div'); overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">

      <button class="modal-close" id="close-modal">&times;</button></div>
      <div class="modal-body">
        <label style="margin-top:0;">Client</label>
        <div class="autocomplete-wrap">
          <input type="text" id="qc-client-search" placeholder="Rechercher un client par nom...">
          <div class="autocomplete-suggestions" id="qc-client-suggestions" style="display:none;"></div>
        </div>
        <label>Machine</label>
        <select id="qc-machine" disabled><option value="">— Sélectionnez d'abord un client —</option></select>
        <label>N° d'appel</label>

        <label>Description / motif</label>
        <textarea id="qc-panne" placeholder="Ce qui a été signalé..."></textarea>
        <label>Type d'intervention</label>
        <select id="qc-type">
          <option value="corrective">Corrective</option>
          <option value="preventive">Préventive</option>
          <option value="devis">Devis</option>
          <option value="installation">Installation</option>
        </select>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="cancel-modal">Annuler</button>
        <button class="btn btn-primary" id="confirm-modal">Créer et planifier</button>
      </div>

  document.body.appendChild(overlay);

  let selectedClientId = null;
  const searchInput = overlay.querySelector('#qc-client-search');

  function refreshMachines(){
    if(!selectedClientId){ machineSelect.innerHTML = `<option value="">— Sélectionnez d'abord un client —</option>`; machineSelect.disabled = true; return; }
    const ms = machinesOf(selectedClientId);
    machineSelect.disabled = false;
    machineSelect.innerHTML = ms.length
      ? ms.map(m=>`<option value="${m.id}">${escapeHtml(m.model)} — ${escapeHtml(m.serial)}</option>`).join('')
      : `<option value="">Aucune machine enregistrée pour ce client</option>`;
  }
  function selectClient(c){
    selectedClientId = c.id;
    searchInput.value = `${c.name} — ${c.ville}`;
    suggBox.style.display = 'none';
    refreshMachines();
  }
  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim().toLowerCase();
    selectedClientId = null;
    if(!q){ suggBox.style.display='none'; refreshMachines(); return; }
    const matches = eligibleClients.filter(c=>c.name.toLowerCase().includes(q)).slice(0,8);
    if(!matches.length){ suggBox.innerHTML = `<div class="autocomplete-item muted">Aucun client trouvé</div>`; suggBox.style.display='block'; return; }
    suggBox.innerHTML = matches.map(c=>`<div class="autocomplete-item" data-client-id="${c.id}">${escapeHtml(c.name)}<div class="ac-sub">${escapeHtml(c.ville)}</div></div>`).join('');
    suggBox.style.display = 'block';
    suggBox.querySelectorAll('[data-client-id]').forEach(item=>{
      item.addEventListener('mousedown', e=>{ e.preventDefault(); selectClient(client(item.dataset.clientId)); });
    });
  });
  searchInput.addEventListener('focus', ()=>{ if(searchInput.value.trim() && !selectedClientId) searchInput.dispatchEvent(new Event('input')); });
  searchInput.addEventListener('blur', ()=>{ setTimeout(()=>{ suggBox.style.display='none'; }, 150); });

  closeOnOverlay(overlay);
  overlay.querySelector('#confirm-modal').onclick = async ()=>{
    if(!selectedClientId){ showToast('Merci de sélectionner un client via la recherche'); return; }

      piecesNecessaires:'', piecesListe:[], priorite:'normale', notesBureau:'',
      technicianId, technicianIds:[], plannedDate:date, plannedEndDate:date, numeroAppel,
      valide:false, valideeAt:null, valideePar:null,
      piecesCommandees:false, piecesCommandeesAt:null, piecesCommandeesPar:null,
      clientConfirmation:null, clientProposedDate:null, clientNote:null,
      createdAt:iso(new Date()), createdBy:(currentInternalUser()||{}).name || 'responsable',
      signaleePar:null, suiteIntervention:false, sousTraitance:false, bloqueComptabilite:false, feuilleDeRoute:null,
      colorOverride:null, laneHint:null, enSuspens:false, suspensRaison:null, suspensAt:null, suspensPar:null,
      attentePriseEnCompte:false, priseEnCompteAt:null, priseEnComptePar:null,
      maintenanceType:null, piecesRemplacees:null, suiteDeId:null,
    });
    await saveState();
    overlay.remove();
    renderTopbar(); renderContent();
    showToast('Intervention créée et planifiée');

}
async function duplicateIntervention(ivId){
  const src = state.interventions.find(i=>i.id===ivId);
  if(!src) return;
  const copy = {
    ...src, id: uid('iv'), status:'planifiee', valide:false, valideeAt:null, valideePar:null,
    createdAt: iso(new Date()), createdBy:(currentInternalUser()||{}).name || 'duplication',
    attentePriseEnCompte:false, priseEnCompteAt:null, priseEnComptePar:null,
    enSuspens:false, suspensRaison:null, suspensAt:null, suspensPar:null,
    clientConfirmation:null, clientProposedDate:null, clientNote:null,
    suiteIntervention:false, suiteMotif:null, suiteDeId:null,
  };
  state.interventions.push(copy);
  await saveState();
  renderContent();
  showToast('Intervention dupliquée sur le même créneau');
}
function bindGanttDragDrop(){
  // draggable sources: backlog cards + placed bars
  document.querySelectorAll('.job-card[data-iv], .gantt-bar[data-iv]').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      if(e.target.classList && e.target.classList.contains('resize-handle')){ e.preventDefault(); return; }
      const id = el.dataset.iv;
      const iv = state.interventions.find(i=>i.id===id);
      if(el.classList.contains('job-card')){
        dragMeta = { id, mode:'new', duration:1 };
      } else {
        const start = new Date(iv.plannedDate+'T00:00:00');
        const end = new Date((iv.plannedEndDate||iv.plannedDate)+'T00:00:00');
        const duration = Math.round((end-start)/86400000)+1;
        dragMeta = { id, mode:'move', duration };
      }
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); dragMeta=null; });
  });

  // clic sur une fiche « À planifier » : sélection pour placement — alternative au glisser-déposer,
  // seule méthode possible quand le planning est ouvert sur un autre écran/fenêtre.
  document.querySelectorAll('.job-card[data-iv]').forEach(el=>{
    let downX=0, downY=0;
    el.addEventListener('mousedown', e=>{ downX=e.clientX; downY=e.clientY; });
    el.addEventListener('click', e=>{
      if(Math.abs(e.clientX-downX)>4 || Math.abs(e.clientY-downY)>4) return; // c'était un glisser, pas un clic
      const id = el.dataset.iv;
      if(pendingPlacementIvId === id) clearPlacementSelection();
      else selectForPlacement(id);
    });
  });

  // clic droit sur une intervention du planning : menu contextuel (Dupliquer)
  if(canValidate() || (currentInternalUser()||{}).role==='bureau'){
    document.querySelectorAll('.gantt-bar[data-iv]').forEach(el=>{
      el.addEventListener('contextmenu', e=>{
        e.preventDefault();
        showGanttContextMenu(e.clientX, e.clientY, el.dataset.iv);
      });
    });
  }

  // drop targets: day background cells
  document.querySelectorAll('.gantt-daybg').forEach(cell=>{
    cell.addEventListener('dragover', e=>{
      e.preventDefault(); cell.classList.add('dragover');
      const rect = cell.getBoundingClientRect();
      const upperHalf = (e.clientY - rect.top) < rect.height/2;
      cell.classList.toggle('dragover-upper', upperHalf);
      cell.classList.toggle('dragover-lower', !upperHalf);
    });
    cell.addEventListener('dragleave', ()=>cell.classList.remove('dragover','dragover-upper','dragover-lower'));
    cell.addEventListener('drop', async e=>{
      e.preventDefault();
      const rect = cell.getBoundingClientRect();
      const droppedSlot = (e.clientY - rect.top) < rect.height/2 ? 'matin' : 'apres-midi';
      cell.classList.remove('dragover','dragover-upper','dragover-lower');
      if(!dragMeta) return;
      const iv = state.interventions.find(i=>i.id===dragMeta.id);
      if(!iv) return;
      const startDate = new Date(cell.dataset.date+'T00:00:00');
      const endDate = addDays(startDate, dragMeta.duration-1);
      iv.technicianId = cell.dataset.tech;
      iv.plannedDate = iso(startDate);
      iv.plannedEndDate = iso(endDate);
      iv.plannedSlot = dragMeta.duration>1 ? null : droppedSlot; // pas de créneau sur plusieurs jours, ambigu
      if(cell.dataset.lane!==undefined) iv.laneHint = parseInt(cell.dataset.lane, 10);
      if(iv.status!=='terminee') iv.status='planifiee';
      await saveState(); renderTopbar(); renderContent();
      showToast(`Intervention planifiée${iv.plannedSlot?' — '+SLOT_LABELS[iv.plannedSlot]:''}`);
    });
    if(canValidate() || (currentInternalUser()||{}).role==='bureau'){
      cell.addEventListener('contextmenu', e=>{
        e.preventDefault();
        showGanttContextMenu(e.clientX, e.clientY, null, { technicianId:cell.dataset.tech, date:cell.dataset.date });
      });
    }
    cell.addEventListener('click', async (e)=>{
      if(!pendingPlacementIvId) return;
      const iv = state.interventions.find(i=>i.id===pendingPlacementIvId);
      clearPlacementSelection();
      if(!iv) return;
      const rect = cell.getBoundingClientRect();
      const clickedSlot = (e.clientY - rect.top) < rect.height/2 ? 'matin' : 'apres-midi';
      const startDate = new Date(cell.dataset.date+'T00:00:00');
      iv.technicianId = cell.dataset.tech;
      iv.plannedDate = iso(startDate);
      iv.plannedEndDate = iso(startDate);
      iv.plannedSlot = clickedSlot;
      if(cell.dataset.lane!==undefined) iv.laneHint = parseInt(cell.dataset.lane, 10);
      if(iv.status!=='terminee') iv.status='planifiee';
      await saveState(); renderTopbar(); renderContent();
      showToast(`Intervention planifiée — ${SLOT_LABELS[clickedSlot]}`);
    });
  });

  // unassign dropzone
  const backlogZone = document.getElementById('backlog-dropzone');
  if(backlogZone){
    backlogZone.addEventListener('dragover', e=>{ e.preventDefault(); backlogZone.classList.add('dragover'); });
    backlogZone.addEventListener('dragleave', ()=>backlogZone.classList.remove('dragover'));
    backlogZone.addEventListener('drop', async e=>{
      e.preventDefault(); backlogZone.classList.remove('dragover');
      if(!dragMeta || dragMeta.mode!=='move') return;
      const iv = state.interventions.find(i=>i.id===dragMeta.id);
      if(!iv) return;
      iv.technicianId=null; iv.plannedDate=null; iv.plannedEndDate=null; iv.status='creee';
      await saveState(); renderTopbar(); renderContent();
      showToast('Retirée du planning');
    });
  }

  // click (not drag) opens detail
  document.querySelectorAll('.gantt-bar[data-iv]').forEach(el=>{
    let downX=0, downY=0;
    el.addEventListener('mousedown', e=>{ downX=e.clientX; downY=e.clientY; });
    el.addEventListener('click', e=>{
      if(e.target.classList.contains('resize-handle')) return;
      if(Math.abs(e.clientX-downX)>4 || Math.abs(e.clientY-downY)>4) return;
      openJobDetail(el.dataset.iv);
    });
  });
  document.querySelectorAll('.gantt-bar[data-conge]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const r = state.congeRequests.find(x=>x.id===el.dataset.conge);
      if(!r) return;
      if(confirm(`${CONGE_TYPE_LABELS[r.type]} du ${fmtDateLong(r.dateDebut)} au ${fmtDateLong(r.dateFinConfirmee||r.dateFin)}.\n\nRetirer ce congé du planning ?`)){
        state.congeRequests = state.congeRequests.filter(x=>x.id!==r.id);
        await saveState(); renderContent();
        showToast('Congé retiré du planning');
      }
    });
  });

  // resize handles
  document.querySelectorAll('.resize-handle').forEach(handle=>{
    handle.addEventListener('mousedown', e=>{
      e.preventDefault(); e.stopPropagation();
      startResize(handle.dataset.resize);
    });
  });
}
function startResize(id){
  const iv = state.interventions.find(i=>i.id===id);
  if(!iv || !iv.plannedDate) return;
  const grid = document.getElementById('gantt-grid');
  const barEl = grid.querySelector(`.gantt-bar[data-iv="${id}"]`);
  const startDate = new Date(iv.plannedDate+'T00:00:00');
  const startIdx = ganttDays.findIndex(d=>sameDay(d,startDate));
  if(startIdx<0) return;
  let pendingIdx = startIdx;

  function onMove(ev){
    const rect = grid.getBoundingClientRect();
    let idx = Math.floor((ev.clientX - rect.left - GANTT_NAME_W) / GANTT_COL_W);
    idx = Math.max(startIdx, Math.min(idx, ganttDays.length-1));
    pendingIdx = idx;
    barEl.style.gridColumn = (2+startIdx) + ' / ' + (2+idx+1);
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    iv.plannedEndDate = iso(ganttDays[pendingIdx]);
    saveState().then(()=>{ renderTopbar(); renderContent(); });
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

/* ---------------- déconnexion automatique après inactivité ----------------
   Protège les sessions laissées ouvertes sur un poste partagé. 30 minutes sans
   interaction (clic, clavier, défilement, tactile) → retour à l'écran d'accueil. */
const INACTIVITY_LIMIT_MS = 30*60*1000;
let lastActivityAt = Date.now();
function startInactivityWatch(){
  ['click','keydown','mousemove','touchstart','scroll'].forEach(evt=>{
    document.addEventListener(evt, ()=>{ lastActivityAt = Date.now(); }, {passive:true});
  });
  setInterval(async ()=>{
    const isAuthenticated = portal==='client-app' || portal==='tech-app' || portal==='internal-app';
    if(!isAuthenticated) return;
    if(document.querySelector('.overlay')) { lastActivityAt = Date.now(); return; } // ne pas couper en pleine saisie dans une modale
    if(Date.now() - lastActivityAt > INACTIVITY_LIMIT_MS){
      const who = portal;
      authClientId=null; authTechId=null; authInternalId=null; portal='landing';
      logAudit('auto_logout', who);
      await saveState();
      await clearSession();
      lastActivityAt = Date.now();
      render();
      showToast('Déconnecté automatiquement après 30 minutes d\u2019inactivité');
    }
  }, 30000);
}

/* ---------------- synchronisation en temps réel ----------------
   Si Firestore est configuré : écoute en direct (push), sans délai, sans sondage.
   Sinon : relecture toutes les secondes (repli). Dans les deux cas, on évite de
   perturber une saisie en cours (champ actif) ou une fenêtre ouverte. */
async function applyIncomingState(raw){
  if(!raw || raw===lastStateSnapshot) return;
  if(document.querySelector('.overlay')) return; // ne pas fermer une modale ouverte
  const activeTag = document.activeElement && document.activeElement.tagName;
  if(activeTag==='INPUT' || activeTag==='TEXTAREA' || activeTag==='SELECT') return; // ne pas couper une saisie
  try{
    const parsed = JSON.parse(raw);
    if(!isValidStateShape(parsed)) return; // donnée distante corrompue : on ignore plutôt que de planter
    state = parsed;
    await migrateState();
    lastStateSnapshot = raw;
    render();
  }catch(e){ /* JSON invalide reçu — on ignore ce cycle */ }
}
function startLiveSync(){
  if(firestoreDb){
    try{
      firestoreDb.collection(FIRESTORE_COLLECTION).doc(STORAGE_KEY).onSnapshot(
        snap => { if(snap.exists) applyIncomingState(snap.data().value); },
        err => { console.warn('Flux Firestore interrompu, repli sur le sondage local.', err); startPollingSync(); }
      );
      return; // le flux Firestore remplace le sondage périodique
    }catch(e){ console.warn('Impossible d\u2019activer le temps réel Firestore, repli sur le sondage.', e); }
  }
  startPollingSync();
}
function startPollingSync(){
  setInterval(async ()=>{
    try{ const raw = await storageAdapter.get(STORAGE_KEY, true); await applyIncomingState(raw); }
    catch(e){ /* échec silencieux — on retentera à la prochaine seconde */ }
  }, 1000);
}

/* ---------------- installation en tant qu'application (PWA) ----------------
   Nécessite que le fichier soit servi via un vrai serveur HTTPS (pas file://) —
   voir manifest.json et service-worker.js fournis à côté de ce fichier. */
let deferredInstallPrompt = null;
function initPwa(){
  // Service worker : ne s'enregistre que dans un contexte sécurisé (https, ou localhost)
  if('serviceWorker' in navigator && (window.isSecureContext || location.hostname==='localhost')){
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{ /* pas de SW dispo, on continue sans */ });
  }
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredInstallPrompt = e;
    document.querySelectorAll('.pwa-install-btn').forEach(b=>b.classList.add('visible'));
    document.getElementById('pwa-install-fab')?.classList.add('visible');
  });
  window.addEventListener('appinstalled', ()=>{
    deferredInstallPrompt = null;
    document.querySelectorAll('.pwa-install-btn').forEach(b=>b.classList.remove('visible'));
    document.getElementById('pwa-install-fab')?.classList.remove('visible');
    showToast('Application installée ✓');
  });
  async function triggerInstall(){
    if(!deferredInstallPrompt){ showToast("Utilisez le menu du navigateur : « Ajouter à l'écran d'accueil »"); return; }
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
  }
  document.body.addEventListener('click', (e)=>{
    if(e.target.closest('#pwa-install-fab') || e.target.closest('.pwa-install-btn')) triggerInstall();
  });
}
