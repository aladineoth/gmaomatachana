<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMAO Matachana — Maquette de refonte</title>
<style>
:root{
  color-scheme: light;
  --bg:#f2f4f6; --surface:#ffffff; --surface-2:#f7f8f9; --surface-3:#eef1f4;
  --border:rgba(11,11,11,.12); --border-strong:rgba(11,11,11,.22);
  --text:#0b0b0b; --text-2:#52514e; --muted:#898781;
  --brand:#14487f; --brand-2:#2a78d6; --brand-ink:#ffffff;
  --sidebar:#0e2338; --sidebar-2:#16324c; --sidebar-text:#c9d6e4; --sidebar-active:#ffffff;
  --series-1:#2a78d6; --series-2:#eb6834;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --shadow:0 1px 2px rgba(11,11,11,.06), 0 8px 24px rgba(11,11,11,.06);
  --radius:10px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#212120; --surface-3:#2a2a28;
  --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.24);
  --text:#ffffff; --text-2:#c3c2b7; --muted:#898781;
  --brand:#3987e5; --brand-2:#3987e5; --brand-ink:#0d0d0d;
  --sidebar:#121212; --sidebar-2:#1f1f1e; --sidebar-text:#c3c2b7; --sidebar-active:#ffffff;
  --series-1:#3987e5; --series-2:#d95926;
  --grid:#2c2c2a; --axis:#383835;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14px; line-height:1.45;
}
button{font:inherit; color:inherit}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.01em}
a{color:var(--brand-2); text-decoration:none}

/* ---------- Layout ---------- */
.app{display:grid; grid-template-columns:248px 1fr; min-height:100vh}
.sidebar{background:var(--sidebar); color:var(--sidebar-text); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto}
.brand{display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#2a78d6,#14487f);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.brand .name{color:#fff;font-weight:600;font-size:14px;line-height:1.1}
.brand .sub{font-size:11px;color:#8fa6bd}
.navgroup{padding:14px 10px 4px}
.navgroup .t{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:#7d94ac; padding:0 10px 6px; font-weight:600}
.navitem{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:8px 10px; border:0; background:transparent; color:var(--sidebar-text); border-radius:8px; cursor:pointer; font-size:13.5px}
.navitem:hover{background:var(--sidebar-2); color:#fff}
.navitem.active{background:var(--sidebar-2); color:var(--sidebar-active); font-weight:600; box-shadow:inset 3px 0 0 var(--series-1)}
.navitem .ic{width:18px;text-align:center;flex:none;opacity:.9}
.navitem .badge{margin-left:auto; background:var(--critical); color:#fff; border-radius:999px; font-size:10.5px; padding:1px 7px; font-weight:700}
.navitem .badge.soft{background:rgba(255,255,255,.14); color:#e6edf5}
.sidebar-foot{margin-top:auto; padding:12px; border-top:1px solid rgba(255,255,255,.08); font-size:11.5px; color:#7d94ac}

.main{display:flex; flex-direction:column; min-width:0}
.topbar{position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--border); padding:10px 20px; display:flex; align-items:center; gap:14px}
.crumb{font-size:12px;color:var(--muted)}
.topbar h1{font-size:17px}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:6px 10px; width:280px; color:var(--muted); font-size:13px}
.search input{border:0;background:transparent;outline:none;color:var(--text);width:100%;font:inherit}
.rolepick{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px}
.rolepick button{border:0;background:transparent;padding:5px 11px;border-radius:999px;cursor:pointer;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.topbar h1{white-space:nowrap}
.rolepick button.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.iconbtn{border:1px solid var(--border);background:var(--surface-2);border-radius:8px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center}
.content{padding:20px; display:flex; flex-direction:column; gap:16px; max-width:1560px; width:100%}

/* ---------- Primitives ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow)}
.card .hd{padding:13px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px}
.card .hd h3{font-size:14px}
.card .hd .sub{font-size:12px;color:var(--muted)}
.card .bd{padding:16px}
.card .bd.tight{padding:0}
.grid{display:grid; gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
@media(max-width:1200px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g23,.g2{grid-template-columns:1fr}}

.btn{border:1px solid var(--border-strong); background:var(--surface); border-radius:8px; padding:7px 13px; cursor:pointer; font-size:13px; display:inline-flex; align-items:center; gap:7px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand); color:var(--brand-ink); border-color:transparent; font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px; font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}

.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.tag .dot{width:7px;height:7px;border-radius:50%;flex:none}
.tag.neutral{background:var(--surface-3);color:var(--text-2)}
.tag.good{background:rgba(12,163,12,.12);color:#0a7a0a;border-color:rgba(12,163,12,.3)}
.tag.warning{background:rgba(250,178,25,.16);color:#8a6100;border-color:rgba(250,178,25,.4)}
.tag.serious{background:rgba(236,131,90,.16);color:#a44a20;border-color:rgba(236,131,90,.4)}
.tag.critical{background:rgba(208,59,59,.12);color:#a52a2a;border-color:rgba(208,59,59,.35)}
.tag.info{background:rgba(42,120,214,.12);color:#1c5cab;border-color:rgba(42,120,214,.3)}
:root[data-theme="dark"] .tag.good{color:#4bd44b}
:root[data-theme="dark"] .tag.warning{color:#fac559}
:root[data-theme="dark"] .tag.serious{color:#f0a582}
:root[data-theme="dark"] .tag.critical{color:#f07070}
:root[data-theme="dark"] .tag.info{color:#7fb2f0}

table{width:100%; border-collapse:collapse; font-size:13px}
th{ text-align:left; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:9px 14px; border-bottom:1px solid var(--border); background:var(--surface-2); position:sticky; top:0}
td{padding:10px 14px; border-bottom:1px solid var(--border); vertical-align:middle}
tbody tr:hover{background:var(--surface-2); cursor:pointer}
td.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sec{color:var(--text-2)}
.mono{font-variant-numeric:tabular-nums}
.strong{font-weight:600}
.tiny{font-size:11.5px}

.filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.select,.input{border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:6px 10px; font:inherit; font-size:13px; color:var(--text)}
.chip{border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:5px 12px; font-size:12.5px; cursor:pointer}
.chip.on{background:var(--brand); color:var(--brand-ink); border-color:transparent; font-weight:600}

/* ---------- Stat tiles ---------- */
.tile{padding:14px 16px; display:flex; flex-direction:column; gap:2px; position:relative; overflow:hidden}
.tile .lab{font-size:12px; color:var(--text-2)}
.tile .val{font-size:28px; font-weight:600; letter-spacing:-.02em; line-height:1.15}
.tile .sub{font-size:11.5px; color:var(--muted)}
.tile .strip{position:absolute; left:0; top:0; bottom:0; width:3px}

/* ---------- Bar chart ---------- */
.chart{width:100%}
.legend{display:flex; gap:14px; align-items:center; font-size:12px; color:var(--text-2); flex-wrap:wrap}
.legend .k{display:inline-flex; align-items:center; gap:6px}
.legend .sw{width:10px;height:10px;border-radius:3px}
.axisline{stroke:var(--axis); stroke-width:1}
.gridline{stroke:var(--grid); stroke-width:1}
.axislab{fill:var(--muted); font-size:11px}
.vallab{fill:var(--text-2); font-size:11px; font-variant-numeric:tabular-nums}

/* ---------- Planning ---------- */
.plan-wrap{display:grid; grid-template-columns:290px 1fr; gap:16px; align-items:start}
@media(max-width:1240px){.plan-wrap{grid-template-columns:1fr}}
.backlog{max-height:640px; overflow:auto}
.week{overflow:auto}
.weekgrid{min-width:900px}
.wrow{display:grid; grid-template-columns:180px repeat(5,1fr); border-bottom:1px solid var(--border)}
.wrow.head{position:sticky; top:0; background:var(--surface-2); z-index:2}
.wcell{padding:8px; min-height:104px; border-left:1px solid var(--border)}
.wcell.head{min-height:0; padding:8px 10px; font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:600}
.wcell.over{background:rgba(42,120,214,.10); outline:2px dashed var(--series-1); outline-offset:-3px}
.wtech{padding:10px; display:flex; gap:9px; align-items:flex-start}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--text-2);flex:none}
.load{height:5px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:5px}
.load i{display:block;height:100%;border-radius:999px;background:var(--series-1)}
.load.warn i{background:var(--warning)} .load.over i{background:var(--critical)}
.job{border:1px solid var(--border); border-left:3px solid var(--series-1); border-radius:7px; padding:6px 8px; background:var(--surface); margin-bottom:6px; cursor:grab; font-size:12px; box-shadow:0 1px 1px rgba(11,11,11,.04)}
.job:active{cursor:grabbing}
.job.prev{border-left-color:var(--series-1)}
.job.cur{border-left-color:var(--series-2)}
.job.urgent{border-left-color:var(--critical)}
.job .t{font-weight:600; display:block}
.job .m{color:var(--muted); font-size:11px}
.job.dragging{opacity:.4}
.job.ghost{border-style:dashed}

/* ---------- Annual plan matrix ---------- */
.matrix{overflow:auto}
.matrix table{min-width:980px}
.matrix td.m{text-align:center; padding:6px 4px}
.cellpill{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;font-variant-numeric:tabular-nums}
.cellpill.s0{color:var(--muted)}
.cellpill.s1{background:#cde2fb;color:#123a68}
.cellpill.s2{background:#86b6ef;color:#0d2c50}
.cellpill.s3{background:#2a78d6;color:#fff}
.cellpill.late{background:rgba(208,59,59,.14);color:#a52a2a;border-color:rgba(208,59,59,.5)}
.cellpill.done{background:rgba(12,163,12,.12);color:#0a7a0a;border-color:rgba(12,163,12,.35)}
.cellpill.now{box-shadow:0 0 0 2px var(--brand)}
:root[data-theme="dark"] .cellpill.s1{background:#184f95;color:#dceaff}
:root[data-theme="dark"] .cellpill.s2{background:#256abf;color:#fff}
:root[data-theme="dark"] .cellpill.late{color:#f07070}
:root[data-theme="dark"] .cellpill.done{color:#4bd44b}

/* ---------- Drawer ---------- */
.scrim{position:fixed; inset:0; background:rgba(11,11,11,.35); z-index:60; opacity:0; pointer-events:none; transition:opacity .16s}
.scrim.on{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(560px,94vw); background:var(--surface); border-left:1px solid var(--border); z-index:61; transform:translateX(100%); transition:transform .2s ease; display:flex; flex-direction:column; box-shadow:-8px 0 30px rgba(11,11,11,.15)}
.drawer.on{transform:none}
.drawer .dh{padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; gap:12px}
.drawer .db{padding:18px; overflow:auto; display:flex; flex-direction:column; gap:16px}
.drawer .df{margin-top:auto; padding:12px 18px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; background:var(--surface-2)}
.kv{display:grid; grid-template-columns:150px 1fr; gap:7px 12px; font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl:before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:1px;background:var(--border)}
.tl:last-child:before{display:none}
.tl .b{width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--series-1);margin-top:3px}
.tl .b.g{border-color:var(--good)} .tl .b.n{border-color:var(--axis)}

/* ---------- Mobile frame ---------- */
.phones{display:flex;gap:22px;flex-wrap:wrap}
.phone{width:330px;border:10px solid #10161d;border-radius:34px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow);flex:none}
.phone .ph{background:var(--brand);color:#fff;padding:12px 14px}
.phone .pb{padding:12px;display:flex;flex-direction:column;gap:10px;height:610px;overflow:auto;background:var(--bg)}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 12px}
.mrow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sig{height:80px;border:1px dashed var(--border-strong);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:12px;background:var(--surface-2)}
.mbtn{width:100%;text-align:center;justify-content:center}

/* ---------- misc ---------- */
.banner{border:1px solid var(--border); border-left:3px solid var(--warning); background:var(--surface); border-radius:8px; padding:11px 14px; display:flex; gap:10px; align-items:flex-start; font-size:13px}
.banner.info{border-left-color:var(--series-1)}
.banner.crit{border-left-color:var(--critical)}
.hide{display:none !important}
.split{display:flex;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:12px}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#0e2338;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;z-index:80;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.legendnote{font-size:11.5px;color:var(--muted)}
.tblwrap{max-height:560px;overflow:auto}
.progress{height:6px;background:var(--surface-3);border-radius:999px;overflow:hidden;min-width:80px}
.progress i{display:block;height:100%;background:var(--series-1)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">M</div>
      <div><div class="name">Matachana GMAO</div><div class="sub">Secteur Paris Nord</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">Maquette de travail — données fictives<br>v2 · refonte proposée</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div>
        <div class="crumb" id="crumb">Pilotage</div>
        <h1 id="title">Tableau de bord</h1>
      </div>
      <div class="spacer"></div>
      <div class="search"><span>⌕</span><input placeholder="Rechercher un site, une machine, un n° d'intervention…"></div>
      <div class="rolepick" id="rolepick"></div>
      <button class="iconbtn" id="themebtn" title="Thème clair / sombre">◐</button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>
<script>
/* ===========================================================
   DONNÉES DE DÉMONSTRATION (fictives, inspirées du secteur NPN)
   =========================================================== */
const TECHS = [
  {id:'fb', nom:'Ferhat Bozkurt',   ini:'FB', role:'Adjoint',    comp:['Autoclave','LD','BT','Élec'], h:39},
  {id:'an', nom:'Alfa Niang',       ini:'AN', role:'Technicien', comp:['Autoclave','LD'],             h:39},
  {id:'bs', nom:'Boubacar Seydi',   ini:'BS', role:'Technicien', comp:['LD','Autoclave'],             h:39},
  {id:'wo', nom:'Wael Othman',      ini:'WO', role:'Technicien', comp:['Autoclave','BT'],             h:39},
  {id:'yf', nom:'Yves Forestier',   ini:'YF', role:'Technicien', comp:['Autoclave','Élec'],           h:39},
  {id:'ad', nom:'Abdel Deliou',     ini:'AD', role:'Technicien', comp:['LD','BT'],                    h:39},
  {id:'ce', nom:'Cristian Echeverria',ini:'CE',role:'Technicien',comp:['Autoclave','LD','Élec'],      h:39},
];
const SITES = [
  {id:'lari', nom:'Lariboisière',                grp:'AP-HP',        ville:'Paris 10', contrat:'Full 24/7', crit:'Élevée', nb:14, ref:'fb'},
  {id:'bich', nom:'Bichat',                      grp:'AP-HP',        ville:'Paris 18', contrat:'Full',      crit:'Élevée', nb:11, ref:'an'},
  {id:'stlo', nom:'Saint-Louis',                 grp:'AP-HP',        ville:'Paris 10', contrat:'Full',      crit:'Élevée', nb:9,  ref:'ce'},
  {id:'avic', nom:'Avicenne',                    grp:'AP-HP',        ville:'Bobigny',  contrat:'Préventif', crit:'Moyenne',nb:8,  ref:'bs'},
  {id:'beau', nom:'Beaujon',                     grp:'AP-HP',        ville:'Clichy',   contrat:'Full',      crit:'Moyenne',nb:7,  ref:'yf'},
  {id:'rbal', nom:'Robert-Ballanger',            grp:'CH',           ville:'Aulnay',   contrat:'Full',      crit:'Élevée', nb:10, ref:'ad'},
  {id:'delaf',nom:'Delafontaine',                grp:'CH',           ville:'St-Denis', contrat:'Préventif', crit:'Moyenne',nb:6,  ref:'wo'},
  {id:'aphar',nom:'Ambroise Paré–Hartmann',      grp:'GHP',          ville:'Neuilly',  contrat:'Full',      crit:'Élevée', nb:9,  ref:'fb'},
  {id:'vgal', nom:'Clinique du Vert Galant',     grp:'Ramsay Santé', ville:'Tremblay', contrat:'Préventif', crit:'Faible', nb:4,  ref:'ce'},
  {id:'hpssd',nom:'Hôpital Privé Seine-St-Denis',grp:'Ramsay Santé', ville:'Le Blanc-Mesnil',contrat:'Full',crit:'Moyenne',nb:5,  ref:'an'},
];
const siteName = id => (SITES.find(s=>s.id===id)||{}).nom || id;
const techName = id => (TECHS.find(t=>t.id===id)||{}).nom || '—';
const techIni  = id => (TECHS.find(t=>t.id===id)||{}).ini || '??';

const EQUIPEMENTS = [
  {id:'AUT-1042', site:'lari', type:'Autoclave',  modele:'HS 6610-2',  serie:'A-2019-1042', gamme:'PM2 + requalification', dernier:'12/02/2026', prochain:'12/09/2026', etat:'ok',    cont:'à remplacer'},
  {id:'AUT-1043', site:'lari', type:'Autoclave',  modele:'HS 6610-2',  serie:'A-2019-1043', gamme:'PM2 + requalification', dernier:'12/02/2026', prochain:'12/09/2026', etat:'surv',  cont:'à remplacer'},
  {id:'LD-0871',  site:'lari', type:'LD',         modele:'LD 2000-4',  serie:'L-2021-0871', gamme:'PM2',                   dernier:'05/03/2026', prochain:'05/09/2026', etat:'ok',    cont:'OK'},
  {id:'BT-0210',  site:'lari', type:'BT',         modele:'BT 100',     serie:'B-2022-0210', gamme:'PM1',                   dernier:'20/01/2026', prochain:'20/07/2026', etat:'retard',cont:'OK'},
  {id:'AUT-0912', site:'bich', type:'Autoclave',  modele:'S1000-6',    serie:'A-2018-0912', gamme:'PM2 + requalification', dernier:'18/03/2026', prochain:'18/09/2026', etat:'ok',    cont:'à remplacer'},
  {id:'AUT-0913', site:'bich', type:'Autoclave',  modele:'S1000-6',    serie:'A-2018-0913', gamme:'PM2 + requalification', dernier:'18/03/2026', prochain:'18/09/2026', etat:'panne', cont:'remplacé'},

        ${i.badge && i.badge()>0 ? `<span class="badge ${i.soft?'soft':''}">${i.badge()}</span>`:''}

      b.onclick = ()=>go(i.id);
      box.appendChild(b);

   GRAPHIQUES (SVG, sans librairie)
   =========================================================== */
function chartGrouped(data, s1, s2, l1, l2, unit){
  const W=560,H=210,PL=34,PR=8,PT=16,PB=26;
  const max = Math.ceil(Math.max(...data.map(d=>Math.max(d[s1],d[s2])))/20)*20;
  const iw=W-PL-PR, ih=H-PT-PB, bw=iw/data.length;
  let g='';
  for(let i=0;i<=4;i++){ const y=PT+ih-(ih*i/4); g+=`<line class="gridline" x1="${PL}" x2="${W-PR}" y1="${y}" y2="${y}"/><text class="axislab" x="${PL-6}" y="${y+3.5}" text-anchor="end">${Math.round(max*i/4)}</text>`; }
  data.forEach((d,i)=>{
    const x=PL+i*bw, w=(bw-14)/2;
    [[d[s1],'var(--series-1)',0],[d[s2],'var(--series-2)',w+2]].forEach(([v,c,off])=>{
      const bh=ih*v/max, y=PT+ih-bh;
      g+=`<rect x="${x+7+off}" y="${y}" width="${w}" height="${bh}" rx="4" fill="${c}"><title>${d.m} — ${v} ${unit}</title></rect>`;
      g+=`<text class="vallab" x="${x+7+off+w/2}" y="${y-4}" text-anchor="middle">${v}</text>`;
    });
    g+=`<text class="axislab" x="${x+bw/2}" y="${H-8}" text-anchor="middle">${d.m}</text>`;
  });
  g+=`<line class="axisline" x1="${PL}" x2="${W-PR}" y1="${PT+ih}" y2="${PT+ih}"/>`;
  return `<div class="legend" style="margin-bottom:8px">
      <span class="k"><span class="sw" style="background:var(--series-1)"></span>${l1}</span>
      <span class="k"><span class="sw" style="background:var(--series-2)"></span>${l2}</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${l1} et ${l2} par mois">${g}</svg>`;
}
function chartLinePct(data, cible){
  const W=560,H=200,PL=34,PR=20,PT=16,PB=26;
  const iw=W-PL-PR, ih=H-PT-PB, min=60, max=100;
  const y=v=>PT+ih-ih*(v-min)/(max-min);
  const x=i=>PL+iw*i/(data.length-1);
  let g='';
  for(let v=60;v<=100;v+=10) g+=`<line class="gridline" x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}"/><text class="axislab" x="${PL-6}" y="${y(v)+3.5}" text-anchor="end">${v}%</text>`;
  g+=`<line x1="${PL}" x2="${W-PR}" y1="${y(cible)}" y2="${y(cible)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text class="axislab" x="${W-PR}" y="${y(cible)-5}" text-anchor="end" fill="var(--good)">objectif ${cible}%</text>`;
  g+=`<polyline fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" points="${data.map((d,i)=>`${x(i)},${y(d.v)}`).join(' ')}"/>`;
  data.forEach((d,i)=>{
    g+=`<circle cx="${x(i)}" cy="${y(d.v)}" r="4.5" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"><title>${d.m} — ${d.v}%</title></circle>`;
    g+=`<text class="vallab" x="${x(i)+(i===0?6:i===data.length-1?-6:0)}" y="${y(d.v)-11}" text-anchor="${i===0?'start':i===data.length-1?'end':'middle'}">${d.v}%</text>`;
    g+=`<text class="axislab" x="${x(i)}" y="${H-8}" text-anchor="middle">${d.m}</text>`;
  });
  g+=`<line class="axisline" x1="${PL}" x2="${W-PR}" y1="${PT+ih}" y2="${PT+ih}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Taux de respect des échéances préventives par mois">${g}</svg>`;
}

    JOURS.forEach((j,ji)=>{
      const jobs = PLANNING.filter(p=>p.tech===t.id && p.jour===ji);
      html += `<div class="wcell drop" data-tech="${t.id}" data-jour="${ji}">${jobs.map(p=>jobCard(p,'plan')).join('')}</div>`;
    });
    html += `</div>`;
  });
  wg.innerHTML = html;
  bindDnD();
}
function bindDnD(){
  document.querySelectorAll('.job').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      DRAG = {id:el.dataset.id, from:el.dataset.from};
      el.classList.add('dragging'); e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain', el.dataset.id);
    });
    el.addEventListener('dragend', ()=>el.classList.remove('dragging'));
  });
  document.querySelectorAll('.wcell.drop').forEach(cell=>{
    cell.addEventListener('dragover', e=>{ e.preventDefault(); cell.classList.add('over'); });
    cell.addEventListener('dragleave', ()=>cell.classList.remove('over'));
    cell.addEventListener('drop', e=>{
      e.preventDefault(); cell.classList.remove('over');
      if(!DRAG) return;
      deposer(DRAG, cell.dataset.tech, +cell.dataset.jour);
      DRAG=null;
    });
  });
  const bl=$('#blbody');
  if(bl){
    bl.addEventListener('dragover', e=>e.preventDefault());
    bl.addEventListener('drop', e=>{
      e.preventDefault();
      if(!DRAG || DRAG.from!=='plan') return;
      const i = PLANNING.findIndex(p=>p.id===DRAG.id);
      const p = PLANNING.splice(i,1)[0];
      BACKLOG.unshift({id:p.id, type:p.type, site:p.site, titre:p.titre, h:p.h, comp:p.comp, fen:'à replanifier', urgent:p.urgent});
      DRAG=null; toast('Intervention renvoyée dans la file de planification'); go('sem');
    });
  }
}
function deposer(drag, techId, jour){
  const tech = TECHS.find(t=>t.id===techId);
  let job;
  if(drag.from==='backlog'){
    const i = BACKLOG.findIndex(b=>b.id===drag.id); if(i<0) return;
    job = BACKLOG.splice(i,1)[0];
    job.statut='planifiee';
  } else {
    job = PLANNING.find(p=>p.id===drag.id); if(!job) return;
  }
  const chargeJour = PLANNING.filter(p=>p.tech===techId&&p.jour===jour&&p.id!==job.id).reduce((a,b)=>a+b.h,0);
  const alerts=[];
  job.alerte = false;
  if(!tech.comp.includes(job.comp)){ alerts.push(`${tech.nom} n'a pas l'habilitation « ${job.comp} »`); job.alerte=true; }
  if(chargeJour + job.h > 7){ alerts.push(`journée chargée : ${chargeJour + job.h} h planifiées`); }
  const memeSite = PLANNING.some(p=>p.tech===techId&&p.jour===jour&&p.site===job.site&&p.id!==job.id);
  job.tech=techId; job.jour=jour;
  if(drag.from==='backlog') PLANNING.push(job);
  go('sem');
  if(alerts.length) toast('⚠ ' + alerts.join(' · '));
  else if(memeSite) toast('✓ Regroupé avec une autre intervention du même site — trajet économisé');
  else toast(`✓ ${job.id} affectée à ${tech.nom}, ${JOURS[jour]}`);
}

     <button class="btn primary" onclick="genererMois('${siteId}',${mois})">Générer ${n} intervention${n>1?'s':''} → file</button>`);

function genererMois(siteId, mois){
  const n = Math.abs(PLAN_ANNUEL[siteId][mois]);
  const eqs = EQUIPEMENTS.filter(e=>e.site===siteId).slice(0,Math.max(1,n));
  const grouped = Math.max(1, Math.ceil(n/2));
  for(let i=0;i<grouped;i++){
    const e = eqs[i] || eqs[0];
    BACKLOG.unshift({id:'INT-'+(5570+BACKLOG.length+i), type:'prev', site:siteId,
      titre:`${e.gamme.split(' ')[0]} — ${e.id}${n>1&&grouped<n?' (+1)':''}`,
      h: e.gamme.includes('requal')?6:4, comp: e.type==='LD'?'LD':e.type==='BT'?'BT':'Autoclave',
      fen:`${MOIS[mois]} 2026`, retard: PLAN_ANNUEL[siteId][mois]<0});
  }
  PLAN_ANNUEL[siteId][mois]=0;
  closeDrawer(); toast(`${grouped} intervention(s) générée(s) → file de planification`);
  go('sem');
}

    </div>`, `<button class="btn" data-close>Fermer</button><button class="btn">Historique complet</button><button class="btn primary">Planifier une intervention</button>`);
}
function viewEquipe(v){
  v.appendChild(h(`<div class="card"><div class="bd tight"><table>
    <thead><tr><th>Technicien</th><th>Rôle</th><th>Habilitations</th><th>Sites référent</th><th>Charge S34</th><th>Congés à venir</th></tr></thead>
    <tbody>${TECHS.map(t=>{
      const c=chargeTech(t.id), pct=Math.min(100,c/39*100);
      return `<tr><td class="strong"><div class="split"><span class="avatar">${t.ini}</span>${t.nom}</div></td>
      <td>${t.role}</td><td><div class="pillrow">${t.comp.map(x=>`<span class="tag neutral">${x}</span>`).join('')}</div></td>
      <td>${SITES.filter(s=>s.ref===t.id).map(s=>s.nom).join(', ')||'<span class="muted">—</span>'}</td>
      <td><div class="split"><div class="progress" style="width:110px"><i style="width:${pct}%;background:${c>39?'var(--critical)':c>32?'var(--warning)':'var(--series-1)'}"></i></div><span class="mono tiny">${c} h</span></div></td>
      <td class="tiny muted">${['—','24–28 août','—','7–18 sept.','—','—','31 août – 4 sept.'][TECHS.indexOf(t)]}</td></tr>`;
    }).join('')}</tbody></table></div></div>`));
  v.appendChild(h(`<div class="note">Les habilitations alimentent le contrôle au dépôt dans le planning : une intervention « basse température » ne peut pas être affectée à un technicien qui n'a pas la compétence.
    Les congés retirent automatiquement la capacité de la semaine concernée.</div>`));
}

/* ===========================================================
   DÉMARRAGE
   =========================================================== */
renderRoles();
go('dash');

</script>
